<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${note.title} + ' | Shared Note'">📝 Shared Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: #f8f9fa;
        }
        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card-header {
            background: white;
            border-bottom: 1px solid #f1f3f5;
            padding: 16px 20px;
        }
        .card-body {
            padding: 20px;
        }
        h1.note-title {
            font-size: 1.8rem;
            margin-bottom: 0;
        }
        .note-content {
            margin-top: 20px;
            line-height: 1.6;
        }
        .note-content p {
            margin-bottom: 1rem;
        }
        .note-content img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 1rem 0;
        }
        .note-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .note-content table th,
        .note-content table td {
            border: 1px solid #dee2e6;
            padding: 0.5rem;
        }
        .folder-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
        }
        
        /* Mobile responsive styles */
        @media (max-width: 767px) {
            .container {
                padding: 4px;
            }
            .card {
                border-radius: 10px;
                margin-bottom: 0;
                min-height: 80vh;
            }
            .card-header {
                padding: 10px 8px 8px 8px;
            }
            h1.note-title {
                font-size: 1.2rem;
                margin-bottom: 6px;
                word-break: break-word;
            }
            .folder-badge {
                display: block;
                margin-top: 6px;
                margin-bottom: 4px;
            }
            .card-body {
                padding: 10px 8px 8px 8px;
                max-height: 60vh;
                overflow-y: auto;
            }
            .note-content {
                margin-top: 10px;
                font-size: 15px;
                line-height: 1.5;
                word-break: break-word;
            }
            .note-content img {
                width: 100%;
                height: auto;
                margin: 0.5rem 0;
            }
            .note-content table {
                display: block;
                width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .row.justify-content-center {
                margin: 0;
            }
        }
    </style>
</head>

<body style="font-family: var(--font-family), system-ui, sans-serif !important;">
    <!-- Shared navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h1 class="note-title" th:text="${note.title}">Note Title</h1>
                            <div class="d-flex flex-column flex-md-row align-items-md-center mt-1">
                                <span class="badge bg-primary folder-badge" th:text="${note.folder}">Folder</span>
                                <span class="text-muted ms-md-2 small mt-1 mt-md-0" th:if="${note.updatedAt != null}" th:text="${#temporals.format(note.updatedAt, 'dd MMM yyyy, HH:mm')}">Last updated: 01 Jan 2023, 12:00</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="note-content" th:utext="${processedContent}">
                            Note content goes here...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Shared footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <div class="fixed-bottom bg-white border-top d-flex justify-content-around py-2 d-md-none" style="z-index: 1200;">
        <button class="btn btn-secondary flex-fill mx-1" onclick="window.history.back()"><i class="bi bi-arrow-left"></i> Back</button>
        <button class="btn btn-outline-primary flex-fill mx-1" onclick="navigator.clipboard.writeText(window.location.href)"><i class="bi bi-share"></i> Share</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function() {
        fetch('/settings/api').then(r => r.json()).then(settings => {
            if (settings.headerBgColor) document.documentElement.style.setProperty('--header-bg', settings.headerBgColor);
            if (settings.headerTextColor) document.documentElement.style.setProperty('--header-text', settings.headerTextColor);
            if (settings.backgroundColor) document.documentElement.style.setProperty('--background-color', settings.backgroundColor);
            if (settings.fontSize) document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
            if (settings.fontFamily) document.documentElement.style.setProperty('--font-family', settings.fontFamily);
            if (settings.borderRadius) document.documentElement.style.setProperty('--border-radius', settings.borderRadius + 'px');
        });
    })();
    </script>
</body>

</html>
