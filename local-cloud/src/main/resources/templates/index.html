<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Local Cloud</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        .progress-bar.bg-warning {
            background-color: #ffc107 !important;
        }

        .progress-bar {
            transition: width 0.3s ease;
            font-weight: bold;
        }


        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-size, 160px), 1fr));
            gap: 1rem;
        }

        .file-card img,
        .file-card video {
            width: 100%;
            height: auto;
            max-height: 120px;
            object-fit: cover;
        }

        .upload-box {
            border: 2px dashed #aaa;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-box:hover {
            background-color: #f8f9fa;
        }

        .upload-box.dragover {
            border-color: #0d6efd;
            background-color: #e0f0ff;
        }

        .btn-check+.btn-outline-secondary {
            transition: background-color 0.2s ease;
        }

        .btn-check:checked+.btn-outline-secondary {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }

        .dropdown-menu {
            font-size: 0.9rem;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-4">
        <h2 class="mb-3">📁 Local Cloud</h2>

        <!-- Upload Section -->
        <div class="mb-4">
            <label id="uploadBox" class="upload-box w-100">
                <p>📤 Drag & drop files here or click to select</p>
                <input type="file" id="fileInput" multiple hidden>
            </label>
            <ul id="selectedFileList" class="list-group mt-3"></ul>
            <button class="btn btn-primary mt-2" onclick="uploadFiles()">Upload</button>
            <div id="convertOption" class="form-check mt-2 d-none">
                <input class="form-check-input" type="checkbox" value="" id="convertToSmall" checked>
                <label class="form-check-label" for="convertToSmall">
                    Convert to smaller size before uploading to Jira (video only)
                </label>
            </div>
        </div>

        <!-- Toolbar -->
        <div
            class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3 p-2 bg-white border rounded shadow-sm">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <!-- View Size -->
                <div class="dropdown">
                    <button class="btn btn-light border rounded-pill px-3 dropdown-toggle" data-bs-toggle="dropdown">
                        🔳 View
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" onclick="setCardSize('120px')">Small Grid</a></li>
                        <li><a class="dropdown-item" href="#" onclick="setCardSize('160px')">Medium Grid</a></li>
                        <li><a class="dropdown-item" href="#" onclick="setCardSize('240px')">Large Grid</a></li>
                    </ul>
                </div>

                <!-- Sort -->
                <div class="dropdown">
                    <button class="btn btn-light border rounded-pill px-3 dropdown-toggle" data-bs-toggle="dropdown">
                        ⇅ Sort by
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" onclick="sortCards('name')">Name</a></li>
                        <li><a class="dropdown-item" href="#" onclick="sortCards('type')">Type</a></li>
                    </ul>
                </div>
                <!-- View Mode Toggle (List/Grid) -->
                <div class="btn-group ms-2" role="group" aria-label="View Mode">
                    <input type="radio" class="btn-check" name="viewMode" id="gridView" autocomplete="off" checked
                        onchange="toggleViewMode('grid')">
                    <label class="btn btn-outline-secondary btn-sm" for="gridView"><i
                            class="bi bi-grid-3x3-gap"></i></label>

                    <input type="radio" class="btn-check" name="viewMode" id="listView" autocomplete="off"
                        onchange="toggleViewMode('list')">
                    <label class="btn btn-outline-secondary btn-sm" for="listView"><i class="bi bi-list-ul"></i></label>
                </div>
            </div>

            <!-- Filters -->
            <div class="d-flex flex-wrap gap-2">
                <input class="btn-check" type="checkbox" id="filterAll" checked onchange="toggleAllFilters()">
                <label class="btn btn-outline-primary rounded-pill btn-sm" for="filterAll">🗂 All</label>

                <input class="btn-check" type="checkbox" id="filterImages" checked onchange="syncFilterState()">
                <label class="btn btn-outline-secondary rounded-pill btn-sm" for="filterImages">📷 Images</label>

                <input class="btn-check" type="checkbox" id="filterVideos" checked onchange="syncFilterState()">
                <label class="btn btn-outline-secondary rounded-pill btn-sm" for="filterVideos">🎥 Videos</label>

                <input class="btn-check" type="checkbox" id="filterDocuments" checked onchange="syncFilterState()">
                <label class="btn btn-outline-secondary rounded-pill btn-sm" for="filterDocuments">📄 Docs</label>

                <input class="btn-check" type="checkbox" id="filterOthers" checked onchange="syncFilterState()">
                <label class="btn btn-outline-secondary rounded-pill btn-sm" for="filterOthers">❔ Others</label>
            </div>
        </div>

        <!-- File Grid -->
        <!-- File Grid -->
        <div id="gridContainer" class="file-grid">
            <style>
                .file-card[data-ext='apk'] {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    height: 100%;
                }

                .file-card[data-ext='apk'] img {
                    width: 64px;
                    height: 64px;
                    margin-bottom: 8px;
                }

                .file-card[data-ext='apk'] .apk-name {
                    font-size: 0.9em;
                    text-align: center;
                    word-break: break-word;
                    max-width: 100%;
                    margin-bottom: 8px;
                }

                .file-card img.previewable {
                    width: 100%;
                    height: auto;
                    max-height: 120px;
                    object-fit: cover;
                }
            </style>

            <div class="file-card card text-center p-2" th:each="file : ${files}" th:data-ext="${file.extension}"
                th:data-name="${file.name}">
                <div th:switch="${file.extension}">

                    <!-- Images -->
                    <img th:case="'jpg'" th:src="@{'/uploads/' + ${file.name}}"
                        th:attr="data-src=@{'/uploads/' + ${file.name}}, data-type='image'" class="previewable" />

                    <img th:case="'jpeg'" th:src="@{'/uploads/' + ${file.name}}"
                        th:attr="data-src=@{'/uploads/' + ${file.name}}, data-type='image'" class="previewable" />

                    <img th:case="'png'" th:src="@{'/uploads/' + ${file.name}}"
                        th:attr="data-src=@{'/uploads/' + ${file.name}}, data-type='image'" class="previewable" />

                    <img th:case="'gif'" th:src="@{'/uploads/' + ${file.name}}"
                        th:attr="data-src=@{'/uploads/' + ${file.name}}, data-type='image'" class="previewable" />

                    <img th:case="'webp'" th:src="@{'/uploads/' + ${file.name}}"
                        th:attr="data-src=@{'/uploads/' + ${file.name}}, data-type='image'" class="previewable" />

                    <!-- Videos -->
                    <video th:case="'mp4'" controls th:src="@{'/uploads/' + ${file.name}}"
                        th:attr="data-src=@{'/uploads/' + ${file.name}}, data-type='video'" class="previewable"></video>

                    <video th:case="'mov'" controls th:src="@{'/uploads/' + ${file.name}}"
                        th:attr="data-src=@{'/uploads/' + ${file.name}}, data-type='video'" class="previewable"></video>

                    <video th:case="'webm'" controls th:src="@{'/uploads/' + ${file.name}}"
                        th:attr="data-src=@{'/uploads/' + ${file.name}}, data-type='video'" class="previewable"></video>

                    <!-- APK -->
                    <div th:case="'apk'" class="text-center">
                        <i class="bi bi-android2 display-4 text-success"></i>
                    </div>

                    <!-- Others -->
                    <img th:case="*" th:src="@{/icons/doc.png}" />
                </div>

                <!-- File Name -->
                <small class="d-block text-truncate mt-2" style="max-width: 100%;" th:text="${file.name}"></small>

                <!-- Footer Info -->
                <div class="d-flex justify-content-between align-items-center mt-2 px-1 small text-muted">

                    <!-- Download -->
                    <a th:href="@{'/uploads/' + ${file.name}}" download title="Download">
                        <i class="bi bi-download"></i>
                    </a>

                    <!-- Duration (only for videos) -->
                    <span th:if="${T(java.util.Arrays).asList('mp4','mov','webm').contains(file.extension)}"
                        data-duration></span>

                    <!-- File Size -->
                    <span th:text="${#numbers.formatDecimal(file.size / 1024.0 / 1024.0, 1, 1)} + ' MB'"></span>

                    <!-- Metadata Modal Trigger -->
                    <a href="#" class="text-muted" title="View Info" data-bs-toggle="modal"
                        th:attr="data-name=${file.name}, data-ext=${file.extension}, data-size=${file.size}, data-time=${#dates.format(file.timestamp, 'dd/MM/yyyy HH:mm')}"
                        onclick="showMetadataModal(this)">
                        <i class="bi bi-eye"></i>
                    </a>
                </div>
            </div>
        </div>


        <!-- List View -->
        <div id="listContainer" class="d-none">
            <div class="list-group" id="listViewContent" th:each="file : ${files}" th:data-ext="${file.extension}"
                th:data-name="${file.name}">
                <div class="list-group-item d-flex align-items-center justify-content-between small gap-2">
                    <!-- Icon -->
                    <i
                        th:class="'bi me-2 fs-5 ' + ${file.extension == 'mp4' || file.extension == 'mov' || file.extension == 'webm' ? 'bi-film' :
                                            file.extension == 'jpg' || file.extension == 'jpeg' || file.extension == 'png' ? 'bi-image' :
                                            file.extension == 'apk' ? 'bi-android2 text-success' : 'bi-file-earmark'}"></i>

                    <!-- Name -->
                    <span class="flex-grow-1 text-truncate" th:text="${file.name}"></span>

                    <!-- Size -->
                    <span class="text-muted"
                        th:text="${#numbers.formatDecimal(file.size / 1024.0 / 1024.0, 1, 1)} + ' MB'"></span>

                    <!-- Timestamp -->
                    <span class="text-muted" th:text="${#dates.format(file.timestamp, 'dd/MM HH:mm')}"></span>

                    <!-- Duration -->
                    <span th:if="${T(java.util.Arrays).asList('mp4','mov','webm').contains(file.extension)}"
                        data-duration></span>

                    <!-- Download -->
                    <a th:href="@{'/uploads/' + ${file.name}}" download title="Download"><i
                            class="bi bi-download"></i></a>

                    <!-- View Info -->
                    <a href="#" title="View Info" data-bs-toggle="modal"
                        th:attr="data-name=${file.name}, data-ext=${file.extension}, data-size=${file.size}, data-time=${#dates.format(file.timestamp, 'dd/MM/yyyy HH:mm')}"
                        onclick="showMetadataModal(this)">
                        <i class="bi bi-eye"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>



    <!-- Upload Overlay UI -->
    <div id="uploadOverlay" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none"
        style="z-index: 1050;">
        <div class="d-flex justify-content-center align-items-center h-100">
            <div class="bg-white p-4 rounded shadow" style="width: 400px; max-height: 90vh; overflow-y: auto;">
                <h5>Uploading Files...</h5>
                <ul id="fileProgressList" class="list-unstyled mb-0"></ul>
            </div>
        </div>
    </div>

    <!-- Fullscreen Preview Modal -->
    <!-- Fullscreen Preview Modal -->
    <div id="previewModal" class="position-fixed top-0 start-0 w-100 h-100 d-none"
        style="background: rgba(0,0,0,0.9); z-index: 1100;">
        <!-- Close button OUTSIDE of media container -->
        <button onclick="closePreview()" class="btn btn-light position-absolute top-0 end-0 m-3 shadow"
            style="z-index: 9999;">✖</button>

        <div class="d-flex justify-content-center align-items-center h-100">
            <img id="previewImage" class="d-none rounded" style="max-width: 95vw; max-height: 90vh;" />
            <video id="previewVideo" class="d-none rounded" style="max-width: 95vw; max-height: 90vh;" controls></video>
        </div>
    </div>

    <div class="modal fade" id="metadataModal" tabindex="-1" aria-labelledby="metadataLabel" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="metadataLabel">File Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body small">
                    <p><strong>Name:</strong> <span id="metaName"></span></p>
                    <p><strong>Extension:</strong> <span id="metaExt"></span></p>
                    <p><strong>Size:</strong> <span id="metaSize"></span> bytes</p>
                    <p><strong>Uploaded:</strong> <span id="metaTime"></span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script>
        const uploadBox = document.getElementById("uploadBox");
        const fileInput = document.getElementById("fileInput");

        uploadBox.addEventListener("dragover", e => {
            e.preventDefault();
            uploadBox.classList.add("dragover");
        });
        uploadBox.addEventListener("dragleave", () => {
            uploadBox.classList.remove("dragover");
        });
        uploadBox.addEventListener("drop", e => {
            e.preventDefault();
            uploadBox.classList.remove("dragover");
            fileInput.files = e.dataTransfer.files;
        });

        async function uploadFiles() {
            const files = fileInput.files;
            if (!files.length) {
                alert("Please select files.");
                return;
            }

            const overlay = document.getElementById("uploadOverlay");
            const listContainer = document.getElementById("fileProgressList");
            const convertChecked = document.getElementById("convertToSmall").checked;

            listContainer.innerHTML = "";
            overlay.classList.remove("d-none");

            const CHUNK_SIZE = 1 * 1024 * 1024;
            const MAX_CONCURRENT = 3;

            const queue = Array.from(files).map(file => {
                const item = document.createElement("li");
                item.innerHTML = `
            <div><strong>${file.name}</strong></div>
            <div class="progress mb-2">
              <div class="progress-bar progress-bar-striped" id="progress-${file.name}" style="width: 0%">0%</div>
            </div>`;
                listContainer.appendChild(item);
                return () => uploadFileChunks(file, CHUNK_SIZE, convertChecked);
            });

            while (queue.length) {
                const batch = queue.splice(0, MAX_CONCURRENT);
                await Promise.all(batch.map(fn => fn()));
            }

            overlay.classList.add("d-none");
            alert("✅ All files uploaded!");
            window.location.reload();
        }

        async function uploadFileChunks(file, CHUNK_SIZE, convert) {
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            const uploads = [];

            for (let i = 0; i < totalChunks; i++) {
                const chunk = file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                const formData = new FormData();
                formData.append("chunk", chunk);
                formData.append("filename", file.name);
                formData.append("chunkIndex", i);
                formData.append("totalChunks", totalChunks);
                uploads.push(fetch("/upload-chunk", { method: "POST", body: formData }));
            }

            let uploaded = 0;
            const bar = document.getElementById("progress-" + file.name);

            for (const p of uploads) {
                await p;
                uploaded++;
                const percent = Math.floor((uploaded / totalChunks) * 100);
                bar.style.width = percent + "%";
                bar.innerText = percent + "%";
            }

            let timer = 0;
            let intervalId;

            if (convert && file.type.startsWith("video/")) {
                bar.classList.add("bg-warning");
                bar.classList.remove("bg-success");
                bar.innerText = "Optimizing... 0s";

                intervalId = setInterval(() => {
                    timer++;
                    bar.innerText = `Optimizing... ${timer}s`;
                }, 1000);
            }

            await fetch("/merge-chunks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ filename: file.name, totalChunks, convert })
            });

            if (intervalId) clearInterval(intervalId);

            bar.style.width = "100%";
            bar.classList.remove("bg-warning");
            bar.classList.add("bg-success");
            bar.innerText = "Done";
        }


        function setCardSize(size) {
            document.documentElement.style.setProperty('--card-size', size);
        }

        function sortCards(by) {
            const grid = document.getElementById("fileGrid");
            const cards = Array.from(grid.children);
            cards.sort((a, b) => {
                const aVal = a.getAttribute(by === 'type' ? 'data-ext' : 'data-name').toLowerCase();
                const bVal = b.getAttribute(by === 'type' ? 'data-ext' : 'data-name').toLowerCase();
                return aVal.localeCompare(bVal);
            });
            cards.forEach(card => grid.appendChild(card));
        }

        function applyFilters() {
            const cards = document.querySelectorAll("#fileGrid .file-card");
            const imageExt = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
            const videoExt = ['mp4', 'mov', 'webm'];
            const docExt = ['pdf', 'doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx', 'apk', 'ipa'];

            const filters = {
                images: document.getElementById("filterImages").checked,
                videos: document.getElementById("filterVideos").checked,
                documents: document.getElementById("filterDocuments").checked,
                others: document.getElementById("filterOthers").checked
            };

            cards.forEach(card => {
                const ext = card.getAttribute("data-ext");
                let show = false;
                if (imageExt.includes(ext) && filters.images) show = true;
                else if (videoExt.includes(ext) && filters.videos) show = true;
                else if (docExt.includes(ext) && filters.documents) show = true;
                else if (!imageExt.includes(ext) && !videoExt.includes(ext) && !docExt.includes(ext) && filters.others) show = true;
                card.style.display = show ? "block" : "none";
            });
        }

        function toggleAllFilters() {
            const checked = document.getElementById("filterAll").checked;
            document.getElementById("filterImages").checked = checked;
            document.getElementById("filterVideos").checked = checked;
            document.getElementById("filterDocuments").checked = checked;
            document.getElementById("filterOthers").checked = checked;
            applyFilters();
        }

        function syncFilterState() {
            const allOn =
                document.getElementById("filterImages").checked &&
                document.getElementById("filterVideos").checked &&
                document.getElementById("filterDocuments").checked &&
                document.getElementById("filterOthers").checked;
            document.getElementById("filterAll").checked = allOn;
            applyFilters();
        }

        function showPreview(src, type) {
            const modal = document.getElementById("previewModal");
            const img = document.getElementById("previewImage");
            const vid = document.getElementById("previewVideo");

            img.classList.add("d-none");
            vid.classList.add("d-none");

            if (type === "image") {
                img.src = src;
                img.classList.remove("d-none");
            } else {
                vid.src = src;
                vid.classList.remove("d-none");
            }

            modal.classList.remove("d-none");
        }

        function closePreview() {
            const modal = document.getElementById("previewModal");
            const img = document.getElementById("previewImage");
            const vid = document.getElementById("previewVideo");

            // Hide modal
            modal.classList.add("d-none");

            // Reset image
            img.src = "";
            img.classList.add("d-none");

            // Reset video
            vid.pause();
            vid.currentTime = 0;
            vid.src = "";
            vid.classList.add("d-none");
        }

        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll(".previewable").forEach(el => {
                el.addEventListener("click", function () {
                    const src = el.getAttribute("data-src");
                    const type = el.getAttribute("data-type");
                    showPreview(src, type);
                });
            });
        });

        fileInput.addEventListener("change", () => {
            const hasVideo = Array.from(fileInput.files).some(f => f.type.startsWith("video/"));
            document.getElementById("convertOption").classList.toggle("d-none", !hasVideo);
        });

        document.querySelectorAll("video.previewable").forEach(video => {
            video.addEventListener("loadedmetadata", () => {
                const duration = video.duration;
                const mins = Math.floor(duration / 60);
                const secs = Math.floor(duration % 60).toString().padStart(2, '0');
                const label = video.closest(".file-card").querySelector("[data-duration]");
                if (label) {
                    label.textContent = `${mins}:${secs}`;
                }
            });
        });

        fileInput.addEventListener("change", () => {
            const list = document.getElementById("selectedFileList");
            list.innerHTML = "";
            Array.from(fileInput.files).forEach(file => {
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.textContent = file.name;
                const size = document.createElement("span");
                size.className = "badge bg-secondary rounded-pill";
                size.textContent = (file.size / 1024 / 1024).toFixed(1) + " MB";
                li.appendChild(size);
                list.appendChild(li);
            });

            const hasVideo = Array.from(fileInput.files).some(f => f.type.startsWith("video/"));
            document.getElementById("convertOption").classList.toggle("d-none", !hasVideo);
        });

        function showMetadataModal(el) {
            document.getElementById("metaName").innerText = el.dataset.name;
            document.getElementById("metaExt").innerText = el.dataset.ext;
            document.getElementById("metaSize").innerText = el.dataset.size;
            document.getElementById("metaTime").innerText = el.dataset.time;
            new bootstrap.Modal(document.getElementById("metadataModal")).show();
        }

        function toggleViewMode(mode) {
            const grid = document.getElementById("gridContainer");
            const list = document.getElementById("listContainer");

            if (mode === 'list') {
                grid.classList.add("d-none");
                list.classList.remove("d-none");
            } else {
                list.classList.add("d-none");
                grid.classList.remove("d-none");
            }
        }


    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
