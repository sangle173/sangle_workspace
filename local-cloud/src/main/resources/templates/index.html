<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Local Cloud - List View</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .btn-upload {
            background: linear-gradient(to right, #0d6efd, #0dcaf0);
            border: none;
            color: white;
            padding: 0.5rem 1.5rem;
            font-weight: 500;
            border-radius: 30px;
            transition: all 0.2s ease-in-out;
        }

        .btn-upload:hover {
            background: linear-gradient(to right, #0b5ed7, #31d2f2);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
        }

        .file-name-truncate {
            max-width: 200px;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: bottom;
        }

        .preview-modal-fixed {
            width: 700px;
            max-width: 95vw;
            height: 500px;
            max-height: 95vh;
        }
        .preview-modal-body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #previewImage, #previewVideo {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            margin: auto;
        }
    </style>
</head>

<body class="bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container py-4">
        <!-- Upload Section -->
        <div class="mb-4">
            <label id="uploadBox" class="upload-box w-100 border border-secondary rounded p-4 text-center">
                <p class="mb-1">📤 Drag & drop files here or click to select</p>
                <input type="file" id="fileInput" multiple hidden>
            </label>
            <ul id="selectedFileList" class="list-group mt-3"></ul>
            <div class="text-center">
                <button class="btn btn-upload mt-3" onclick="uploadFiles()">⬆️ Upload Selected Files</button>
            </div>
            <div id="convertOption" class="d-none text-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="convertToSmall" checked>
                    <label class="form-check-label" for="convertToSmall">
                        Convert video before uploading
                    </label>
                </div>
                <div id="qualityOptions" class="mt-2">
                    <div class="btn-group" role="group">
                        <input type="radio" class="btn-check" name="quality" id="quality360" value="360" autocomplete="off">
                        <label class="btn btn-outline-secondary btn-sm" for="quality360">360p (Low)</label>

                        <input type="radio" class="btn-check" name="quality" id="quality480" value="480" autocomplete="off">
                        <label class="btn btn-outline-secondary btn-sm" for="quality480">480p (Medium)</label>

                        <input type="radio" class="btn-check" name="quality" id="quality720" value="720" autocomplete="off" checked>
                        <label class="btn btn-outline-secondary btn-sm" for="quality720">720p (High)</label>

                        <input type="radio" class="btn-check" name="quality" id="quality1080" value="1080" autocomplete="off">
                        <label class="btn btn-outline-secondary btn-sm" for="quality1080">1080p (Ultra)</label>
                    </div>
                </div>
            </div>
            <div id="uploadProgressContainer" class="progress mt-3" style="height: 20px; display: none;">
                <div id="uploadProgressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                    role="progressbar" style="width: 0%">0%</div>
            </div>

        </div>

        <!-- File Table Desktop -->
        <div class="table-responsive d-none d-sm-block">
            <table class="table table-striped table-hover table-sm mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Size</th>
                        <th>Last Modified</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="file : ${files}">
                        <td>
                            <div class="d-flex align-items-center">
                                <span class="file-icon me-3" th:attr="data-filename=${file.name}"></span>
                                <span class="fw-semibold cursor-pointer" th:text="${file.name}"
                                    th:attr="onclick=|showPreview('/uploads/' + '${file.name}')|">
                                </span>
                            </div>
                        </td>
                        <td th:text="${#numbers.formatDecimal(file.size / 1024.0 / 1024.0, 1, 1)} + ' MB'"></td>
                        <td>
                            <span
                                th:if="${#dates.format(file.timestamp, 'yyyy-MM-dd') == #dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                class="text-success"
                                th:text="${#dates.format(file.timestamp, 'HH:mm')} + ' Today'"></span>
                            <span
                                th:unless="${#dates.format(file.timestamp, 'yyyy-MM-dd') == #dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                th:text="${#dates.format(file.timestamp, 'HH:mm dd/MM')}"></span>
                        </td>
                        <td>
                            <a th:href="@{'/uploads/' + ${file.name}}" download>
                                <i class="bx bx-download text-secondary" style="font-size: 1.3rem;"
                                    title="Download"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- File Table Mobile -->
        <div class="table-responsive d-block d-sm-none">
            <table class="table table-sm mb-0">
                <tbody>
                    <tr th:each="file : ${files}" class="border-top">
                        <td>
                            <div class="d-flex align-items-start pt-2">
                                <!-- Replace the <i> icon block with: -->
                                <span class="file-icon me-3" th:attr="data-filename=${file.name}"></span>
                                <div class="flex-grow-1">
                                    <div class="fw-semibold file-name-truncate cursor-pointer" th:text="${file.name}"
                                        th:attr="onclick=|showPreview('/uploads/' + '${file.name}')|">
                                    </div>
                                    <div class="text-muted small">
                                        <span
                                            th:text="${#numbers.formatDecimal(file.size / 1024.0 / 1024.0, 1, 1)} + ' MB'"></span>
                                        &middot;
                                        <span
                                            th:if="${#dates.format(file.timestamp, 'yyyy-MM-dd') == #dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                            class="text-success"
                                            th:text="${#dates.format(file.timestamp, 'HH:mm')} + ' Today'"></span>
                                        <span
                                            th:unless="${#dates.format(file.timestamp, 'yyyy-MM-dd') == #dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                            th:text="${#dates.format(file.timestamp, 'HH:mm dd/MM')}"></span>
                                    </div>
                                </div>
                                <div class="ms-auto pt-1">
                                    <a th:href="@{'/uploads/' + ${file.name}}" download>
                                        <i class="bx bx-download text-secondary fs-5" title="Download"></i>
                                    </a>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered preview-modal-fixed">
            <div class="modal-content" style="height: 100%;">
                <div class="modal-header">
                    <h5 class="modal-title">File Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body preview-modal-body">
                    <img id="previewImage" class="img-fluid d-none" alt="Preview">
                    <video id="previewVideo" controls class="d-none">
                        <source id="videoSource" src="" type="">
                        Your browser does not support the video tag.
                    </video>
                    <div id="previewInfo" class="d-none">
                        <p class="text-muted">This file cannot be previewed directly. Please download it or check its properties below:</p>
                        <div class="text-start mb-2">
                            <strong>File Path:</strong> <span id="filePathDisplay"></span><br>
                            <strong>Extension:</strong> <span id="fileExtDisplay"></span>
                        </div>
                        <a id="downloadLink" href="#" download class="btn btn-sm btn-outline-primary">
                            ⬇️ Download This File
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Overlay UI -->
    <div id="uploadOverlay" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none"
        style="z-index: 1050;">
        <div class="d-flex justify-content-center align-items-center h-100">
            <div class="bg-white p-4 rounded shadow" style="width: 400px; max-height: 90vh; overflow-y: auto;">
                <h5>Uploading Files...</h5>
                <ul id="fileProgressList" class="list-unstyled mb-0"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const uploadBox = document.getElementById("uploadBox");
        const fileInput = document.getElementById("fileInput");

        uploadBox.addEventListener("dragover", e => {
            e.preventDefault();
            uploadBox.classList.add("bg-light");
        });
        uploadBox.addEventListener("dragleave", () => {
            uploadBox.classList.remove("bg-light");
        });
        uploadBox.addEventListener("drop", e => {
            e.preventDefault();
            uploadBox.classList.remove("bg-light");
            fileInput.files = e.dataTransfer.files;
            updateFileList();
        });
        fileInput.addEventListener("change", updateFileList);

        function updateFileList() {
            const list = document.getElementById("selectedFileList");
            list.innerHTML = "";
            Array.from(fileInput.files).forEach(file => {
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.textContent = file.name;
                const size = document.createElement("span");
                size.className = "badge bg-secondary rounded-pill";
                size.textContent = (file.size / 1024 / 1024).toFixed(1) + " MB";
                li.appendChild(size);
                list.appendChild(li);
            });
            const hasVideo = Array.from(fileInput.files).some(f => f.type.startsWith("video/"));
            document.getElementById("convertOption").classList.toggle("d-none", !hasVideo);
        }

        async function uploadFiles() {
            const files = fileInput.files;
            if (!files.length) {
                alert("Please select files.");
                return;
            }

            const overlay = document.getElementById("uploadOverlay");
            const listContainer = document.getElementById("fileProgressList");
            const convertChecked = document.getElementById("convertToSmall").checked;
            const selectedQuality = document.querySelector('input[name="quality"]:checked').value;

            listContainer.innerHTML = "";
            overlay.classList.remove("d-none");

            const CHUNK_SIZE = 1 * 1024 * 1024;
            const MAX_CONCURRENT = 3;

            const queue = Array.from(files).map(file => {
                const item = document.createElement("li");
                item.innerHTML = `
        <div><strong>${file.name}</strong></div>
        <div class="progress mb-2">
          <div class="progress-bar progress-bar-striped" id="progress-${file.name}" style="width: 0%">0%</div>
        </div>`;
                listContainer.appendChild(item);
                return () => uploadFileChunks(file, CHUNK_SIZE, convertChecked, selectedQuality);
            });

            while (queue.length) {
                const batch = queue.splice(0, MAX_CONCURRENT);
                await Promise.all(batch.map(fn => fn()));
            }

            overlay.classList.add("d-none");
            alert("✅ All files uploaded!");
            window.location.reload();
        }

        async function uploadFileChunks(file, CHUNK_SIZE, convert, quality) {
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            const uploads = [];

            for (let i = 0; i < totalChunks; i++) {
                const chunk = file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                const formData = new FormData();
                formData.append("chunk", chunk);
                formData.append("filename", file.name);
                formData.append("chunkIndex", i);
                formData.append("totalChunks", totalChunks);
                formData.append("quality", quality);
                uploads.push(fetch("/upload-chunk", { method: "POST", body: formData }));
            }

            let uploaded = 0;
            const bar = document.getElementById("progress-" + file.name);

            for (const p of uploads) {
                await p;
                uploaded++;
                const percent = Math.floor((uploaded / totalChunks) * 100);
                bar.style.width = percent + "%";
                bar.innerText = percent + "%";
            }

            let timer = 0;
            let intervalId;

            if (convert && file.type.startsWith("video/")) {
                bar.classList.add("bg-warning");
                bar.classList.remove("bg-success");
                bar.innerText = "Optimizing... 0s";

                intervalId = setInterval(() => {
                    timer++;
                    bar.innerText = `Optimizing... ${timer}s`;
                }, 1000);
            }

            await fetch("/merge-chunks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    filename: file.name,
                    totalChunks,
                    convert,
                    quality
                })
            });

            if (intervalId) clearInterval(intervalId);

            bar.style.width = "100%";
            bar.classList.remove("bg-warning");
            bar.classList.add("bg-success");
            bar.innerText = "Done";
        }
        function showPreview(filePath) {
            const isImage = /\.(jpe?g|png|gif|webp)$/i.test(filePath);
            const isVideo = /\.(mp4|mov|webm)$/i.test(filePath);
            const extMatch = filePath.match(/\.([a-z0-9]+)$/i);
            const extension = extMatch ? extMatch[1].toLowerCase() : "";

            const img = document.getElementById("previewImage");
            const vid = document.getElementById("previewVideo");
            const info = document.getElementById("previewInfo");
            const filePathDisplay = document.getElementById("filePathDisplay");
            const fileExtDisplay = document.getElementById("fileExtDisplay");
            const downloadLink = document.getElementById("downloadLink");
            const videoSource = document.getElementById("videoSource");

            // Reset
            img.classList.add("d-none");
            vid.classList.add("d-none");
            info.classList.add("d-none");

            if (isImage) {
                img.src = filePath + '?v=' + Date.now();
                img.classList.remove("d-none");
            } else if (isVideo) {
                let mime = "video/mp4";
                if (extension === "mov") mime = "video/quicktime";
                if (extension === "webm") mime = "video/webm";

                videoSource.src = filePath + '?v=' + Date.now();
                videoSource.type = mime;

                vid.load();
                vid.classList.remove("d-none");
            } else {
                // Unsupported preview
                filePathDisplay.textContent = filePath;
                fileExtDisplay.textContent = extension || "unknown";
                downloadLink.href = filePath;
                info.classList.remove("d-none");
            }

            const modal = new bootstrap.Modal(document.getElementById('previewModal'));
            
            // Add event listener to stop video when modal is closed
            const previewModal = document.getElementById('previewModal');
            previewModal.addEventListener('hidden.bs.modal', function () {
                if (vid) {
                    vid.pause();
                    vid.currentTime = 0;
                }
            });

            modal.show();
        }


        window.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll('.file-name-truncate').forEach(el => {
                const fullName = el.textContent.trim();
                const maxLen = 50;
                const dotIndex = fullName.lastIndexOf(".");
                const ext = dotIndex > -1 ? fullName.substring(dotIndex) : "";
                const nameOnly = dotIndex > -1 ? fullName.substring(0, dotIndex) : fullName;

                if (nameOnly.length + ext.length > maxLen) {
                    const shortName = nameOnly.substring(0, maxLen - ext.length - 3) + '...' + ext;
                    el.textContent = shortName;
                    el.title = fullName;
                }
            });
        });

        function getFileIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();

            switch (ext) {
                case 'apk':
                    return '<i class="bi bi-android2 text-success fs-3"></i>';  // Android icon
                case 'ipa':
                    return '<i class="bi bi-phone-fill text-primary fs-3"></i>'; // iOS icon
                case 'pdf':
                    return '<i class="bi bi-file-earmark-pdf-fill text-danger fs-3"></i>';
                case 'jpg':
                case 'jpeg':
                case 'png':
                case 'gif':
                    return '<i class="bi bi-image-fill text-info fs-3"></i>';
                case 'mp4':
                case 'mov':
                    return '<i class="bi bi-camera-reels-fill text-warning fs-3"></i>';
                default:
                    return '<i class="bi bi-file-earmark-fill text-secondary fs-3"></i>';
            }
        }

        document.querySelectorAll('.file-icon').forEach(span => {
            const fileName = span.dataset.filename;
            span.innerHTML = getFileIcon(fileName);
        });


    </script>
</body>

</html>
