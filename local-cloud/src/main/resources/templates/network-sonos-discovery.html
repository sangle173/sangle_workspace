<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Network Sonos Discovery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container my-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h2>Network Sonos Discovery</h2>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary" href="/network-sonos-discovery/devices">
                    <i class="bi bi-table"></i> View Discovered Devices
                </a>
                <button class="btn btn-success" id="autoScanBtn">
                    <i class="bi bi-wifi"></i> Auto Scan All Networks
                </button>
            </div>
        </div>
        <div id="wifiListContainer">
            <h5>Available Wifi Networks</h5>
            <table class="table table-bordered" id="wifiTable">
                <thead><tr><th>#</th><th>SSID</th><th>Subnet</th><th>Status</th><th>Scan</th></tr></thead>
                <tbody id="wifiTableBody"></tbody>
            </table>
            <div class="text-muted small" id="wifiHint">Only active networks (with subnet) can be scanned. Connect to a network to enable scanning.</div>
        </div>
        <div id="scanResult" class="mt-4"></div>
        <div id="autoScanProgress" class="mt-3"></div>
        <!-- CSV Export Section -->
        <div class="mt-4">
            <button class="btn btn-outline-success" id="exportCsvBtn">
                <i class="bi bi-file-earmark-spreadsheet"></i> Export All Devices to CSV
            </button>
        </div>
        <!-- Embedded JSON for all devices (populated by Thymeleaf) -->
        <script id="allDevicesJson" type="application/json" th:utext="${allDevicesJson}"></script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // On page load, fetch available wifi networks
    let wifiList = [];
    fetch('/network-sonos-discovery/wifi-list').then(r=>r.json()).then(list=>{
        wifiList = list;
        const tbody = document.getElementById('wifiTableBody');
        tbody.innerHTML = '';
        list.forEach((w,i)=>{
            const active = w.active === 'true';
            const canScan = !!w.subnet;
            tbody.innerHTML += `<tr>
                <td>${i+1}</td>
                <td>${w.ssid}</td>
                <td>${w.subnet || '<span class="text-muted">N/A</span>'}</td>
                <td>${active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td>
                <td><button class="btn btn-sm btn-primary scanOneBtn" data-idx="${i}" ${canScan ? '' : 'disabled title="Connect to scan"'}>Scan</button></td>
            </tr>`;
        });
        // Attach scan buttons
        document.querySelectorAll('.scanOneBtn').forEach(btn=>{
            btn.onclick = function() {
                const idx = this.getAttribute('data-idx');
                const net = wifiList[idx];
                if (!net.subnet) return;
                document.getElementById('scanResult').innerHTML = `Scanning ${net.ssid}...`;
                fetch('/network-sonos-discovery/scan', {
                    method:'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ssid: net.ssid, subnet: net.subnet})
                }).then(r=>r.json()).then(res=>{
                    document.getElementById('scanResult').innerHTML = res.message || 'Scan complete.';
                });
            };
        });
    });
    // Remove or disable the old scan all button
    if (document.getElementById('scanBtn')) document.getElementById('scanBtn').style.display = 'none';

    // Auto Scan All Networks button functionality with SSE progress
    document.getElementById('autoScanBtn').onclick = function() {
        document.getElementById('scanResult').innerHTML = 'Auto-scanning all networks...';
        document.getElementById('autoScanProgress').innerHTML = '';
        const progressDiv = document.getElementById('autoScanProgress');
        let scanDone = false;
        const evtSource = new EventSource('/network-sonos-discovery/auto-scan/progress');
        evtSource.onmessage = function(e) {
            const msg = e.data;
            if (msg === '__SCAN_DONE__') {
                scanDone = true;
                evtSource.close();
                progressDiv.innerHTML += '<div class="text-success">Auto-scan complete.</div>';
                return;
            }
            progressDiv.innerHTML += `<div>${msg}</div>`;
            progressDiv.scrollTop = progressDiv.scrollHeight;
        };
        evtSource.onerror = function() {
            evtSource.close();
            if (!scanDone) {
                progressDiv.innerHTML += '<div class="text-danger">Auto-scan ended or connection lost.</div>';
            }
        };
    };

    // CSV Export Logic
    document.getElementById('exportCsvBtn').onclick = function() {
        const allDevicesJson = document.getElementById('allDevicesJson');
        let allDevices = [];
        if (allDevicesJson) {
            try {
                allDevices = JSON.parse(allDevicesJson.textContent);
            } catch (e) {
                alert('Failed to parse device data for export.');
                return;
            }
        }
        if (!allDevices || allDevices.length === 0) {
            alert('No device data found.');
            return;
        }
        // CSV mapping and order
        const csvFields = [
            { label: 'UPNP Name', key: 'roomName' },
            { label: 'UUID', key: 'uuid' },
            { label: 'IP', key: 'ip' },
            { label: 'MAC', key: 'MACAddress' },
            { label: 'Serial', key: 'serialNum' },
            { label: 'SW Version', key: 'softwareVersion' },
            { label: 'MinCompat Version', key: 'minCompatibleVersion' },
            { label: 'Market Version', key: 'displayVersion' },
            { label: 'HW Version', key: 'hardwareVersion' },
            { label: 'HW Model', key: 'modelNumber' },
            { label: 'HHID', key: 'householdId' },
            { label: 'Status URL', key: 'statusUrl' }
        ];
        // Build CSV rows
        const rows = [csvFields.map(f => f.label)];
        allDevices.forEach(dev => {
            // Compose UUID and Status URL if needed
            let uuid = dev['UDN'] || dev['uuid'] || '';
            if (uuid.startsWith('uuid:')) uuid = uuid.substring(5);
            let statusUrl = dev['ip'] ? `http://${dev['ip']}:1400/status` : '';
            rows.push(csvFields.map(f => {
                if (f.key === 'uuid') return uuid;
                if (f.key === 'statusUrl') return statusUrl;
                return dev[f.key] || '';
            }));
        });
        // Convert to CSV string
        const csv = rows.map(row => row.map(val => '"' + String(val).replace(/"/g,'""') + '"').join(',')).join('\r\n');
        // Download
        const blob = new Blob([csv], {type: 'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sonos_devices.csv';
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>{
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
    };
    </script>
</body>
</html>
