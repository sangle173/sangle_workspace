<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Network Sonos Discovery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container my-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h2>Network Sonos Discovery</h2>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary" href="/network-sonos-discovery/devices">
                    <i class="bi bi-table"></i> View Discovered Devices
                </a>
                <button class="btn btn-success" id="autoScanBtn">
                    <i class="bi bi-wifi"></i> Auto Scan All Networks
                </button>
            </div>
        </div>
        <div id="wifiListContainer">
            <h5>Available Wifi Networks</h5>
            <table class="table table-bordered" id="wifiTable">
                <thead><tr><th>#</th><th>SSID</th><th>Subnet</th><th>Status</th><th>Scan</th></tr></thead>
                <tbody id="wifiTableBody"></tbody>
            </table>
            <div class="text-muted small" id="wifiHint">Only active networks (with subnet) can be scanned. Connect to a network to enable scanning.</div>
        </div>
        <div id="scanResult" class="mt-4"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // On page load, fetch available wifi networks
    let wifiList = [];
    fetch('/network-sonos-discovery/wifi-list').then(r=>r.json()).then(list=>{
        wifiList = list;
        const tbody = document.getElementById('wifiTableBody');
        tbody.innerHTML = '';
        list.forEach((w,i)=>{
            const active = w.active === 'true';
            const canScan = !!w.subnet;
            tbody.innerHTML += `<tr>
                <td>${i+1}</td>
                <td>${w.ssid}</td>
                <td>${w.subnet || '<span class="text-muted">N/A</span>'}</td>
                <td>${active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td>
                <td><button class="btn btn-sm btn-primary scanOneBtn" data-idx="${i}" ${canScan ? '' : 'disabled title="Connect to scan"'}>Scan</button></td>
            </tr>`;
        });
        // Attach scan buttons
        document.querySelectorAll('.scanOneBtn').forEach(btn=>{
            btn.onclick = function() {
                const idx = this.getAttribute('data-idx');
                const net = wifiList[idx];
                if (!net.subnet) return;
                document.getElementById('scanResult').innerHTML = `Scanning ${net.ssid}...`;
                fetch('/network-sonos-discovery/scan', {
                    method:'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ssid: net.ssid, subnet: net.subnet})
                }).then(r=>r.json()).then(res=>{
                    document.getElementById('scanResult').innerHTML = res.message || 'Scan complete.';
                });
            };
        });
    });
    // Remove or disable the old scan all button
    document.getElementById('scanBtn').style.display = 'none';

    // Auto Scan All Networks button functionality
    document.getElementById('autoScanBtn').onclick = function() {
        document.getElementById('scanResult').innerHTML = 'Auto-scanning all networks...';
        fetch('/network-sonos-discovery/auto-scan', {method:'POST'}).then(r=>r.json()).then(res=>{
            document.getElementById('scanResult').innerHTML = res.message || 'Auto-scan complete.';
        });
    };
    </script>
</body>
</html>
