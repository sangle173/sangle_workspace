<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✏️ Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <script th:src="@{/js/utils.js}"></script>
    <style>
        /* CKEditor image styles */
        .ck-content .image {
            margin: 1em 0;
            max-width: 100%;
        }

        .ck-content .image img {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            min-width: 50px;
        }

        /* Default size for images */
        .ck-content .image:not(.image-style-side):not(.image-style-align-left):not(.image-style-align-right) img {
            max-width: 50%;
        }

        /* Image alignment styles */
        .ck-content .image.image-style-align-center {
            margin-left: auto;
            margin-right: auto;
        }

        .ck-content .image.image-style-align-left {
            float: left;
            margin-right: 1.5em;
            max-width: 50%;
        }

        .ck-content .image.image-style-align-right {
            float: right;
            margin-left: 1.5em;
            max-width: 50%;
        }

        /* Side image style */
        .ck-content .image.image-style-side {
            float: right;
            margin-left: 1.5em;
            max-width: 50%;
        }

        /* Upload progress styles */
        #uploadProgressContainer {
            margin-top: 10px;
            display: none;
        }

        /* Autosave status style */
        #autosaveStatus {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 5px 10px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 12px;
            display: none;
            z-index: 1000;
        }

        /* Drag over style for editor */
        .ck-editor__editable.drag-over {
            border: 2px dashed #1a73e8 !important;
            background-color: rgba(26, 115, 232, 0.05);
        }

        /* Images in view mode */
        .note-content-view img {
            max-width: 50%;
            height: auto;
        }

        .note-content-view img.image-style-align-left {
            float: left;
            margin-right: 1.5em;
        }

        .note-content-view img.image-style-align-right {
            float: right;
            margin-left: 1.5em;
        }

        .note-content-view img.image-style-align-center {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Note Form -->
            <div class="col-md-10">
                <h2 th:text="${note.id} != null ? '✏️ Edit Note' : '🆕 Create Note'"></h2>

                <form id="noteForm" th:object="${note}"
                    th:action="@{/spaces/{space}/categories/{category}/notes/save(space=${note.space}, category=${note.category})}"
                    method="post">
                    <input type="hidden" th:field="*{id}" id="noteId" />
                    <input type="hidden" th:field="*{space}" />
                    <input type="hidden" th:field="*{category}" />
                    <input type="hidden" th:field="*{folderName}" />

                    <div class="mb-3">
                        <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" th:field="*{title}" required />
                    </div>

                    <div class="mb-3">
                        <label for="contentHtml" class="form-label">Content</label>
                        <textarea id="contentHtml" th:field="*{contentHtml}" class="form-control" rows="15"></textarea>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/spaces/{space}/categories/{category}/notes(space=${note.space}, category=${note.category})}"
                            class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Notes
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Save Note
                        </button>
                    </div>
                </form>
            </div>

            <!-- Attachments Sidebar -->
            <div class="col-md-2">
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">📎</h6>
                        <input type="file" id="fileInput" multiple style="display: none">
                        <button id="triggerFileInput" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-folder2-open"></i>
                        </button>
                    </div>
                    <div id="dropZone" class="card-body p-2 border border-dashed text-muted text-center"
                        style="min-height: 120px;">
                        Drop files here or click
                    </div>
                    <div class="card-footer text-end">
                        <button id="uploadBtn" class="btn btn-sm btn-success" disabled>
                            <i class="bi bi-upload"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Toast -->
    <div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050">
        <div id="autoSaveToast" class="toast align-items-center text-bg-light border-0" role="alert" aria-live="polite"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Auto-saved
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        let editor;
        let selectedFiles = [];
        let isNoteSaved = false;

        $(document).ready(function () {
            // Initialize CKEditor
            ClassicEditor
                .create(document.querySelector('#contentHtml'))
                .then(newEditor => {
                    editor = newEditor;
                });

            // File picker
            $('#triggerFileInput').click(() => $('#fileInput').click());

            $('#fileInput').on('change', function () {
                if (this.files.length > 0) {
                    selectedFiles = Array.from(this.files);
                    renderFileList();
                    $('#uploadBtn').prop('disabled', !isNoteSaved);
                }
            });

            // Drag and drop
            const dropZone = document.getElementById('dropZone');
            dropZone.addEventListener('dragover', e => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
            dropZone.addEventListener('drop', e => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                selectedFiles = Array.from(e.dataTransfer.files);
                renderFileList();
                $('#uploadBtn').prop('disabled', !isNoteSaved);
            });

            // Upload
            $('#uploadBtn').click(function () {
                const noteId = $('#noteId').val();
                const space = $('#noteForm input[name="space"]').val();
                const category = $('#noteForm input[name="category"]').val();

                const button = $(this);
                button.prop('disabled', true);

                selectedFiles.forEach(file => {
                    const formData = new FormData();
                    formData.append('file', file);

                    $.ajax({
                        url: `/api/notes/${space}/${category}/${noteId}/upload`,
                        type: 'POST',
                        data: formData,
                        processData: false,
                        contentType: false,
                        success: function (res) {
                            if (res.url) {
                                if (file.type.startsWith('image/')) {
                                    insertMediaToEditor(res.url, true);
                                } else {
                                    insertMediaToEditor(res.url, false);
                                }
                            }
                        },
                        error: function (xhr) {
                            console.error('Upload error:', xhr);
                        }
                    });
                });

                selectedFiles = [];
                renderFileList();
            });

            // Title input triggers auto-save
            $('#title').on('input', function () {
                const title = $(this).val().trim();
                if (title.length > 0 && !isNoteSaved) {
                    autoSaveNote();
                }
            });
        });

        function renderFileList() {
            const list = $('#dropZone');
            list.empty();

            if (selectedFiles.length === 0) {
                list.html(`<div class="text-muted p-2 text-center">No files selected</div>`);
                return;
            }

            selectedFiles.forEach(file => {
                const item = `<div class="list-group-item small d-flex justify-content-between align-items-center">
                    ${file.name} <span class="text-muted">${(file.size / 1024).toFixed(1)} KB</span>
                </div>`;
                list.append(item);
            });
        }

        function insertMediaToEditor(url, isImage) {
            if (!editor) return;

            if (isImage) {
                editor.model.change(writer => {
                    const imageElement = writer.createElement('imageBlock', { src: url });
                    editor.model.insertContent(imageElement, editor.model.document.selection);
                });
            } else {
                const fileName = url.split('/').pop();
                const html = `<p><a href="${url}" target="_blank">${fileName}</a></p>`;
                const viewFragment = editor.data.processor.toView(html);
                const modelFragment = editor.data.toModel(viewFragment);
                editor.model.insertContent(modelFragment);
            }
        }

        function autoSaveNote() {
            const title = $('#title').val().trim();
            const noteId = $('#noteId').val();
            const space = $('#noteForm input[name="space"]').val();
            const category = $('#noteForm input[name="category"]').val();
            const folderName = $('#noteForm input[name="folderName"]').val();

            const payload = {
                id: noteId || null,
                title: title,
                space: space,
                category: category,
                folderName: folderName
            };

            $.ajax({
                url: `/spaces/${space}/categories/${category}/notes/autosave`,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.success) {
                        $('#noteId').val(res.id);
                        $('#noteForm input[name="folderName"]').val(res.folderName);
                        isNoteSaved = true;
                        $('#uploadBtn').prop('disabled', selectedFiles.length === 0 ? true : false);
                        showToast("✅ Note auto-saved");
                    } else {
                        showToast("❌ Auto-save failed: " + res.error, true);
                    }
                },
                error: function (err) {
                    showToast("❌ Auto-save error", true);
                    console.error("Auto-save error", err);
                }

            });
        }

        function showToast(message, isError = false) {
            const toastEl = document.getElementById('autoSaveToast');
            const toastBody = document.getElementById('toastMessage');

            toastBody.textContent = message;
            toastEl.classList.remove('text-bg-danger', 'text-bg-success', 'text-bg-light');
            toastEl.classList.add(isError ? 'text-bg-danger' : 'text-bg-success');

            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

    </script>
</body>

</html>
