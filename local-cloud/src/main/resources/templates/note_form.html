<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNewNote ? 'New Note' : 'Edit Note'}">Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/note.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>
</head>

<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container mt-4">
        <div class="row">
            <!-- Main note editing area -->
            <div class="col-md-10">
                <div class="card">
                    <div class="card-body">
                        <form th:object="${note}" method="post"
                            th:action="@{/spaces/{space}/categories/{category}/notes/save(space=${note.space}, category=${note.category})}"
                            id="noteForm">
                            <input type="hidden" th:field="*{id}">
                            <input type="hidden" th:field="*{space}">
                            <input type="hidden" th:field="*{category}">
                            <input type="hidden" th:field="*{folderName}">
                            <input type="hidden" th:field="*{createdAt}">
                            <input type="hidden" th:field="*{updatedAt}">

                            <div class="mb-3">
                                <input type="text" class="form-control form-control-lg" th:field="*{title}"
                                    placeholder="Title" required>
                            </div>

                            <div class="mb-3">
                                <textarea id="contentHtml" th:field="*{contentHtml}" style="display: none;"></textarea>
                            </div>

                            <div class="row mb-3">
                                <div class="col">
                                    <div id="editor">
                                        <!-- CKEditor will be initialized here -->
                                        <th:block th:utext="${note != null ? note.contentHtml : ''}"></th:block>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/spaces/{space}/categories/{category}/notes(space=${note.space}, category=${note.category})}"
                                    class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Back
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Save
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Attachments panel -->
            <div class="col-md-2">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Attachments</h5>
                    </div>
                    <div class="card-body">
                        <div id="dropZone" class="border rounded p-3 mb-3 text-center">
                            <i class="bi bi-cloud-upload fs-2"></i>
                            <p class="mb-0">Drop files here or click to upload</p>
                            <input type="file" id="fileInput" multiple style="display: none;">
                        </div>

                        <div id="attachmentsList" class="file-list"></div>
                        
                        <div id="uploadProgress" class="upload-progress" style="display: none;">
                            <div class="upload-progress-bar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/utils.js}"></script>
    <script th:inline="javascript">
        let editor;
        const noteId = /*[[${note.id}]]*/ '';
        const space = /*[[${note.space}]]*/ '';
        const category = /*[[${note.category}]]*/ '';
        let autoSaveTimeout;

        // Initialize CKEditor
        ClassicEditor
            .create(document.querySelector('#editor'), {
                // Prevent base64 encoding of pasted images
                clipboard: {
                    uploadImage: false
                },

                // Configure image upload
                image: {
                    upload: {
                        types: ['jpeg', 'png', 'gif', 'bmp', 'webp', 'tiff', 'svg'],
                    },
                    toolbar: [
                        'imageStyle:inline',
                        'imageStyle:wrapText',
                        'imageStyle:breakText',
                        '|',
                        'toggleImageCaption',
                        'imageTextAlternative',
                        '|',
                        'resizeImage'
                    ],
                    resizeUnit: '%',
                    resizeOptions: [
                        {
                            name: 'resizeImage:original',
                            value: null,
                            icon: 'original'
                        },
                        {
                            name: 'resizeImage:25',
                            value: '25',
                            icon: 'small'
                        },
                        {
                            name: 'resizeImage:50',
                            value: '50',
                            icon: 'medium'
                        },
                        {
                            name: 'resizeImage:75',
                            value: '75',
                            icon: 'large'
                        }
                    ],
                    styles: {
                        options: [
                            'inline',
                            'alignLeft',
                            'alignCenter',
                            'alignRight',
                            'block',
                            'side'
                        ]
                    }
                },

                // Configure media embed for videos
                mediaEmbed: {
                    previewsInData: true,
                    elementName: 'figure',
                    className: 'media'
                }
            })
            .then(newEditor => {
                editor = newEditor;

                // Auto-save on content change
                editor.model.document.on('change:data', () => {
                    if (autoSaveTimeout) clearTimeout(autoSaveTimeout);
                    autoSaveTimeout = setTimeout(autoSave, 2000);
                    
                    // Update the hidden textarea with current editor content
                    document.getElementById('contentHtml').value = editor.getData();
                });

                // Handle form submission
                document.getElementById('noteForm').addEventListener('submit', function(e) {
                    // Ensure the hidden textarea has the latest editor content
                    document.getElementById('contentHtml').value = editor.getData();
                });

                // Handle paste events
                editor.editing.view.document.on('paste', (evt, data) => {
                    if (data.dataTransfer && data.dataTransfer.files.length > 0) {
                        evt.stop();
                        handlePastedFiles(Array.from(data.dataTransfer.files));
                    }
                });

                // Handle drop events
                editor.editing.view.document.on('drop', (evt, data) => {
                    if (data.dataTransfer && data.dataTransfer.files.length > 0) {
                        evt.stop();
                        handlePastedFiles(Array.from(data.dataTransfer.files));
                    }
                });

                // Only load attachments if we have a noteId
                if (noteId) {
                    loadAttachments();
                }
            })
            .catch(error => console.error(error));

        // Auto-save functionality
        function autoSave() {
            const titleInput = document.querySelector('input[name="title"]');
            const title = titleInput.value.trim();

            if (!title) return; // Don't auto-save if title is empty

            const formData = {
                id: noteId,
                space: space,
                category: category,
                title: title,
                contentHtml: editor.getData()
            };

            fetch(`/spaces/${space}/categories/${category}/notes/autosave`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.id) {
                    noteId = data.id;
                    // Load attachments after first successful save
                    if (!document.querySelector('#attachmentsList').children.length) {
                        loadAttachments();
                    }
                }
            })
            .catch(error => console.error('Auto-save error:', error));
        }

        // Handle file uploads
        async function handlePastedFiles(files) {
            for (const file of files) {
                await uploadFile(file);
            }
        }

        async function uploadFile(file) {
            // If note hasn't been saved yet, save it first
            if (!noteId) {
                const titleInput = document.querySelector('input[name="title"]');
                const title = titleInput.value.trim();
                
                if (!title) {
                    alert('Please enter a title before uploading files');
                    return;
                }

                const formData = {
                    id: noteId,
                    space: space,
                    category: category,
                    title: title,
                    contentHtml: editor.getData()
                };

                try {
                    const saveResponse = await fetch(`/spaces/${space}/categories/${category}/notes/autosave`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });

                    const saveData = await saveResponse.json();
                    if (!saveData.success || !saveData.id) {
                        throw new Error('Failed to save note');
                    }
                    noteId = saveData.id;
                } catch (error) {
                    console.error('Error saving note:', error);
                    alert('Please save the note first before uploading files');
                    return;
                }
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`/spaces/${space}/categories/${category}/notes/${noteId}/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.success) {
                    if (fileTypeUtils.isImage(file)) {
                        insertContentIntoCKEditor(editor, createImageElement(data.url, file.name));
                    } else if (fileTypeUtils.isVideo(file)) {
                        insertContentIntoCKEditor(editor, createVideoElement(data.url, file.type));
                    }
                    await loadAttachments(); // Refresh attachments list
                }
            } catch (error) {
                console.error('Upload error:', error);
            }
        }

        // Load existing attachments
        async function loadAttachments() {
            try {
                const response = await fetch(`/spaces/${space}/categories/${category}/notes/${noteId}/attachments`);
                const data = await response.json();

                if (data.success) {
                    const attachmentsList = document.getElementById('attachmentsList');
                    attachmentsList.innerHTML = '';

                    for (const file of data.attachments) {
                        const preview = await createAttachmentPreview(file);
                        attachmentsList.appendChild(preview);

                        preview.addEventListener('dragstart', (e) => {
                            preview.classList.add('dragging');
                            e.dataTransfer.setData('text/plain', file.url);
                            e.dataTransfer.effectAllowed = 'copy';
                        });

                        preview.addEventListener('dragend', () => {
                            preview.classList.remove('dragging');
                        });
                    }
                }
            } catch (error) {
                console.error('Error loading attachments:', error);
            }
        }

        // Set up drag and drop for the drop zone
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            handlePastedFiles(Array.from(e.target.files));
            fileInput.value = ''; // Reset input
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                handlePastedFiles(Array.from(e.dataTransfer.files));
            }
        });

        // Handle drag and drop from attachments panel to editor
        document.querySelector('.ck-editor__editable').addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            document.querySelector('.ck-editor__editable').classList.add('drop-target');
        });

        document.querySelector('.ck-editor__editable').addEventListener('dragleave', () => {
            document.querySelector('.ck-editor__editable').classList.remove('drop-target');
        });

        document.querySelector('.ck-editor__editable').addEventListener('drop', (e) => {
            e.preventDefault();
            document.querySelector('.ck-editor__editable').classList.remove('drop-target');

            const url = e.dataTransfer.getData('text/plain');
            if (url) {
                const preview = document.querySelector(`[data-url="${url}"]`);
                if (preview) {
                    if (preview.querySelector('img')) {
                        insertContentIntoCKEditor(editor, createImageElement(url));
                    } else if (preview.querySelector('video')) {
                        insertContentIntoCKEditor(editor, createVideoElement(url, preview.dataset.type));
                    }
                }
            }
        });

        // Additional script for handling file uploads and drag-and-drop
        const attachmentsList = document.getElementById('attachmentsList');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressBar = uploadProgress.querySelector('.upload-progress-bar');

        async function handleFileUpload(file, insertIntoEditor) {
            const formData = new FormData();
            formData.append('file', file);

            // Show progress bar
            uploadProgress.style.display = 'block';
            progressBar.style.width = '0%';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Upload failed');

                const data = await response.json();

                if (insertIntoEditor) {
                    if (fileTypeUtils.isImage(file)) {
                        const imageHtml = createImageElement(data.url, '');
                        insertContentIntoCKEditor(editor, imageHtml);
                    } else if (fileTypeUtils.isVideo(file)) {
                        const videoHtml = createVideoElement(data.url, file.type);
                        insertContentIntoCKEditor(editor, videoHtml);
                    }
                }

                // Add to attachments list
                const preview = await createAttachmentPreview({
                    url: data.url,
                    name: file.name,
                    type: file.type,
                    size: file.size,
                    isImage: fileTypeUtils.isImage(file)
                });

                attachmentsList.appendChild(preview);

                // Set up drag from attachment list to editor
                preview.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', preview.getAttribute('data-url'));
                    preview.classList.add('dragging');
                });

                preview.addEventListener('dragend', () => {
                    preview.classList.remove('dragging');
                });

            } catch (error) {
                console.error('Upload failed:', error);
                alert('Failed to upload file: ' + file.name);
            } finally {
                // Hide progress bar
                uploadProgress.style.display = 'none';
            }
        }
    </script>
</body>

</html>
