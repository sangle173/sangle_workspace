<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>📝 Notes Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: #f8f9fa;
        }
        .folder-tree {
            max-height: none;
            overflow-y: auto;
            padding-right: 4px;
            height: auto;
            flex: 1;
            min-height: 0; /* Important for Firefox */
        }
        .folder-item {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .folder-item:hover {
            background-color: #f1f3f5;
        }
        .folder-item.active {
            background-color: #e9ecef;
            border-left: 4px solid #0d6efd;
        }
        .folder-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
        }
        .folder-content {
            margin-left: 15px;
            transition: all 0.3s ease;
        }
        .folder-content.collapsed {
            display: none;
        }
        .note-item {
            display: flex;
            align-items: center;
            padding: 5px 0;
            margin: 2px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 3px;
        }
        .note-item:hover {
            background-color: #f1f3f5;
        }
        .note-item.active {
            background-color: #e7f7e7;
        }
        .note-item .bi-file-earmark-text {
            color: #ffc107;
            margin-right: 8px;
        }
        .search-box {
            position: sticky;
            top: 0;
            background: white;
            padding: 12px 0;
            margin-bottom: 5px;
            z-index: 100;
            flex-shrink: 0;
        }
        .note-preview {
            max-height: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        .note-preview.expanded {
            max-height: none;
            -webkit-line-clamp: unset;
        }
        .toggle-preview {
            cursor: pointer;
            color: #0d6efd;
            font-size: 0.8rem;
        }
        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card-header {
            background: white;
            border-bottom: 1px solid #f1f3f5;
            padding: 16px 20px;
        }
        .card-body {
            padding: 20px;
        }
        .btn {
            border-radius: 6px;
        }
        #noteTitle {
            font-size: 1.5rem;
            border: none;
            padding: 6px 0;
            background: transparent;
            width: 100%;
        }
        #noteTitle:focus {
            box-shadow: none;
            outline: none;
            border-color: transparent;
        }
        #currentFolderDisplay .badge {
            font-size: 0.85rem;
            padding: 6px 12px;
        }
        #toggleSidebarBtn {
            width: 100%;
            border-radius: 0;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            color: #495057;
            padding: 10px 0;
            cursor: pointer;
        }
        .folder-toggle-icon {
            color: #0d6efd;
            margin-right: 8px;
        }
        .folder-name {
            display: flex;
            align-items: center;
            font-weight: 500;
            color: #212529;
        }
        .folder-icon {
            color: #ffc107;
            margin-right: 8px;
        }
        .card-body.folder-tree {
            flex: 1;
            overflow-y: auto;
            padding: 5px 15px;
            display: block;
            min-height: 0; /* Important for Firefox */
        }
        .folder-actions {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .folder-item:hover .folder-actions {
            opacity: 1;
        }
        #editor {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            min-height: calc(100vh - 200px) !important;
            padding: 16px;
            flex-grow: 1;
        }
        .ck-editor__editable {
            min-height: calc(100vh - 200px) !important;
            max-height: none !important;
            height: auto !important;
        }
        
        .ck-editor__editable_inline {
            height: 100% !important;
        }
        
        .card.h-100 {
            height: calc(100vh - 70px) !important;
            margin-bottom: 0 !important;
        }
        
        .col-md-9 .card-body {
            overflow: auto;
        }
        
        .col-md-9 .card-body #editor {
            flex: 1;
        }
        
        #toolbar-container {
            margin-bottom: 15px;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

        .container-fluid {
            padding-bottom: 0 !important;
            margin-bottom: 0 !important;
            height: calc(100vh - 56px);
        }

        .row.g-4 {
            height: 100%;
            margin: 0;
        }

        .card.h-100 {
            height: 100% !important;
            margin-bottom: 0 !important;
            border-radius: 0;
        }
        
        .col-md-9, .col-md-3 {
            height: 100%;
            padding: 0;
        }
        
        #editor {
            flex: 1;
            overflow: auto;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 16px;
        }
        
        #toolbar-container {
            margin-bottom: 10px;
            padding: 5px;
            background: white;
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }

        /* Sidebar layout styles */
        .col-md-3 .card.h-100 {
            display: flex;
            flex-direction: column;
        }

        /* Note saving indicators */
        .note-saving-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0, 123, 255, 0.5);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }
        
        .note-save-success {
            display: inline-block;
            width: 12px;
            height: 12px;
            color: #28a745;
            margin-left: 8px;
            font-size: 12px;
        }
        
        .note-save-error {
            display: inline-block;
            width: 12px;
            height: 12px;
            color: #dc3545;
            margin-left: 8px;
            font-size: 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Icon buttons style */
        .btn i.bi {
            font-size: 1.1rem;
        }
        
        .card-header .btn {
            height: 38px;
            width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        
        /* Mobile responsive styles */
        @media (max-width: 767px) {
            .container-fluid {
                padding: 0 !important;
            }
            
            .row.g-0 {
                flex-direction: column;
                height: calc(100vh - 56px);
            }
            
            .col-md-3, .col-md-9 {
                width: 100%;
            }
            
            .col-md-3 {
                height: auto !important;
                max-height: 40vh;
                overflow-y: auto;
            }
            
            .col-md-9 {
                height: 60vh !important;
            }
            
            .card-header {
                padding: 10px;
            }
            
            #noteTitle {
                font-size: 1.2rem;
                width: 100%;
            }
            
            .card-header .d-flex {
                flex-wrap: wrap;
                gap: 5px;
            }
            
            .card-header .d-flex.align-items-center {
                margin-bottom: 8px;
            }
            
            #editor {
                min-height: 40vh !important;
            }
            
            
            /* Small mobile devices */
            @media (max-width: 576px) {
                .card-header .d-flex.gap-2 {
                    display: none !important;
                }
                
                
                
                /* Add padding to prevent content from being hidden behind fixed buttons */
                .card-body {
                    padding-bottom: 65px;
                }
                
                .col-md-9 {
                    height: calc(60vh - 65px) !important;
                }
                
                /* Improve CKEditor toolbar on mobile */
                .ck-toolbar {
                    flex-wrap: wrap !important;
                }
                
                .ck-toolbar__items {
                    flex-wrap: wrap !important;
                }
            }
        }
        
        /* Search highlight styles */
        .search-highlight {
            background-color: #fff3cd;
            color: #664d03;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: bold;
        }
        
        .content-match-indicator {
            font-size: 0.7rem;
            color: #6c757d;
            background-color: #f8f9fa;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 5px;
        }
        
        #searchStatus {
            font-size: 0.8rem;
            margin-top: 5px;
            color: #6c757d;
        }
    </style>
</head>

<body style="font-family: var(--font-family), system-ui, sans-serif !important;">
    <!-- Shared navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid px-0" style="background: #f8f9fa; height: calc(100vh - 56px);">
        <div class="row g-0 h-100">
            <!-- Left: Folder Structure -->
            <div class="col-md-3 h-100">
                <div class="card h-100 d-flex flex-column" style="border-radius: 0;">
                    <div class="search-box px-3">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 border-end-0" id="searchInput" placeholder="Search notes...">
                            <span class="input-group-text bg-white border-start-0" onclick="createNewFolder()" style="cursor: pointer;" title="New Folder">
                                <i class="bi bi-folder-plus"></i>
                            </span>
                        </div>
                    </div>
                    <div class="card-body folder-tree flex-grow-1" id="folderTree" style="overflow-y: auto;">
                        <!-- Folders will be loaded here -->
                    </div>
                    <div class="card-footer p-0 mt-auto">
                        <button id="toggleSidebarBtn" class="btn btn-light w-100" onclick="toggleSidebar()">
                            <i class="bi bi-layout-sidebar"></i> Toggle Sidebar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Editor -->
            <div class="col-md-9 h-100">
                <div class="card h-100" style="border-radius: 0;">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center flex-grow-1">
                            <input type="text" id="noteTitle" class="form-control" placeholder="Note Title">
                            <div class="ms-2" id="currentFolderDisplay"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-success" onclick="saveNote()" title="Save note">
                                <i class="bi bi-save"></i>
                            </button>
                            <button class="btn btn-danger" onclick="deleteNote()" title="Delete note">
                                <i class="bi bi-trash"></i>
                            </button>
                            <button class="btn btn-info" id="viewButton" onclick="viewNote()" style="display: none;" title="View note">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div id="editor"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Shared footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- Load Bootstrap first -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Load CKEditor -->
    <script src="https://cdn.ckeditor.com/ckeditor5/40.1.0/decoupled-document/ckeditor.js"></script>

    <script>
        let editor = null;
        let currentNote = null;
        let currentFolder = null;
        let isSidebarCollapsed = false;
        let autoSaveTimeout = null;
        let lastSavedContent = '';
        let isTyping = false;

        // Initialize CKEditor
        async function initEditor() {
            try {
                console.log('Initializing editor...');
                
                // Create toolbar container
                const toolbarContainer = document.createElement('div');
                toolbarContainer.id = 'toolbar-container';
                toolbarContainer.classList.add('mb-2');
                
                // Add toolbar to the card body before the editor
                const cardBody = document.querySelector('.col-md-9 .card-body');
                cardBody.insertBefore(toolbarContainer, document.querySelector('#editor'));

                // Initialize editor
                editor = await DecoupledEditor.create(document.querySelector('#editor'), {
                    toolbar: [
                        'heading', '|',
                        'fontSize', 'fontFamily', '|',
                        'fontColor', 'fontBackgroundColor', '|',
                        'bold', 'italic', 'underline', 'strikethrough', '|',
                        'alignment', '|',
                        'numberedList', 'bulletedList', '|',
                        'outdent', 'indent', '|',
                        'link', 'blockQuote', 'insertTable', 'mediaEmbed', '|',
                        'undo', 'redo'
                    ],
                    image: {
                        toolbar: [
                            'imageStyle:inline',
                            'imageStyle:block',
                            'imageStyle:side',
                            '|',
                            'toggleImageCaption',
                            'imageTextAlternative',
                            '|',
                            'linkImage'
                        ],
                        upload: {
                            types: ['jpeg', 'png', 'gif', 'bmp', 'webp', 'tiff']
                        }
                    },
                    table: {
                        contentToolbar: [
                            'tableColumn',
                            'tableRow',
                            'mergeTableCells',
                            'tableProperties',
                            'tableCellProperties'
                        ]
                    }
                });

                // Add toolbar
                toolbarContainer.appendChild(editor.ui.view.toolbar.element);

                // Set up auto-save functionality
                editor.model.document.on('change:data', () => {
                    if (!currentNote || !currentFolder) return;
                    
                    // Mark that user is typing
                    isTyping = true;
                    
                    // Clear any existing timeout
                    if (autoSaveTimeout) clearTimeout(autoSaveTimeout);
                    
                    // Set a new timeout to save after 2 seconds of inactivity
                    autoSaveTimeout = setTimeout(() => {
                        const currentContent = editor.getData();
                        const title = document.getElementById('noteTitle').value;
                        
                        // Only save if there's a title, content has changed, and we have a folder
                        if (title && currentContent !== lastSavedContent && currentFolder) {
                            console.log('Auto-saving note...');
                            autoSaveNote(title, currentContent);
                            lastSavedContent = currentContent;
                        }
                        
                        isTyping = false;
                    }, 2000);
                });
                
                // Also auto-save when title changes
                document.getElementById('noteTitle').addEventListener('input', () => {
                    if (!currentNote || !currentFolder) return;
                    
                    // Clear any existing timeout
                    if (autoSaveTimeout) clearTimeout(autoSaveTimeout);
                    
                    // Set a new timeout to save after 2 seconds of inactivity
                    autoSaveTimeout = setTimeout(() => {
                        const currentContent = editor.getData();
                        const title = document.getElementById('noteTitle').value;
                        
                        // Only save if there's a title and we have a folder
                        if (title && currentFolder) {
                            console.log('Auto-saving note after title change...');
                            autoSaveNote(title, currentContent);
                            lastSavedContent = currentContent;
                        }
                    }, 2000);
                });

                // Add image upload adapter
                editor.plugins.get('FileRepository').createUploadAdapter = (loader) => {
                    return {
                        upload: async () => {
                            try {
                                const file = await loader.file;
                                const formData = new FormData();
                                formData.append('upload', file);

                                const response = await fetch('/api/notes/upload-image', {
                                    method: 'POST',
                                    body: formData
                                });

                                if (!response.ok) {
                                    throw new Error('Upload failed');
                                }

                                const data = await response.json();
                                return {
                                    default: data.url
                                };
                            } catch (error) {
                                console.error('Upload error:', error);
                                throw error;
                            }
                        }
                    };
                };

                console.log('Editor initialized successfully');
            } catch (error) {
                console.error('Error initializing editor:', error);
                document.getElementById('editor').innerHTML = `
                    <div class="alert alert-danger">
                        Failed to initialize editor. Please refresh the page.
                        <br>
                        Error: ${error.message}
                        <br>
                        <button class="btn btn-primary mt-2" onclick="window.location.reload()">
                            Refresh Page
                        </button>
                    </div>
                `;
            }
        }

        // Toggle sidebar
        function toggleSidebar() {
            const sidebarCol = document.querySelector('.col-md-3');
            const editorCol = document.querySelector('.col-md-9');
            
            isSidebarCollapsed = !isSidebarCollapsed;
            
            if (isSidebarCollapsed) {
                sidebarCol.classList.add('d-none');
                editorCol.classList.remove('col-md-9');
                editorCol.classList.add('col-md-12');
                
                // Show floating toggle button
                let floatingBtn = document.getElementById('floatingToggleBtn');
                if (!floatingBtn) {
                    floatingBtn = document.createElement('button');
                    floatingBtn.id = 'floatingToggleBtn';
                    floatingBtn.className = 'btn btn-primary position-fixed';
                    floatingBtn.style.left = '20px';
                    floatingBtn.style.bottom = '20px';
                    floatingBtn.style.zIndex = '1000';
                    floatingBtn.innerHTML = '<i class="bi bi-layout-sidebar"></i>';
                    floatingBtn.title = 'Show Sidebar';
                    floatingBtn.onclick = toggleSidebar;
                    document.body.appendChild(floatingBtn);
                } else {
                    floatingBtn.style.display = 'block';
                }
            } else {
                sidebarCol.classList.remove('d-none');
                editorCol.classList.remove('col-md-12');
                editorCol.classList.add('col-md-9');
                
                // Hide floating toggle button
                const floatingBtn = document.getElementById('floatingToggleBtn');
                if (floatingBtn) {
                    floatingBtn.style.display = 'none';
                }
            }
        }

        // Toggle folder collapse
        function toggleFolder(folderName) {
            const folderContent = document.getElementById(`folder-${folderName}`);
            const toggleIcon = document.querySelector(`#folder-${folderName}-toggle i`);
            
            folderContent.classList.toggle('collapsed');
            toggleIcon.classList.toggle('bi-caret-down-fill');
            toggleIcon.classList.toggle('bi-caret-right-fill');
        }

        // Search notes
        function searchNotes(query) {
            if (!query || query.trim() === '') {
                // Reset everything if search is cleared
                document.querySelectorAll('.note-item').forEach(item => {
                    item.style.display = '';
                    // Remove any highlights
                    const title = item.querySelector('.note-title');
                    title.innerHTML = title.textContent;
                });
                
                // Show all folders
                document.querySelectorAll('.folder-content').forEach(folder => {
                    folder.classList.remove('collapsed');
                });
                
                document.querySelectorAll('[id$="-toggle"] i').forEach(icon => {
                    icon.classList.remove('bi-caret-right-fill');
                    icon.classList.add('bi-caret-down-fill');
                });
                
                // Clear search status
                let searchStatus = document.getElementById('searchStatus');
                if (searchStatus) {
                    searchStatus.innerHTML = '';
                }
                
                return;
            }
            
            query = query.toLowerCase();
            
            // Track which folders have matches
            const foldersWithMatches = new Set();
            let totalMatches = 0;
            
            // First pass: hide all notes and look for matches
            document.querySelectorAll('.note-item').forEach(item => {
                // Default to hiding
                item.style.display = 'none';
                
                // Get the parent folder
                const folderContent = item.closest('.folder-content');
                const folderName = folderContent ? folderContent.id.replace('folder-', '') : null;
                
                if (!folderName) return;
                
                // Get the title
                const titleElement = item.querySelector('.note-title');
                const title = titleElement.textContent.toLowerCase();
                
                // Check for title match
                const titleMatch = title.includes(query);
                
                if (titleMatch) {
                    // Show this note
                    item.style.display = '';
                    foldersWithMatches.add(folderName);
                    totalMatches++;
                    
                    // Highlight the match in the title
                    const highlightedTitle = titleElement.textContent.replace(
                        new RegExp(query, 'gi'),
                        match => `<span class="search-highlight">${match}</span>`
                    );
                    titleElement.innerHTML = highlightedTitle;
                }
            });
            
            // Second pass: load content for additional content matches if we have few results
            if (totalMatches < 5 && query.length > 2) {
                // Only do content search for queries over 2 chars to avoid performance issues
                loadContentSearchResults(query);
            }
            
            // Expand folders with matches
            foldersWithMatches.forEach(folderName => {
                const folderContent = document.getElementById(`folder-${folderName}`);
                if (folderContent) {
                    folderContent.classList.remove('collapsed');
                    
                    // Update folder toggle icon
                    const toggleIcon = document.querySelector(`#folder-${folderName}-toggle i`);
                    if (toggleIcon) {
                        toggleIcon.classList.remove('bi-caret-right-fill');
                        toggleIcon.classList.add('bi-caret-down-fill');
                    }
                }
            });
            
            // Show search result count
            updateSearchResultCount(totalMatches);
        }
        
        // Helper function to load content-based search results
        async function loadContentSearchResults(query) {
            // Get all notes that might have content
            const notesData = [];
            
            // For each folder, get notes
            document.querySelectorAll('.folder-content').forEach(folderElem => {
                const folderName = folderElem.id.replace('folder-', '');
                
                // For each note in this folder that's currently hidden
                folderElem.querySelectorAll('.note-item').forEach(noteElem => {
                    if (noteElem.style.display === 'none') {
                        // Get note ID from onclick attribute
                        const onclickAttr = noteElem.getAttribute('onclick');
                        if (onclickAttr) {
                            const match = onclickAttr.match(/loadNote\(['"]([^'"]+)['"],\s*['"]([^'"]+)['"]\)/);
                            if (match && match.length === 3) {
                                const [_, folder, noteId] = match;
                                notesData.push({
                                    folder,
                                    noteId,
                                    element: noteElem
                                });
                            }
                        }
                    }
                });
            });
            
            // Now load content for each note and search
            const foldersWithMatches = new Set();
            let additionalMatches = 0;
            
            for (const noteData of notesData) {
                try {
                    const response = await fetch(`/api/notes/${noteData.folder}/${noteData.noteId}`);
                    if (!response.ok) continue;
                    
                    const note = await response.json();
                    // Search in content
                    if (note.content && note.content.toLowerCase().includes(query.toLowerCase())) {
                        // Show this note
                        noteData.element.style.display = '';
                        foldersWithMatches.add(noteData.folder);
                        additionalMatches++;
                        
                        // Add "content match" indicator
                        const titleElem = noteData.element.querySelector('.note-title');
                        if (titleElem) {
                            // Add a small indicator next to the title
                            titleElem.innerHTML += ' <small class="text-muted content-match-indicator">(content match)</small>';
                        }
                    }
                } catch (error) {
                    console.error('Error searching note content:', error);
                }
            }
            
            // Expand additional folders with matches
            foldersWithMatches.forEach(folderName => {
                const folderContent = document.getElementById(`folder-${folderName}`);
                if (folderContent) {
                    folderContent.classList.remove('collapsed');
                    
                    // Update folder toggle icon
                    const toggleIcon = document.querySelector(`#folder-${folderName}-toggle i`);
                    if (toggleIcon) {
                        toggleIcon.classList.remove('bi-caret-right-fill');
                        toggleIcon.classList.add('bi-caret-down-fill');
                    }
                }
            });
            
            // Update the search result count with the additional matches
            updateSearchResultCount(document.querySelectorAll('.note-item[style="display: ;"]').length);
        }
        
        // Update search result count
        function updateSearchResultCount(count) {
            let searchStatus = document.getElementById('searchStatus');
            if (!searchStatus) {
                searchStatus = document.createElement('div');
                searchStatus.id = 'searchStatus';
                searchStatus.className = 'small text-muted mt-2 ms-1';
                const searchBox = document.querySelector('.search-box');
                if (searchBox) {
                    searchBox.appendChild(searchStatus);
                }
            }
            
            if (count === 0) {
                searchStatus.innerHTML = 'No matches found';
            } else {
                searchStatus.innerHTML = `${count} match${count !== 1 ? 'es' : ''} found`;
            }
        }

        // Load folders and notes
        async function loadFolders() {
            try {
                console.log('Loading folders...');
                const response = await fetch('/api/notes/folders');
                console.log('Folder response status:', response.status);
                const folders = await response.json();
                console.log('Received folders:', folders);
                displayFolders(folders);
            } catch (error) {
                console.error('Error loading folders:', error);
            }
        }

        // Display folders in the tree
        function displayFolders(folders, parentElement = document.getElementById('folderTree')) {
            console.log('Displaying folders:', folders);
            parentElement.innerHTML = '';
            if (!folders || folders.length === 0) {
                console.log('No folders to display');
                parentElement.innerHTML = `
                    <div class="text-center py-4">
                        <div class="text-muted mb-3">No folders found.</div>
                        <button class="btn btn-primary" onclick="createNewFolder()">
                            <i class="bi bi-folder-plus"></i> Create Your First Folder
                        </button>
                    </div>
                `;
                return;
            }
            
            // Sort folders alphabetically
            folders.sort((a, b) => a.localeCompare(b));
            
            folders.forEach(folder => {
                console.log('Creating folder element for:', folder);
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder-item';
                folderDiv.innerHTML = `
                    <div class="folder-header">
                        <div class="d-flex align-items-center" onclick="selectFolder('${folder}')">
                            <span id="folder-${folder}-toggle" onclick="event.stopPropagation(); toggleFolder('${folder}')">
                                <i class="bi bi-caret-down-fill text-primary me-1"></i>
                            </span>
                            <i class="bi bi-folder-fill text-warning me-1"></i>
                            <span>${folder}</span>
                        </div>
                        <div class="folder-actions">
                            <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); createNewNote('${folder}')">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                    <div class="folder-content" id="folder-${folder}"></div>
                `;
                parentElement.appendChild(folderDiv);

                // Load notes for this folder
                loadNotes(folder, folderDiv.querySelector('.folder-content'));
            });
        }

        // Select a folder
        function selectFolder(folderName) {
            // Remove active class from all folders
            document.querySelectorAll('.folder-item').forEach(item => {
                item.classList.remove('active');
            });

            // Add active class to selected folder
            const folderElements = document.querySelectorAll('.folder-item');
            folderElements.forEach(element => {
                const folderSpan = element.querySelector('span');
                if (folderSpan && folderSpan.textContent === folderName) {
                    element.classList.add('active');
                }
            });

            // Update current folder
            currentFolder = folderName;
            currentNote = null;

            // Update folder display
            document.getElementById('currentFolderDisplay').innerHTML = `
                <span class="badge bg-primary">${folderName}</span>
            `;

            // Clear editor
            document.getElementById('noteTitle').value = '';
            editor.setData('');
            
            // Reset auto-save state
            lastSavedContent = '';
            
            // Clear save indicator
            let saveIndicator = document.getElementById('autoSaveIndicator');
            if (saveIndicator) {
                saveIndicator.style.opacity = '0';
            }
            
            // Hide share button when no specific note is selected
            document.getElementById('viewButton').style.display = 'none';
            
            // Load notes for the folder
            loadNotes(folderName, document.getElementById(`folder-${folderName}`));
        }

        // Create new note in selected folder
        function createNewNote(folderName) {
            selectFolder(folderName);
            document.getElementById('noteTitle').value = '';
            editor.setData(''); // Empty content, no title
            currentNote = null;
            
            // Reset last saved content
            lastSavedContent = '';
            
            // Clear save indicator
            let saveIndicator = document.getElementById('autoSaveIndicator');
            if (saveIndicator) {
                saveIndicator.style.opacity = '0';
            }
            
            // Hide share button for new unsaved note
            document.getElementById('viewButton').style.display = 'none';
            
            // Load notes for the folder
            loadNotes(folderName, document.getElementById(`folder-${folderName}`));
        }

        // Load notes for a folder
        async function loadNotes(folderName, parentElement) {
            try {
                const response = await fetch(`/api/notes/${folderName}`);
                const notes = await response.json();
                parentElement.innerHTML = '';
                
                if (notes && notes.length > 0) {
                    // Sort notes alphabetically by title
                    notes.sort((a, b) => a.title.localeCompare(b.title));
                    
                    notes.forEach(note => {
                        const noteDiv = document.createElement('div');
                        noteDiv.className = 'note-item';
                        noteDiv.innerHTML = `
                            <i class="bi bi-file-earmark-text text-warning me-1"></i>
                            <div class="note-title">${note.title}</div>
                        `;
                        noteDiv.onclick = () => loadNote(folderName, note.id);
                        parentElement.appendChild(noteDiv);
                    });
                } else {
                    parentElement.innerHTML = '<div class="text-center text-muted py-2">No notes in this folder</div>';
                }
            } catch (error) {
                console.error('Error loading notes:', error);
                parentElement.innerHTML = '<div class="text-center text-danger py-2">Error loading notes</div>';
            }
        }

        // Load a specific note
        async function loadNote(folderName, noteId) {
            try {
                const response = await fetch(`/api/notes/${folderName}/${noteId}`);
                const note = await response.json();
                currentNote = note;
                currentFolder = folderName;
                
                // Set the title in the title field
                document.getElementById('noteTitle').value = note.title;
                
                // Remove the title from the content if it appears at the beginning
                let content = note.content;
                
                // Escape special regex characters in the title
                const titleEscaped = note.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                
                // Create a comprehensive regex that matches common ways the title might appear at the start
                const titleRegex = new RegExp(
                    `^\\s*(?:<(?:h[1-6]|p|div)>${titleEscaped}</(?:h[1-6]|p|div)>|${titleEscaped}(?:<br>|\\s*))\\s*`, 
                    'i'
                );
                
                // Remove title from beginning of content
                content = content.replace(titleRegex, '');
                
                // Set the content without the title
                editor.setData(content);
                
                // Store current content for auto-save comparison
                lastSavedContent = content;
                
                // Reset any save indicator
                let saveIndicator = document.getElementById('autoSaveIndicator');
                if (saveIndicator) {
                    saveIndicator.style.opacity = '0';
                }
                
                // Show view button
                document.getElementById('viewButton').style.display = 'block';
                
                // Update active states
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
                
                // Find and highlight the selected note
                const noteElements = document.querySelectorAll('.note-item');
                noteElements.forEach(element => {
                    const titleElement = element.querySelector('.note-title');
                    if (titleElement && titleElement.textContent === note.title) {
                        element.classList.add('active');
                    }
                });
            } catch (error) {
                console.error('Error loading note:', error);
            }
        }

        // Save current note
        async function saveNote() {
            if (!editor) {
                alert('Editor is not initialized. Please refresh the page.');
                return;
            }

            try {
                const title = document.getElementById('noteTitle').value;
                if (!title) {
                    alert('Please enter a title for the note');
                    return;
                }

                if (!currentFolder) {
                    alert('Please select a folder first');
                    return;
                }

                // Get the content without checking for the title
                const content = editor.getData();
                console.log('Saving note:', { title, content, folder: currentFolder });
                
                const noteData = {
                    title: title,
                    content: content, // The title is not part of the content
                    folder: currentFolder,
                    id: currentNote ? currentNote.id : null
                };

                const response = await fetch('/api/notes/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(noteData)
                });

                if (response.ok) {
                    console.log('Note saved successfully');
                    // Update last saved content
                    lastSavedContent = content;
                    
                    // Update save indicator if exists
                    let saveIndicator = document.getElementById('autoSaveIndicator');
                    if (saveIndicator) {
                        saveIndicator.innerText = 'Saved';
                        saveIndicator.className = 'badge bg-success ms-2';
                    }
                    
                    // Reload the current folder's notes
                    loadNotes(currentFolder, document.getElementById(`folder-${currentFolder}`));
                } else {
                    console.error('Failed to save note');
                    alert('Failed to save note. Please try again.');
                }
            } catch (error) {
                console.error('Error saving note:', error);
                alert('Error saving note: ' + error.message);
            }
        }

        // Auto-save function
        async function autoSaveNote(title, content) {
            if (!currentFolder) return;
            
            // Find note element in sidebar for visual indicators
            let noteElement = null;
            if (currentNote && currentNote.title) {
                const noteElements = document.querySelectorAll('.note-item');
                noteElements.forEach(element => {
                    const titleElement = element.querySelector('.note-title');
                    if (titleElement && titleElement.textContent === currentNote.title) {
                        noteElement = element;
                    }
                });
            }
            
            // Add spinner to the note in sidebar
            let spinner = null;
            if (noteElement) {
                const titleElement = noteElement.querySelector('.note-title');
                // Remove any existing indicators first
                const existingSpinner = noteElement.querySelector('.note-saving-indicator');
                const successIcon = noteElement.querySelector('.note-save-success');
                const errorIcon = noteElement.querySelector('.note-save-error');
                if (existingSpinner) existingSpinner.remove();
                if (successIcon) successIcon.remove();
                if (errorIcon) errorIcon.remove();
                
                // Add new spinner
                spinner = document.createElement('span');
                spinner.className = 'note-saving-indicator';
                titleElement.insertAdjacentElement('afterend', spinner);
            }
            
            try {
                // Main save indicator in toolbar
                let saveIndicator = document.getElementById('autoSaveIndicator');
                if (!saveIndicator) {
                    saveIndicator = document.createElement('span');
                    saveIndicator.id = 'autoSaveIndicator';
                    saveIndicator.className = 'badge bg-info ms-2';
                    saveIndicator.innerText = 'Saving...';
                    document.querySelector('.card-header .d-flex.gap-2').prepend(saveIndicator);
                } else {
                    saveIndicator.innerText = 'Saving...';
                    saveIndicator.className = 'badge bg-info ms-2';
                }
                
                // Store the original title for comparison
                const oldTitle = currentNote ? currentNote.title : null;
                const titleChanged = oldTitle && oldTitle !== title;
                
                const noteData = {
                    title: title,
                    content: content,
                    folder: currentFolder,
                    id: currentNote ? currentNote.id : null
                };

                const response = await fetch('/api/notes/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(noteData)
                });

                if (response.ok) {
                    console.log('Note auto-saved successfully');
                    saveIndicator.innerText = 'Saved';
                    saveIndicator.className = 'badge bg-success ms-2';
                    
                    // Update save status indicator
                    setTimeout(() => {
                        if (saveIndicator.innerText === 'Saved') {
                            saveIndicator.style.opacity = '0.5';
                        }
                    }, 2000);
                    
                    // Get updated note data
                    try {
                        const data = await response.json();
                        currentNote = data;
                        
                        // Update the note element in the sidebar
                        if (noteElement) {
                            // Remove spinner
                            const spinner = noteElement.querySelector('.note-saving-indicator');
                            if (spinner) spinner.remove();
                            
                            // Add success icon that fades out
                            const titleElement = noteElement.querySelector('.note-title');
                            const successIcon = document.createElement('span');
                            successIcon.className = 'note-save-success';
                            successIcon.innerHTML = '<i class="bi bi-check-circle-fill"></i>';
                            titleElement.insertAdjacentElement('afterend', successIcon);
                            
                            // If title changed, update it
                            if (titleChanged) {
                                titleElement.textContent = title;
                            }
                            
                            // Fade out success icon
                            setTimeout(() => {
                                if (successIcon) {
                                    successIcon.style.opacity = '0';
                                    setTimeout(() => successIcon.remove(), 500);
                                }
                            }, 2000);
                        } else if (!noteData.id || titleChanged) {
                            // If it's a new note or title changed and no element found, reload the folder
                            console.log('Title changed or new note, updating sidebar');
                            loadNotes(currentFolder, document.getElementById(`folder-${currentFolder}`));
                            
                            // After reloading, find and highlight the updated note
                            setTimeout(() => {
                                const noteElements = document.querySelectorAll('.note-item');
                                noteElements.forEach(element => {
                                    element.classList.remove('active');
                                    const titleElement = element.querySelector('.note-title');
                                    if (titleElement && titleElement.textContent === title) {
                                        element.classList.add('active');
                                    }
                                });
                            }, 100);
                        }
                    } catch (jsonError) {
                        console.error('Error parsing JSON response:', jsonError);
                        
                        // Even with JSON error, the save likely succeeded
                        // Remove any spinner to prevent infinite loading
                        if (noteElement) {
                            const spinner = noteElement.querySelector('.note-saving-indicator');
                            if (spinner) spinner.remove();
                            
                            // Add warning icon to indicate partial success
                            const titleElement = noteElement.querySelector('.note-title');
                            const warningIcon = document.createElement('span');
                            warningIcon.className = 'note-save-success'; 
                            warningIcon.style.color = '#ffc107'; // Warning color
                            warningIcon.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i>';
                            titleElement.insertAdjacentElement('afterend', warningIcon);
                            
                            // Fade out warning icon
                            setTimeout(() => {
                                if (warningIcon) {
                                    warningIcon.style.opacity = '0';
                                    setTimeout(() => warningIcon.remove(), 500);
                                }
                            }, 3000);
                            
                            // If title changed, still update it since save succeeded
                            if (titleChanged) {
                                titleElement.textContent = title;
                            }
                        }
                    }
                } else {
                    console.error('Failed to auto-save note');
                    saveIndicator.innerText = 'Save failed';
                    saveIndicator.className = 'badge bg-danger ms-2';
                    
                    // Update the note element in the sidebar
                    if (noteElement) {
                        // Remove spinner
                        const spinner = noteElement.querySelector('.note-saving-indicator');
                        if (spinner) spinner.remove();
                        
                        // Add error icon
                        const titleElement = noteElement.querySelector('.note-title');
                        const errorIcon = document.createElement('span');
                        errorIcon.className = 'note-save-error';
                        errorIcon.innerHTML = '<i class="bi bi-exclamation-circle-fill"></i>';
                        titleElement.insertAdjacentElement('afterend', errorIcon);
                        
                        // Fade out error icon
                        setTimeout(() => {
                            if (errorIcon) {
                                errorIcon.style.opacity = '0';
                                setTimeout(() => errorIcon.remove(), 500);
                            }
                        }, 4000);
                    }
                }
            } catch (error) {
                console.error('Error auto-saving note:', error);
                // Update the main indicator
                const saveIndicator = document.getElementById('autoSaveIndicator');
                if (saveIndicator) {
                    saveIndicator.innerText = 'Save failed';
                    saveIndicator.className = 'badge bg-danger ms-2';
                }
                
                // Make sure to remove spinner and show error icon in the sidebar
                if (noteElement) {
                    // Remove spinner
                    const spinner = noteElement.querySelector('.note-saving-indicator');
                    if (spinner) spinner.remove();
                    
                    // Add error icon
                    const titleElement = noteElement.querySelector('.note-title');
                    const errorIcon = document.createElement('span');
                    errorIcon.className = 'note-save-error';
                    errorIcon.innerHTML = '<i class="bi bi-exclamation-circle-fill"></i>';
                    titleElement.insertAdjacentElement('afterend', errorIcon);
                    
                    // Fade out error icon
                    setTimeout(() => {
                        if (errorIcon) {
                            errorIcon.style.opacity = '0';
                            setTimeout(() => errorIcon.remove(), 500);
                        }
                    }, 4000);
                }
            }
        }

        // Create new folder
        async function createNewFolder() {
            const folderName = prompt('Enter folder name:');
            if (!folderName) return; // User canceled or entered empty name
            
            if (folderName.trim() === '') {
                alert('Folder name cannot be empty.');
                return;
            }
            
            try {
                console.log('Creating folder:', folderName);
                
                // Show a loading indicator in the folder tree
                const folderTree = document.getElementById('folderTree');
                if (folderTree) {
                    const prevContent = folderTree.innerHTML;
                    folderTree.innerHTML = `
                        <div class="text-center py-3">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <div class="mt-2">Creating folder...</div>
                        </div>
                    `;
                }
                
                const response = await fetch('/api/notes/folders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: folderName })
                });
                console.log('Create folder response status:', response.status);

                if (response.ok) {
                    // Clear current note if any
                    currentNote = null;
                    currentFolder = null;
                    document.getElementById('noteTitle').value = '';
                    editor.setData('');
                    document.getElementById('currentFolderDisplay').innerHTML = '';
                    
                    // Reload folders immediately
                    console.log('Reloading folders after creation...');
                    await loadFolders();
                    
                    // Select the newly created folder
                    setTimeout(() => {
                        selectFolder(folderName);
                    }, 100);
                } else {
                    // Show error if folder creation failed
                    alert('Failed to create folder. Please try again.');
                    loadFolders();
                }
            } catch (error) {
                console.error('Error creating folder:', error);
                alert('Error creating folder. Please try again.');
                loadFolders();
            }
        }

        // Delete current note
        async function deleteNote() {
            if (currentNote && confirm('Are you sure you want to delete this note?')) {
                try {
                    const response = await fetch(`/api/notes/${currentFolder}/${currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        currentNote = null;
                        document.getElementById('noteTitle').value = '';
                        editor.setData('');
                        loadFolders();
                    }
                } catch (error) {
                    console.error('Error deleting note:', error);
                }
            }
        }

        // View note in a new tab
        function viewNote() {
            if (!currentNote || !currentFolder) {
                alert('Please save the note first before viewing.');
                return;
            }
            
            // Generate view URL
            const viewUrl = `${window.location.origin}/view/${currentFolder}/${currentNote.id}`;
            
            // Open in a new tab
            window.open(viewUrl, '_blank');
        }

        // Share current note - generate shareable URL
        function shareNote() {
            if (!currentNote || !currentFolder) {
                alert('Please save the note first before sharing.');
                return;
            }
            
            // Generate shareable URL
            const shareUrl = `${window.location.origin}/view/${currentFolder}/${currentNote.id}`;
            
            // Create temporary input to copy URL
            const tempInput = document.createElement('input');
            document.body.appendChild(tempInput);
            tempInput.value = shareUrl;
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            
            // Show toast or alert
            alert('Shareable URL copied to clipboard: ' + shareUrl);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await initEditor();
                await loadFolders();

                // Add search functionality
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', (e) => {
                    searchNotes(e.target.value);
                });
            } catch (error) {
                console.error('Initialization error:', error);
                alert('Failed to initialize the editor. Please refresh the page.');
            }
        });
    </script>

    <script>
        (function() {
            fetch('/settings/api').then(r => r.json()).then(settings => {
                if (settings.headerBgColor) document.documentElement.style.setProperty('--header-bg', settings.headerBgColor);
                if (settings.headerTextColor) document.documentElement.style.setProperty('--header-text', settings.headerTextColor);
                if (settings.backgroundColor) document.documentElement.style.setProperty('--background-color', settings.backgroundColor);
                if (settings.fontSize) document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
                if (settings.fontFamily) document.documentElement.style.setProperty('--font-family', settings.fontFamily);
                if (settings.borderRadius) document.documentElement.style.setProperty('--border-radius', settings.borderRadius + 'px');
            });
        })();
    </script>
