<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head.html :: head(title='📝 Notes Editor', customStyles=~{::customStyles})">
    <th:block th:fragment="customStyles">
        <style>
            body {
                background: #f8f9fa;
            }
            .folder-tree {
                max-height: none;
                overflow-y: auto;
                padding-right: 4px;
                height: auto;
                flex: 1;
                min-height: 0; /* Important for Firefox */
            }
            .folder-item {
                cursor: pointer;
                transition: all 0.2s ease;
            }
            .folder-item:hover {
                background-color: #f1f3f5;
            }
            .folder-item.active {
                background-color: #e9ecef;
                border-left: 4px solid #0d6efd;
            }
            .folder-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 5px 0;
            }
            .folder-content {
                margin-left: 15px;
                transition: all 0.3s ease;
            }
            .folder-content.collapsed {
                display: none;
            }
            .note-item {
                display: flex;
                align-items: center;
                padding: 5px 0;
                margin: 2px 0;
                cursor: pointer;
                transition: all 0.2s ease;
                border-radius: 3px;
            }
            .note-item:hover {
                background-color: #f1f3f5;
            }
            .note-item.active {
                background-color: #e7f7e7;
            }
            .note-item .bi-file-earmark-text {
                color: #ffc107;
                margin-right: 8px;
            }
            .search-box {
                position: sticky;
                top: 0;
                background: white;
                padding: 12px 0;
                margin-bottom: 5px;
                z-index: 100;
                flex-shrink: 0;
            }
            .note-preview {
                max-height: 100px;
                overflow: hidden;
                text-overflow: ellipsis;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
            }
            .note-preview.expanded {
                max-height: none;
                -webkit-line-clamp: unset;
            }
            .toggle-preview {
                cursor: pointer;
                color: #0d6efd;
                font-size: 0.8rem;
            }
            .card {
                border-radius: 12px;
                border: none;
                box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            }
            .card-header {
                background: white;
                border-bottom: 1px solid #f1f3f5;
                padding: 16px 20px;
            }
            .card-body {
                padding: 20px;
            }
            .btn {
                border-radius: 6px;
            }
            #noteTitle {
                font-size: 1.5rem;
                border: none;
                padding: 6px 0;
                background: transparent;
                width: 100%;
            }
            #noteTitle:focus {
                box-shadow: none;
                outline: none;
                border-color: transparent;
            }
            #currentFolderDisplay .badge {
                font-size: 0.85rem;
                padding: 6px 12px;
            }
            #toggleSidebarBtn {
                width: 100%;
                border-radius: 0;
                background: #f8f9fa;
                border-top: 1px solid #dee2e6;
                color: #495057;
                padding: 10px 0;
                cursor: pointer;
            }
            .folder-toggle-icon {
                color: #0d6efd;
                margin-right: 8px;
            }
            .folder-name {
                display: flex;
                align-items: center;
                font-weight: 500;
                color: #212529;
            }
            .folder-icon {
                color: #ffc107;
                margin-right: 8px;
            }
            .card-body.folder-tree {
                flex: 1;
                overflow-y: auto;
                padding: 5px 15px;
                display: block;
                min-height: 0; /* Important for Firefox */
            }
            .folder-actions {
                opacity: 0;
                transition: opacity 0.2s ease;
            }
            .folder-item:hover .folder-actions {
                opacity: 1;
            }
            #editor {
                border: 1px solid #dee2e6;
                border-radius: 8px;
                min-height: calc(100vh - 200px) !important;
                padding: 16px;
                flex-grow: 1;
            }
            .ck-editor__editable {
                min-height: calc(100vh - 200px) !important;
                max-height: none !important;
                height: auto !important;
            }
            .ck-editor__editable_inline {
                height: 100% !important;
            }
            .card.h-100 {
                height: calc(100vh - 70px) !important;
                margin-bottom: 0 !important;
            }
            .col-md-9 .card-body {
                overflow: auto;
            }
            .col-md-9 .card-body #editor {
                flex: 1;
            }
            #toolbar-container {
                margin-bottom: 15px;
                position: sticky;
                top: 0;
                background: white;
                z-index: 10;
            }
            .container-fluid {
                padding-bottom: 0 !important;
                margin-bottom: 0 !important;
                height: calc(100vh - 56px);
            }
            .row.g-4 {
                height: 100%;
                margin: 0;
            }
            .card.h-100 {
                height: 100% !important;
                margin-bottom: 0 !important;
                border-radius: 0;
            }
            .col-md-9, .col-md-3 {
                height: 100%;
                padding: 0;
            }
            #editor {
                flex: 1;
                overflow: auto;
                border: 1px solid #dee2e6;
                border-radius: 6px;
                padding: 16px;
            }
            #toolbar-container {
                margin-bottom: 10px;
                padding: 5px;
                background: white;
                border-radius: 6px;
                border: 1px solid #dee2e6;
            }
            .col-md-3 .card.h-100 {
                display: flex;
                flex-direction: column;
            }
            .note-saving-indicator {
                display: inline-block;
                width: 12px;
                height: 12px;
                border: 2px solid rgba(0, 123, 255, 0.5);
                border-radius: 50%;
                border-top-color: #007bff;
                animation: spin 1s linear infinite;
                margin-left: 8px;
            }
            .note-save-success {
                display: inline-block;
                width: 12px;
                height: 12px;
                color: #28a745;
                margin-left: 8px;
                font-size: 12px;
            }
            .note-save-error {
                display: inline-block;
                width: 12px;
                height: 12px;
                color: #dc3545;
                margin-left: 8px;
                font-size: 12px;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            .btn i.bi {
                font-size: 1.1rem;
            }
            .card-header .btn {
                height: 38px;
                width: 38px;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
            }
            @media (max-width: 767px) {
                .container-fluid {
                    padding: 0 !important;
                }
                .row.g-0 {
                    flex-direction: column;
                    height: calc(100vh - 56px);
                }
                .col-md-3, .col-md-9 {
                    width: 100%;
                }
                .col-md-3 {
                    height: auto !important;
                    max-height: 40vh;
                    overflow-y: auto;
                }
                .col-md-9 {
                    height: 60vh !important;
                }
                .card-header {
                    padding: 10px;
                }
                #noteTitle {
                    font-size: 1.2rem;
                    width: 100%;
                }
                .card-header .d-flex {
                    flex-wrap: wrap;
                    gap: 5px;
                }
                .card-header .d-flex.align-items-center {
                    margin-bottom: 8px;
                }
                #editor {
                    min-height: 60vh !important;
                    border-radius: 18px !important;
                    margin-bottom: 70px !important; /* Space for sticky action bar */
                }
                .ck-editor__editable {
                    min-height: 60vh !important;
                    border-radius: 18px !important;
                }
                @media (max-width: 576px) {
                    .card-header .d-flex.gap-2 {
                        display: none !important;
                    }
                    .card-body {
                        padding-bottom: 65px;
                    }
                    .col-md-9 {
                        height: calc(60vh - 65px) !important;
                    }
                    .ck-toolbar {
                        flex-wrap: wrap !important;
                    }
                    .ck-toolbar__items {
                        flex-wrap: wrap !important;
                    }
                }
            }
            .search-highlight {
                background-color: #fff3cd;
                color: #664d03;
                padding: 0 2px;
                border-radius: 2px;
                font-weight: bold;
            }
            .content-match-indicator {
                font-size: 0.7rem;
                color: #6c757d;
                background-color: #f8f9fa;
                padding: 1px 4px;
                border-radius: 3px;
                margin-left: 5px;
            }
            #searchStatus {
                font-size: 0.8rem;
                margin-top: 5px;
                color: #6c757d;
            }
            .card-body.d-flex.flex-column {
                display: flex;
                flex-direction: column;
                height: 100%;
                padding: 0 !important;
            }
            #noteTitle {
                font-size: 1.2rem;
                border: none;
                padding: 12px 16px 8px 16px;
                background: transparent;
                width: 100%;
                margin-bottom: 0;
            }
            #toolbar-container {
                position: sticky;
                top: 0;
                z-index: 2;
                background: #fff;
                border-bottom: 1px solid #eee;
                padding: 8px 16px 8px 16px;
                border-radius: 12px 12px 0 0;
            }
            #editor {
                flex: 1 1 auto;
                min-height: 0;
                max-height: none;
                overflow-y: auto;
                border: none;
                border-radius: 0 0 12px 12px;
                padding: 16px;
                background: #fff;
            }
            .ck-editor__editable {
                min-height: 40vh !important;
                max-height: none !important;
                height: 100% !important;
                border-radius: 0 0 12px 12px !important;
                background: #fff !important;
            }
            @media (max-width: 767px) {
                #editor, .ck-editor__editable {
                    min-height: 40vh !important;
                    height: 100% !important;
                    border-radius: 0 0 18px 18px !important;
                    padding-bottom: 80px !important; /* for sticky action bar */
                }
                #toolbar-container {
                    padding: 8px 8px 8px 8px;
                    border-radius: 12px 12px 0 0;
                }
                #noteTitle {
                    padding: 10px 8px 6px 8px;
                }
            }
            #editor, .ck-editor__editable {
                min-height: 60vh !important;
                height: 100% !important;
            }
            @media (max-width: 767px) {
                #editor, .ck-editor__editable {
                    min-height: 60vh !important;
                    height: 100% !important;
                }
            }
            .note-actions { opacity: 0; transition: opacity 0.2s; }
            .note-item:hover .note-actions { opacity: 1; }
            .folder-name-container {
                position: relative;
            }
            .folder-name-container .rename-folder-btn {
                opacity: 0;
                transition: opacity 0.2s;
                pointer-events: none;
            }
            .folder-name-container:hover .rename-folder-btn {
                opacity: 1;
                pointer-events: auto;
            }
        </style>
    </th:block>
</head>

<body style="font-family: var(--font-family), system-ui, sans-serif !important;">
    <!-- Shared navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <!-- Mobile Hamburger Button (moved below navbar) -->
    <div class="d-md-none" style="position:relative; z-index:1100;">
      <button class="btn btn-primary m-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
        <i class="bi bi-list"></i>
      </button>
    </div>

    <!-- Offcanvas Sidebar for Mobile -->
    <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="mobileSidebarLabel">Folders</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body" id="folderTreeMobile">
        <!-- Folders will be loaded here by JS -->
      </div>
    </div>

    <div class="container-fluid px-0" style="background: #f8f9fa; height: calc(100vh - 56px);">
        <div class="row g-0 h-100">
            <!-- Left: Folder Structure (Desktop only) -->
            <div class="col-md-3 h-100 d-none d-md-block">
                <div class="card h-100 d-flex flex-column" style="border-radius: 0;">
                    <div class="search-box px-3">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 border-end-0" id="searchInput" placeholder="Search notes...">
                            <span class="input-group-text bg-white border-start-0" onclick="createNewFolder()" style="cursor: pointer;" title="New Folder">
                                <i class="bi bi-folder-plus"></i>
                            </span>
                        </div>
                    </div>
                    <div class="card-body folder-tree flex-grow-1" id="folderTree" style="overflow-y: auto;">
                        <!-- Folders will be loaded here -->
                    </div>
                    <div class="card-footer p-0 mt-auto">
                        <button id="toggleSidebarBtn" class="btn btn-light w-100" onclick="toggleSidebar()">
                            <i class="bi bi-layout-sidebar"></i> Toggle Sidebar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Editor -->
            <div class="col-md-9 h-100 col-12">
                <div class="card h-100" style="border-radius: 0;">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center flex-grow-1">
                            <input type="text" id="noteTitle" class="form-control" placeholder="Note Title">
                            <div class="ms-2" id="currentFolderDisplay"></div>
                        </div>
                        <div class="d-flex gap-2 d-none d-md-flex">
                            <button class="btn btn-success" onclick="saveNote()" title="Save note">
                                <i class="bi bi-save"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div id="toolbar-container"></div>
                        <div id="editor"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sticky Action Bar for Mobile -->
    <div class="fixed-bottom bg-white border-top d-flex justify-content-around py-2 d-md-none" style="z-index: 1200;">
      <button class="btn btn-success flex-fill mx-1" onclick="saveNote()"><i class="bi bi-save"></i></button>
      <button class="btn btn-primary flex-fill mx-1" onclick="createNewNote(currentFolder)"><i class="bi bi-plus-lg"></i></button>
    </div>

    <!-- Shared footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- Load Bootstrap first -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Load CKEditor -->
    <script src="https://cdn.ckeditor.com/ckeditor5/40.1.0/decoupled-document/ckeditor.js"></script>

    <script>
        let editor = null;
        let currentNote = null;
        let currentFolder = null;
        let isSidebarCollapsed = false;
        let autoSaveTimeout = null;
        let lastSavedContent = '';
        let isTyping = false;
        let folderCollapseState = {};

        // Initialize CKEditor
        async function initEditor() {
            try {
                console.log('Initializing editor...');
                // Initialize editor
                editor = await DecoupledEditor.create(document.querySelector('#editor'), {
                    toolbar: [
                        'heading', '|',
                        'fontSize', 'fontFamily', '|',
                        'fontColor', 'fontBackgroundColor', '|',
                        'bold', 'italic', 'underline', 'strikethrough', '|',
                        'alignment', '|',
                        'numberedList', 'bulletedList', 'todoList', '|', 
                        'outdent', 'indent', '|',
                        'link', 'blockQuote', 'insertTable', 'mediaEmbed', '|',
                        'code', 'codeBlock',
                        'undo', 'redo'
                    ],
                    image: {
                        toolbar: [
                            'imageStyle:inline',
                            'imageStyle:block',
                            'imageStyle:side',
                            '|',
                            'toggleImageCaption',
                            'imageTextAlternative',
                            '|',
                            'linkImage'
                        ],
                        upload: {
                            types: ['jpeg', 'png', 'gif', 'bmp', 'webp', 'tiff']
                        }
                    },
                    table: {
                        contentToolbar: [
                            'tableColumn',
                            'tableRow',
                            'mergeTableCells',
                            'tableProperties',
                            'tableCellProperties'
                        ]
                    }
                });
                // Attach toolbar to the static container
                const toolbarContainer = document.getElementById('toolbar-container');
                toolbarContainer.appendChild(editor.ui.view.toolbar.element);

                // Set up auto-save functionality
                editor.model.document.on('change:data', () => {
                    if (!currentNote || !currentFolder) return;
                    
                    // Mark that user is typing
                    isTyping = true;
                    
                    // Clear any existing timeout
                    if (autoSaveTimeout) clearTimeout(autoSaveTimeout);
                    
                    // Set a new timeout to save after 2 seconds of inactivity
                    autoSaveTimeout = setTimeout(() => {
                        const currentContent = editor.getData();
                        const title = document.getElementById('noteTitle').value;
                        
                        // Only save if there's a title, content has changed, and we have a folder
                        if (title && currentContent !== lastSavedContent && currentFolder) {
                            console.log('Auto-saving note...');
                            autoSaveNote(title, currentContent);
                            lastSavedContent = currentContent;
                        }
                        
                        isTyping = false;
                    }, 2000);
                });
                
                // Also auto-save when title changes
                document.getElementById('noteTitle').addEventListener('input', () => {
                    if (!currentNote || !currentFolder) return;
                    
                    // Clear any existing timeout
                    if (autoSaveTimeout) clearTimeout(autoSaveTimeout);
                    
                    // Set a new timeout to save after 2 seconds of inactivity
                    autoSaveTimeout = setTimeout(() => {
                        const currentContent = editor.getData();
                        const title = document.getElementById('noteTitle').value;
                        
                        // Only save if there's a title and we have a folder
                        if (title && currentFolder) {
                            console.log('Auto-saving note after title change...');
                            autoSaveNote(title, currentContent);
                            lastSavedContent = currentContent;
                        }
                    }, 2000);
                });

                // Add image upload adapter
                editor.plugins.get('FileRepository').createUploadAdapter = (loader) => {
                    return {
                        upload: async () => {
                            try {
                                const file = await loader.file;
                                const formData = new FormData();
                                formData.append('upload', file);

                                const response = await fetch('/api/notes/upload-image', {
                                    method: 'POST',
                                    body: formData
                                });

                                if (!response.ok) {
                                    throw new Error('Upload failed');
                                }

                                const data = await response.json();
                                return {
                                    default: data.url
                                };
                            } catch (error) {
                                console.error('Upload error:', error);
                                throw error;
                            }
                        }
                    };
                };

                console.log('Editor initialized successfully');
            } catch (error) {
                console.error('Error initializing editor:', error);
                document.getElementById('editor').innerHTML = `
                    <div class="alert alert-danger">
                        Failed to initialize editor. Please refresh the page.
                        <br>
                        Error: ${error.message}
                        <br>
                        <button class="btn btn-primary mt-2" onclick="window.location.reload()">
                            Refresh Page
                        </button>
                    </div>
                `;
            }
        }

        // Toggle sidebar
        function toggleSidebar() {
            const sidebarCol = document.querySelector('.col-md-3');
            const editorCol = document.querySelector('.col-md-9');
            
            isSidebarCollapsed = !isSidebarCollapsed;
            
            if (isSidebarCollapsed) {
                sidebarCol.classList.add('d-none');
                editorCol.classList.remove('col-md-9');
                editorCol.classList.add('col-md-12');
                
                // Show floating toggle button
                let floatingBtn = document.getElementById('floatingToggleBtn');
                if (!floatingBtn) {
                    floatingBtn = document.createElement('button');
                    floatingBtn.id = 'floatingToggleBtn';
                    floatingBtn.className = 'btn btn-primary position-fixed';
                    floatingBtn.style.left = '20px';
                    floatingBtn.style.bottom = '20px';
                    floatingBtn.style.zIndex = '1000';
                    floatingBtn.innerHTML = '<i class="bi bi-layout-sidebar"></i>';
                    floatingBtn.title = 'Show Sidebar';
                    floatingBtn.onclick = toggleSidebar;
                    document.body.appendChild(floatingBtn);
                } else {
                    floatingBtn.style.display = 'block';
                }
            } else {
                sidebarCol.classList.remove('d-none');
                editorCol.classList.remove('col-md-12');
                editorCol.classList.add('col-md-9');
                
                // Hide floating toggle button
                const floatingBtn = document.getElementById('floatingToggleBtn');
                if (floatingBtn) {
                    floatingBtn.style.display = 'none';
                }
            }
        }

        // Toggle folder
        function toggleFolder(folderName) {
            folderCollapseState[folderName] = !folderCollapseState[folderName];
            loadFolders(); // Re-render both sidebars to reflect the new state
        }

        // Search notes
        function searchNotes(query) {
            if (!query || query.trim() === '') {
                // Reset everything if search is cleared
                document.querySelectorAll('.note-item').forEach(item => {
                    item.style.display = '';
                    // Remove any highlights
                    const title = item.querySelector('.note-title');
                    title.innerHTML = title.textContent;
                });
                
                // Show all folders
                document.querySelectorAll('.folder-content').forEach(folder => {
                    folder.classList.remove('collapsed');
                });
                
                document.querySelectorAll('[id$="-toggle"] i').forEach(icon => {
                    icon.classList.remove('bi-caret-right-fill');
                    icon.classList.add('bi-caret-down-fill');
                });
                
                // Clear search status
                let searchStatus = document.getElementById('searchStatus');
                if (searchStatus) {
                    searchStatus.innerHTML = '';
                }
                
                return;
            }
            
            query = query.toLowerCase();
            
            // Track which folders have matches
            const foldersWithMatches = new Set();
            let totalMatches = 0;
            
            // First pass: hide all notes and look for matches
            document.querySelectorAll('.note-item').forEach(item => {
                // Default to hiding
                item.style.display = 'none';
                
                // Get the parent folder
                const folderContent = item.closest('.folder-content');
                const folderName = folderContent ? folderContent.id.replace('folder-', '') : null;
                
                if (!folderName) return;
                
                // Get the title
                const titleElement = item.querySelector('.note-title');
                const title = titleElement.textContent.toLowerCase();
                
                // Check for title match
                const titleMatch = title.includes(query);
                
                if (titleMatch) {
                    // Show this note
                    item.style.display = '';
                    foldersWithMatches.add(folderName);
                    totalMatches++;
                    
                    // Highlight the match in the title
                    const highlightedTitle = titleElement.textContent.replace(
                        new RegExp(query, 'gi'),
                        match => `<span class="search-highlight">${match}</span>`
                    );
                    titleElement.innerHTML = highlightedTitle;
                }
            });
            
            // Second pass: load content for additional content matches if we have few results
            if (totalMatches < 5 && query.length > 2) {
                // Only do content search for queries over 2 chars to avoid performance issues
                loadContentSearchResults(query);
            }
            
            // Expand folders with matches
            foldersWithMatches.forEach(folderName => {
                const folderContent = document.getElementById(`folder-${folderName}`);
                if (folderContent) {
                    folderContent.classList.remove('collapsed');
                    
                    // Update folder toggle icon
                    const toggleIcon = document.querySelector(`#folder-${folderName}-toggle i`);
                    if (toggleIcon) {
                        toggleIcon.classList.remove('bi-caret-right-fill');
                        toggleIcon.classList.add('bi-caret-down-fill');
                    }
                }
            });
            
            // Show search result count
            updateSearchResultCount(totalMatches);
        }
        
        // Helper function to load content-based search results
        async function loadContentSearchResults(query) {
            // Get all notes that might have content
            const notesData = [];
            
            // For each folder, get notes
            document.querySelectorAll('.folder-content').forEach(folderElem => {
                const folderName = folderElem.id.replace('folder-', '');
                
                // For each note in this folder that's currently hidden
                folderElem.querySelectorAll('.note-item').forEach(noteElem => {
                    if (noteElem.style.display === 'none') {
                        // Get note ID from onclick attribute
                        const onclickAttr = noteElem.getAttribute('onclick');
                        if (onclickAttr) {
                            const match = onclickAttr.match(/loadNote\(['"]([^'"]+)['"],\s*['"]([^'"]+)['"]\)/);
                            if (match && match.length === 3) {
                                const [_, folder, noteId] = match;
                                notesData.push({
                                    folder,
                                    noteId,
                                    element: noteElem
                                });
                            }
                        }
                    }
                });
            });
            
            // Now load content for each note and search
            const foldersWithMatches = new Set();
            let additionalMatches = 0;
            
            for (const noteData of notesData) {
                try {
                    const response = await fetch(`/api/notes/${noteData.folder}/${noteData.noteId}`);
                    if (!response.ok) continue;
                    
                    const note = await response.json();
                    // Search in content
                    if (note.content && note.content.toLowerCase().includes(query.toLowerCase())) {
                        // Show this note
                        noteData.element.style.display = '';
                        foldersWithMatches.add(noteData.folder);
                        additionalMatches++;
                        
                        // Add "content match" indicator
                        const titleElem = noteData.element.querySelector('.note-title');
                        if (titleElem) {
                            // Add a small indicator next to the title
                            titleElem.innerHTML += ' <small class="text-muted content-match-indicator">(content match)</small>';
                        }
                    }
                } catch (error) {
                    console.error('Error searching note content:', error);
                }
            }
            
            // Expand additional folders with matches
            foldersWithMatches.forEach(folderName => {
                const folderContent = document.getElementById(`folder-${folderName}`);
                if (folderContent) {
                    folderContent.classList.remove('collapsed');
                    
                    // Update folder toggle icon
                    const toggleIcon = document.querySelector(`#folder-${folderName}-toggle i`);
                    if (toggleIcon) {
                        toggleIcon.classList.remove('bi-caret-right-fill');
                        toggleIcon.classList.add('bi-caret-down-fill');
                    }
                }
            });
            
            // Update the search result count with the additional matches
            updateSearchResultCount(document.querySelectorAll('.note-item[style="display: ;"]').length);
        }
        
        // Update search result count
        function updateSearchResultCount(count) {
            let searchStatus = document.getElementById('searchStatus');
            if (!searchStatus) {
                searchStatus = document.createElement('div');
                searchStatus.id = 'searchStatus';
                searchStatus.className = 'small text-muted mt-2 ms-1';
                const searchBox = document.querySelector('.search-box');
                if (searchBox) {
                    searchBox.appendChild(searchStatus);
                }
            }
            
            if (count === 0) {
                searchStatus.innerHTML = 'No matches found';
            } else {
                searchStatus.innerHTML = `${count} match${count !== 1 ? 'es' : ''} found`;
            }
        }

        // Load folders and notes
        async function loadFolders() {
            try {
                console.log('Loading folders...');
                const response = await fetch('/api/notes/folders');
                console.log('Folder response status:', response.status);
                const folders = await response.json();
                console.log('Received folders:', folders);
                displayFolders(folders, document.getElementById('folderTree'));
                displayFolders(folders, document.getElementById('folderTreeMobile'));
            } catch (error) {
                console.error('Error loading folders:', error);
            }
        }

        // Display folders in the tree
        function displayFolders(folders, parentElement = document.getElementById('folderTree')) {
            parentElement.innerHTML = '';
            if (!folders || folders.length === 0) {
                parentElement.innerHTML = `
                    <div class="text-center py-4">
                        <div class="text-muted mb-3">No folders found.</div>
                        <button class="btn btn-primary" onclick="createNewFolder()">
                            <i class="bi bi-folder-plus"></i> Create Your First Folder
                        </button>
                    </div>
                `;
                return;
            }
            folders.sort((a, b) => a.localeCompare(b));
            folders.forEach(folder => {
                const isCollapsed = folderCollapseState[folder];
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder-item';
                folderDiv.innerHTML = `
                    <div class="folder-header">
                        <div class="d-flex align-items-center folder-name-container" data-folder="${folder}" style="position:relative;">
                            <span id="folder-${folder}-toggle" onclick="event.stopPropagation(); toggleFolder('${folder}')" style="cursor:pointer;">
                                <i class="bi ${isCollapsed ? 'bi-caret-right-fill' : 'bi-caret-down-fill'} text-primary me-1"></i>
                            </span>
                            <i class="bi bi-folder-fill text-warning me-1"></i>
                            <span class="folder-name-span" onclick="selectFolder('${folder}')">${folder}</span>
                        </div>
                        <div class="folder-actions d-flex align-items-center" style="gap:4px; pointer-events:auto;">
                            <button class="btn btn-sm btn-outline-secondary rename-folder-btn" title="Rename Folder" onclick="event.stopPropagation(); renameFolder('${folder}')"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); createNewNote('${folder}')">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                    <div class="folder-content${isCollapsed ? ' collapsed' : ''}" id="folder-${folder}"></div>
                `;
                parentElement.appendChild(folderDiv);
                loadNotes(folder, folderDiv.querySelector('.folder-content'));
            });
        }

        // Show/hide rename button on hover
        window.showRenameBtn = function(el) {
            const btn = el.querySelector('.rename-folder-btn');
            if (btn) btn.classList.remove('d-none');
        };
        window.hideRenameBtn = function(el) {
            const btn = el.querySelector('.rename-folder-btn');
            if (btn) btn.classList.add('d-none');
        };

        // Rename folder function
        async function renameFolder(oldName) {
            const newName = prompt('Enter new folder name:', oldName);
            if (!newName || newName.trim() === '' || newName === oldName) return;
            try {
                const response = await fetch('/api/notes/folders/rename', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldName, newName })
                });
                if (response.ok) {
                    // If currentFolder was renamed, update it
                    if (currentFolder === oldName) {
                        currentFolder = newName;
                        document.getElementById('currentFolderDisplay').innerHTML = `<span class="badge bg-primary">${newName}</span>`;
                    }
                    await loadFolders();
                } else {
                    alert('Failed to rename folder.');
                }
            } catch (error) {
                alert('Error renaming folder: ' + error.message);
            }
        }

        // Load notes for a folder
        async function loadNotes(folderName, parentElement) {
            try {
                const response = await fetch(`/api/notes/${folderName}`);
                const notes = await response.json();
                parentElement.innerHTML = '';
                
                if (notes && notes.length > 0) {
                    // Sort notes alphabetically by title
                    notes.sort((a, b) => a.title.localeCompare(b.title));
                    
                    notes.forEach(note => {
                        const noteDiv = document.createElement('div');
                        noteDiv.className = 'note-item';
                        noteDiv.innerHTML = `
                            <i class="bi bi-file-earmark-text text-warning me-1"></i>
                            <div class="note-title flex-grow-1">${note.title}</div>
                            <div class="note-actions ms-auto" style="display: flex; gap: 4px;">
                                <button class="btn btn-sm btn-link text-info note-view-btn" title="View" onclick="event.stopPropagation(); viewNoteFromSidebar('${folderName}', '${note.id}')"><i class="bi bi-eye"></i></button>
                                <button class="btn btn-sm btn-link text-secondary note-rename-btn" title="Rename" onclick="event.stopPropagation(); renameNote('${folderName}', '${note.id}', '${note.title.replace(/'/g, "&#39;")}')"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-link text-danger note-delete-btn" title="Delete" onclick="event.stopPropagation(); deleteNoteFromSidebar('${folderName}', '${note.id}')"><i class="bi bi-trash"></i></button>
                            </div>
                        `;
                        noteDiv.onclick = () => loadNote(folderName, note.id);
                        parentElement.appendChild(noteDiv);
                    });
                } else {
                    parentElement.innerHTML = '<div class="text-center text-muted py-2">No notes in this folder</div>';
                }
            } catch (error) {
                console.error('Error loading notes:', error);
                parentElement.innerHTML = '<div class="text-center text-danger py-2">Error loading notes</div>';
            }
        }

        // Load a specific note
        async function loadNote(folderName, noteId) {
            try {
                const response = await fetch(`/api/notes/${folderName}/${noteId}`);
                const note = await response.json();
                currentNote = note;
                currentFolder = folderName;
                
                // Set the title in the title field
                document.getElementById('noteTitle').value = note.title;
                
                // Remove the title from the content if it appears at the beginning
                let content = note.content;
                
                // Escape special regex characters in the title
                const titleEscaped = note.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                
                // Create a comprehensive regex that matches common ways the title might appear at the start
                const titleRegex = new RegExp(
                    `^\\s*(?:<(?:h[1-6]|p|div)>${titleEscaped}</(?:h[1-6]|p|div)>|${titleEscaped}(?:<br>|\\s*))\\s*`, 
                    'i'
                );
                
                // Remove title from beginning of content
                content = content.replace(titleRegex, '');
                
                // Set the content without the title
                editor.setData(content);
                
                // Store current content for auto-save comparison
                lastSavedContent = content;
                
                // Reset any save indicator
                let saveIndicator = document.getElementById('autoSaveIndicator');
                if (saveIndicator) {
                    saveIndicator.style.opacity = '0';
                }
                
                // Show view button
                if (document.getElementById('viewButton')) document.getElementById('viewButton').style.display = 'block';
                if (document.getElementById('viewButtonMobile')) document.getElementById('viewButtonMobile').style.display = 'block';
                
                // Update active states
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
                
                // Find and highlight the selected note
                const noteElements = document.querySelectorAll('.note-item');
                noteElements.forEach(element => {
                    const titleElement = element.querySelector('.note-title');
                    if (titleElement && titleElement.textContent === note.title) {
                        element.classList.add('active');
                    }
                });
            } catch (error) {
                console.error('Error loading note:', error);
            }
        }

        // Save current note
        async function saveNote() {
            if (!editor) {
                alert('Editor is not initialized. Please refresh the page.');
                return;
            }
            let title = document.getElementById('noteTitle').value.trim();
            let content = editor.getData();
            let folder = currentFolder;
            // If no folder or title, use temp folder and temp title
            if (!folder || !title) {
                if (!folder) {
                    folder = 'temp';
                    currentFolder = 'temp';
                }
                if (!title) {
                    const now = new Date();
                    const pad = n => n.toString().padStart(2, '0');
                    title = `temp_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
                    document.getElementById('noteTitle').value = title;
                }
                if (typeof folders === 'undefined' || !folders.includes('temp')) {
                    if (typeof createNewFolder === 'function') await createNewFolder('temp');
                }
            }
            try {
                const noteData = {
                    title: title,
                    content: content,
                    folder: folder,
                    id: currentNote ? currentNote.id : null
                };
                const response = await fetch('/api/notes/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(noteData)
                });
                if (response.ok) {
                    lastSavedContent = content;
                    let saveIndicator = document.getElementById('autoSaveIndicator');
                    if (saveIndicator) { saveIndicator.style.opacity = '1'; setTimeout(() => { saveIndicator.style.opacity = '0'; }, 1200); }
                    // Reload folders and notes via AJAX
                    await loadFolders();
                    // Optionally, re-select the current folder and note
                    if (folder) {
                        selectFolder(folder);
                        // If editing an existing note, reload it
                        if (currentNote && currentNote.id) {
                            await loadNote(folder, currentNote.id);
                        }
                    }
                } else {
                    alert('Failed to save note. Please try again.');
                }
            } catch (error) {
                alert('Error saving note: ' + error.message);
            }
        }

        // Auto-save function
        async function autoSaveNote(title, content) {
            let folder = currentFolder;
            if (!folder || !title) {
                if (!folder) {
                    folder = 'temp';
                    currentFolder = 'temp';
                }
                if (!title) {
                    const now = new Date();
                    const pad = n => n.toString().padStart(2, '0');
                    title = `temp_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
                    document.getElementById('noteTitle').value = title;
                }
                if (typeof folders === 'undefined' || !folders.includes('temp')) {
                    if (typeof createNewFolder === 'function') await createNewFolder('temp');
                }
            }
            try {
                const noteData = {
                    title: title,
                    content: content,
                    folder: folder,
                    id: currentNote ? currentNote.id : null
                };
                await fetch('/api/notes/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(noteData)
                });
                lastSavedContent = content;
                // Reload folders and notes via AJAX
                await loadFolders();
                if (folder) {
                    selectFolder(folder);
                    if (currentNote && currentNote.id) {
                        await loadNote(folder, currentNote.id);
                    }
                }
            } catch (error) {
                // Optionally handle error
            }
        }

        // Create new folder
        async function createNewFolder() {
            const folderName = prompt('Enter folder name:');
            if (!folderName) return; // User canceled or entered empty name
            
            if (folderName.trim() === '') {
                alert('Folder name cannot be empty.');
                return;
            }
            
            try {
                console.log('Creating folder:', folderName);
                
                // Show a loading indicator in the folder tree
                const folderTree = document.getElementById('folderTree');
                if (folderTree) {
                    const prevContent = folderTree.innerHTML;
                    folderTree.innerHTML = `
                        <div class="text-center py-3">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <div class="mt-2">Creating folder...</div>
                        </div>
                    `;
                }
                
                const response = await fetch('/api/notes/folders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: folderName })
                });
                console.log('Create folder response status:', response.status);

                if (response.ok) {
                    // Clear current note if any
                    currentNote = null;
                    currentFolder = null;
                    document.getElementById('noteTitle').value = '';
                    editor.setData('');
                    document.getElementById('currentFolderDisplay').innerHTML = '';
                    
                    // Reload folders immediately
                    console.log('Reloading folders after creation...');
                    await loadFolders();
                    
                    // Select the newly created folder
                    setTimeout(() => {
                        selectFolder(folderName);
                    }, 100);
                } else {
                    // Show error if folder creation failed
                    alert('Failed to create folder. Please try again.');
                    loadFolders();
                }
            } catch (error) {
                console.error('Error creating folder:', error);
                alert('Error creating folder. Please try again.');
                loadFolders();
            }
        }

        // Create new note in a folder and display it for editing
        window.createNewNote = async function(folderName) {
            if (!folderName) return;
            // Generate a unique temp title
            const now = new Date();
            const pad = n => n.toString().padStart(2, '0');
            const tempTitle = `New Note ${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            try {
                // Save a new note with empty content
                const noteData = {
                    title: tempTitle,
                    content: '',
                    folder: folderName,
                    id: null
                };
                const response = await fetch('/api/notes/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(noteData)
                });
                if (response.ok) {
                    // Reload folders and notes
                    await loadFolders();
                    // Get the list of notes to find the new note's id
                    const notesResp = await fetch(`/api/notes/${folderName}`);
                    const notes = await notesResp.json();
                    // Find the note with the matching title (should be unique)
                    const newNote = notes.find(n => n.title === tempTitle);
                    if (newNote) {
                        // Select the folder and load the new note for editing
                        selectFolder(folderName);
                        await loadNote(folderName, newNote.id);
                    }
                } else {
                    alert('Failed to create new note.');
                }
            } catch (error) {
                alert('Error creating new note: ' + error.message);
            }
        };

        // Delete current note
        async function deleteNote() {
            if (currentNote && confirm('Are you sure you want to delete this note?')) {
                try {
                    const response = await fetch(`/api/notes/${currentFolder}/${currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        currentNote = null;
                        document.getElementById('noteTitle').value = '';
                        editor.setData('');
                        loadFolders();
                    }
                } catch (error) {
                    console.error('Error deleting note:', error);
                }
            }
        }

        // View note in a new tab
        function viewNote() {
            if (!currentNote || !currentFolder) {
                alert('Please save the note first before viewing.');
                return;
            }
            
            // Generate view URL
            const viewUrl = `${window.location.origin}/view/${currentFolder}/${currentNote.id}`;
            
            // Open in a new tab
            window.open(viewUrl, '_blank');
        }

        // Share current note - generate shareable URL
        function shareNote() {
            if (!currentNote || !currentFolder) {
                alert('Please save the note first before sharing.');
                return;
            }
            
            // Generate shareable URL
            const shareUrl = `${window.location.origin}/view/${currentFolder}/${currentNote.id}`;
            
            // Create temporary input to copy URL
            const tempInput = document.createElement('input');
            document.body.appendChild(tempInput);
            tempInput.value = shareUrl;
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            
            // Show toast or alert
            alert('Shareable URL copied to clipboard: ' + shareUrl);
        }

        // Select a folder and update the UI
        window.selectFolder = async function(folderName) {
            currentFolder = folderName;
            // Update current folder display badge
            const display = document.getElementById('currentFolderDisplay');
            if (display) {
                display.innerHTML = `<span class="badge bg-primary">${folderName}</span>`;
            }
            // Highlight the selected folder in the sidebar
            document.querySelectorAll('.folder-item').forEach(item => {
                const nameSpan = item.querySelector('.folder-name-span');
                if (nameSpan && nameSpan.textContent === folderName) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            // Expand the folder if collapsed
            folderCollapseState[folderName] = false;
            // Reload notes for the selected folder
            const folderContent = document.getElementById(`folder-${folderName}`);
            if (folderContent) {
                await loadNotes(folderName, folderContent);
            }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await initEditor();
                await loadFolders();

                // Add search functionality
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', (e) => {
                    searchNotes(e.target.value);
                });
            } catch (error) {
                console.error('Initialization error:', error);
                alert('Failed to initialize the editor. Please refresh the page.');
            }
        });

        function viewNoteFromSidebar(folder, noteId) {
            window.open(`${window.location.origin}/view/${folder}/${noteId}`, '_blank');
        }

        async function deleteNoteFromSidebar(folder, noteId) {
            if (confirm('Are you sure you want to delete this note?')) {
                try {
                    const response = await fetch(`/api/notes/${folder}/${noteId}`, { method: 'DELETE' });
                    if (response.ok) {
                        loadFolders();
                    }
                } catch (error) {
                    console.error('Error deleting note:', error);
                }
            }
        }

        // Add note rename function to global scope
        window.renameNote = async function(folder, noteId, oldTitle) {
            const newTitle = prompt('Enter new note title:', oldTitle);
            if (!newTitle || newTitle.trim() === '' || newTitle === oldTitle) return;
            try {
                // Load the note to get its content
                const response = await fetch(`/api/notes/${folder}/${noteId}`);
                if (!response.ok) throw new Error('Failed to load note');
                const note = await response.json();
                // Save note with new title (keep same id and content)
                const saveResp = await fetch('/api/notes/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ...note,
                        title: newTitle
                    })
                });
                if (saveResp.ok) {
                    await loadFolders();
                    // If this note is currently loaded, update the title field
                    if (currentNote && currentNote.id === noteId && currentFolder === folder) {
                        document.getElementById('noteTitle').value = newTitle;
                    }
                } else {
                    alert('Failed to rename note.');
                }
            } catch (error) {
                alert('Error renaming note: ' + error.message);
            }
        };
    </script>

    <script>
        (function() {
            fetch('/settings/api').then(r => r.json()).then(settings => {
                if (settings.headerBgColor) document.documentElement.style.setProperty('--header-bg', settings.headerBgColor);
                if (settings.headerTextColor) document.documentElement.style.setProperty('--header-text', settings.headerTextColor);
                if (settings.backgroundColor) document.documentElement.style.setProperty('--background-color', settings.backgroundColor);
                if (settings.fontSize) document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
                if (settings.fontFamily) document.documentElement.style.setProperty('--font-family', settings.fontFamily);
                if (settings.borderRadius) document.documentElement.style.setProperty('--border-radius', settings.borderRadius + 'px');
            });
        })();
    </script>
