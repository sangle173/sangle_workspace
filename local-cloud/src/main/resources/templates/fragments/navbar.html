<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-light" href="/">🌐 My Tools</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#httpServletRequest.getRequestURI() == '/' ? 'active fw-bold' : ''}" href="/">
                            <i class="bi bi-house-door-fill me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/sonos') ? 'active fw-bold' : ''}" href="/sonos">
                            <i class="bi bi-speaker-fill me-1"></i>Device Discovery
                        </a>
                    </li>
                    
                    <!-- Dropdown for URL Converter and Downloads -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" 
                           th:classappend="${#httpServletRequest.getRequestURI().startsWith('/url-converter') || #httpServletRequest.getRequestURI().startsWith('/files') ? 'active fw-bold' : ''}"
                           href="#" id="downloadToolsDropdown" role="button" 
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-cloud-download me-1"></i>Download Tools
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="downloadToolsDropdown">
                            <li>
                                <a class="dropdown-item" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/url-converter') ? 'active' : ''}" href="/url-converter">
                                    <i class="bi bi-arrow-repeat me-1"></i>URL Converter
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/files') ? 'active' : ''}" href="/files">
                                    <i class="bi bi-download me-1"></i>Downloads
                                </a>
                            </li>
                        </ul>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/server-files') ? 'active fw-bold' : ''}" href="/server-files">
                            <i class="bi bi-folder2-open me-1"></i>ServerFolder
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/image-editor') ? 'active fw-bold' : ''}" href="/image-editor">
                            <i class="bi bi-pencil-square me-1"></i>Image Editor
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/cut') ? 'active fw-bold' : ''}" href="/cut">
                            <i class="bi bi-scissors me-1"></i>Video Cutter
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/notes') ? 'active fw-bold' : ''}" href="/notes">
                            <i class="bi bi-journal-text me-1"></i>Notes
                        </a>
                    </li>
                    
                    <!-- Jira Tools Dropdown - Only visible for specific IPs -->
                    <li class="nav-item dropdown">
                        <!-- Always show Jira Tools, but we'll add a small debug indicator -->
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-info text-dark d-none d-lg-inline-block" style="font-size: 0.6rem;" th:text="${#httpServletRequest.getRemoteAddr()}">
                            IP
                        </span>
                        
                        <a class="nav-link dropdown-toggle" 
                           th:classappend="${#httpServletRequest.getRequestURI().startsWith('/jira-dashboard') ? 'active fw-bold' : ''}"
                           href="#" id="jiraToolsDropdown" role="button" 
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-kanban me-1"></i>Jira Tools
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="jiraToolsDropdown">
                            <li>
                                <a class="dropdown-item" th:classappend="${#httpServletRequest.getRequestURI() == '/jira-dashboard' ? 'active' : ''}" href="/jira-dashboard">
                                    <i class="bi bi-kanban-fill me-1"></i>Dashboard
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:classappend="${#httpServletRequest.getRequestURI().startsWith('/jira-dashboard/tasks') ? 'active' : ''}" href="/jira-dashboard/tasks">
                                    <i class="bi bi-filter-square-fill me-1"></i>JIRA Filters
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <style>
        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            margin: 0 2px;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .navbar .nav-link:hover {
            color: white !important;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .navbar .nav-link.active {
            color: white !important;
            background-color: rgba(255, 255, 255, 0.15);
        }
        .dropdown-menu {
            border-radius: 8px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .dropdown-item {
            border-radius: 4px;
            padding: 0.5rem 1rem;
            margin-bottom: 2px;
        }
        .dropdown-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .dropdown-item.active {
            background-color: rgba(255, 255, 255, 0.15);
            font-weight: bold;
        }
    </style>
</div>
</body>
</html>
