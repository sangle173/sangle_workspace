<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Discovered Sonos Devices</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container my-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="mb-0">Discovered Sonos Devices by Network</h2>
            <button class="btn btn-outline-primary" id="exportCsvBtn">
                <i class="bi bi-download"></i> Export to CSV
            </button>
        </div>
        <div th:each="entry : ${devicesByNetwork}">
            <h4 th:text="${entry.key}"></h4>
            <div style="overflow-x:auto;">
            <table class="table table-bordered table-sm sonos-table" style="min-width:1800px;">
                <thead>
                <tr>
                    <th>#</th>
                    <th>IP</th>
                    <th>Room Name</th>
                    <th>Friendly Name</th>
                    <th>UUID</th>
                    <th>MAC Address</th>
                    <th>Serial Number</th>
                    <th>SW Version</th>
                    <th>MinCompat Version</th>
                    <th>Market Version</th>
                    <th>HW Version</th>
                    <th>HW Model</th>
                    <th>Model Name</th>
                    <th>Model Desc</th>
                    <th>Manufacturer</th>
                    <th>Manufacturer URL</th>
                    <th>HHID</th>
                    <th>Status URL</th>
                    <th>Network</th>
                    <th>Scan Date/Time</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="device,iter : ${entry.value}">
                    <td th:text="${iter.index+1}"></td>
                    <td th:text="${device['ip']}"></td>
                    <td th:text="${device['roomName']}"></td>
                    <td th:text="${device['friendlyName']}"></td>
                    <td th:text="${device['UDN']}"></td>
                    <td th:text="${device['MACAddress']}"></td>
                    <td th:text="${device['serialNum']}"></td>
                    <td th:text="${device['softwareVersion']}"></td>
                    <td th:text="${device['minCompatibleVersion']}"></td>
                    <td th:text="${device['displayVersion']}"></td>
                    <td th:text="${device['hardwareVersion']}"></td>
                    <td th:text="${device['modelNumber']}"></td>
                    <td th:text="${device['modelName']}"></td>
                    <td th:text="${device['modelDescription']}"></td>
                    <td th:text="${device['manufacturer']}"></td>
                    <td th:text="${device['manufacturerURL']}"></td>
                    <td th:text="${device['HHID']}"></td>
                    <td th:text="${device['statusUrl']}"></td>
                    <td th:text="${device['network']}"></td>
                    <td th:text="${device['scanDateTime']}"></td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>
        <div th:if="${devicesByNetwork}">
            <script id="allDevicesJson" type="application/json" th:utext="${allDevicesJson}"></script>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.js"></script>
    <script>
    document.getElementById('exportCsvBtn').onclick = function() {
        // CSV field mapping and order (match table columns)
        const csvFields = [
            {label: '#', key: 'index'},
            {label: 'IP', key: 'ip'},
            {label: 'Room Name', key: 'roomName'},
            {label: 'Friendly Name', key: 'friendlyName'},
            {label: 'UUID', key: 'UDN'},
            {label: 'MAC Address', key: 'MACAddress'},
            {label: 'Serial Number', key: 'serialNum'},
            {label: 'SW Version', key: 'softwareVersion'},
            {label: 'MinCompat Version', key: 'minCompatibleVersion'},
            {label: 'Market Version', key: 'displayVersion'},
            {label: 'HW Version', key: 'hardwareVersion'},
            {label: 'HW Model', key: 'modelNumber'},
            {label: 'Model Name', key: 'modelName'},
            {label: 'Model Desc', key: 'modelDescription'},
            {label: 'Manufacturer', key: 'manufacturer'},
            {label: 'Manufacturer URL', key: 'manufacturerURL'},
            {label: 'HHID', key: 'HHID'},
            {label: 'Status URL', key: 'statusUrl'},
            {label: 'Network', key: 'network'},
            {label: 'Scan Date/Time', key: 'scanDateTime'}
        ];
        let allDevices = [];
        try {
            const raw = document.querySelector('script#allDevicesJson');
            if (raw) {
                allDevices = JSON.parse(raw.textContent);
            }
        } catch (e) {}
        if (!allDevices.length) {
            alert('No device data found.');
            return;
        }
        // CSV header
        let csv = csvFields.map(f => f.label).join(',') + '\n';
        // CSV rows
        allDevices.forEach((device, idx) => {
            let row = csvFields.map(f => {
                if (f.key === 'index') return idx + 1;
                let val = device[f.key] || '';
                // Special: strip uuid: from UUID if present
                if (f.key === 'UDN' && val && val.startsWith('uuid:')) val = val.substring(5);
                // Special: Status URL fallback
                if (f.key === 'statusUrl' && !val && device.ip) val = 'http://' + device.ip + ':1400/status';
                return '"' + (val ? ('' + val).replace(/"/g,'""') : '') + '"';
            }).join(',');
            csv += row + '\n';
        });
        const blob = new Blob([csv], {type: 'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sonos_devices.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    };
    </script>
</body>
</html>
