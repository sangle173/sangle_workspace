<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Discovered Sonos Devices</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container my-4">
        <h2>Discovered Sonos Devices by Network</h2>
        <div th:each="entry : ${devicesByNetwork}">
            <h4 th:text="${entry.key}"></h4>
            <table class="table table-bordered table-sm">
                <thead><tr><th>#</th><th>IP</th><th>Model Name</th><th>MAC Address</th><th>Serial Number</th><th>Hardware Version</th></tr></thead>
                <tbody>
                <tr th:each="device,iter : ${entry.value}">
                    <td th:text="${iter.index+1}"></td>
                    <td th:text="${device.ip}"></td>
                    <td th:text="${device.modelName}"></td>
                    <td th:text="${device.MACAddress}"></td>
                    <td th:text="${device.serialNum}"></td>
                    <td th:text="${device.hardwareVersion}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
