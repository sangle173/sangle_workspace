<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>📁 Quản lý Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .editable:hover {
            background-color: #fff3cd;
            cursor: text;
        }
        .editable[contenteditable="false"] {
            background-color: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-4">
    <h2 class="mb-4 text-primary">📁 Quản lý Space</h2>

    <ul class="list-group mb-3">
        <li class="list-group-item d-flex justify-content-between align-items-center"
            th:each="space : ${spaces}">
            <div class="d-flex align-items-center gap-2 flex-grow-1">
                <!-- Name (clickable by default) -->
                <a th:href="@{'/spaces/' + ${space} + '/categories'}"
                   class="flex-grow-1 text-decoration-none text-dark fw-bold"
                   th:text="${space}"
                   th:id="'space-link-' + ${space.hashCode()}"></a>

                <!-- Hidden editable input -->
                <span class="editable d-none flex-grow-1"
                      contenteditable="true"
                      th:data-old-name="${space}"
                      th:data-id="${space.hashCode()}"
                      onblur="renameSpace(this)"
                      onkeydown="handleEnter(event, this)"></span>

                <!-- Edit button -->
                <button type="button"
                        class="btn btn-sm btn-outline-secondary"
                        th:data-id="${space.hashCode()}"
                        onclick="enableEdit(this)">✏</button>
            </div>

            <!-- Delete -->
            <button type="button"
                    class="btn btn-sm btn-outline-danger ms-2"
                    th:data-item-name="${space}"
                    th:data-action="@{/spaces/delete}"
                    onclick="confirmDelete(this)">Xóa</button>
        </li>
    </ul>

    <form th:action="@{/spaces/create}" method="post" class="d-flex gap-2">
        <input type="text" name="name" class="form-control" placeholder="Tên Space mới" required />
        <button class="btn btn-primary">Tạo Space</button>
    </form>
</main>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
    <div class="toast border-0 shadow-sm"
         th:if="${toastMessage}"
         th:id="'toastMsg'"
         role="alert"
         th:class="'toast show ' + (${toastType} == 'success' ? 'bg-success text-white' : 'bg-danger text-white')">
        <div class="d-flex">
            <div class="toast-body" th:text="${toastMessage}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-danger">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="confirmDeleteModalLabel">Xác nhận xóa</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">Bạn có chắc chắn muốn xóa mục này?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Xóa</button>
            </div>
        </div>
    </div>
</div>

<script>
    function enableEdit(button) {
        const id = button.getAttribute("data-id");
        const link = document.getElementById("space-link-" + id);
        const editable = document.querySelector(`[data-id="${id}"].editable`);

        editable.textContent = link.textContent;
        editable.classList.remove("d-none");
        editable.focus();
        link.classList.add("d-none");
    }

    function renameSpace(el) {
        const oldName = el.dataset.oldName;
        const newName = el.textContent.trim();
        const id = el.dataset.id;
        const link = document.getElementById("space-link-" + id);

        if (!newName || newName === oldName) {
            cancelRename(id, oldName);
            return;
        }

        $.ajax({
            url: '/spaces/rename',
            method: 'PATCH',
            data: { oldName, newName },
            success: () => {
                showToast(`✅ Đã đổi tên thành "${newName}"`, 'success');
                el.dataset.oldName = newName;
                link.textContent = newName;
                cancelRename(id, newName);
            },
            error: () => {
                showToast(`❌ Không thể đổi tên "${oldName}"`, 'danger');
                cancelRename(id, oldName);
            }
        });
    }

    function cancelRename(id, name) {
        const link = document.getElementById("space-link-" + id);
        const editable = document.querySelector(`[data-id="${id}"].editable`);

        link.textContent = name;
        link.classList.remove("d-none");
        editable.classList.add("d-none");
    }

    function handleEnter(event, el) {
        if (event.key === 'Enter') {
            event.preventDefault();
            el.blur();
        }
    }

    function confirmDelete(button) {
        const modal = new bootstrap.Modal(document.getElementById("confirmDeleteModal"));
        const action = button.getAttribute("data-action");
        const name = button.getAttribute("data-item-name");

        const form = document.createElement("form");
        form.method = "POST";
        form.action = action;

        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "name";
        input.value = name;
        form.appendChild(input);

        document.getElementById("confirmDeleteBtn").onclick = () => {
            document.body.appendChild(form);
            form.submit();
        };

        modal.show();
    }

    function showToast(message, type) {
        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-bg-${type} border-0 show position-fixed bottom-0 end-0 m-4`;
        toast.style.zIndex = 9999;
        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;
        document.body.appendChild(toast);
        new bootstrap.Toast(toast, { delay: 3000 }).show();
    }

    document.addEventListener("DOMContentLoaded", () => {
        const toastEl = document.getElementById("toastMsg");
        if (toastEl) new bootstrap.Toast(toastEl, { delay: 3000 }).show();
    });
</script>

</body>
</html>
