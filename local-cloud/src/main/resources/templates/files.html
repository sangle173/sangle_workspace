<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download Files</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        #downloadProgressContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            z-index: 2000;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 1rem;
            display: none;
        }
        #downloadProgressList {
            max-height: 200px;
            overflow-y: auto;
        }
        @media (max-width: 600px) {
            .input-group.flex-nowrap { flex-direction: column !important; align-items: stretch !important; }
            .input-group.flex-nowrap > * { width: 100% !important; margin-bottom: 0.5rem; }
            .d-flex.align-items-center { flex-direction: column !important; align-items: stretch !important; }
            .d-flex.align-items-center > * { margin-bottom: 0.5rem; }
        }
    </style>
    <script>
        let allFiles = [];
        let filteredFiles = [];
        let allExtensions = [];
        let selectedExtensions = new Set();
        let downloading = false;
        let serverDownloadPollInterval = null;

        async function fetchLinks() {
            const url = document.getElementById('fetchUrl').value.trim();
            if (!url) return;
            const resp = await fetch('/fetch-links?url=' + encodeURIComponent(url));
            if (!resp.ok) {
                alert('Failed to fetch links');
                return;
            }
            allFiles = await resp.json();
            allExtensions = Array.from(new Set(allFiles.map(f => {
                const m = f.match(/\.([a-zA-Z0-9]{2,5})(\?.*)?$/);
                return m ? m[1].toLowerCase() : null;
            }).filter(Boolean)));
            selectedExtensions = new Set(allExtensions);
            renderExtensionFilters();
            filterByExtension();
        }

        function renderExtensionFilters() {
            const extDiv = document.getElementById('extFilters');
            extDiv.innerHTML = '';
            // Add Select All checkbox
            const selectAllLabel = document.createElement('label');
            selectAllLabel.className = 'me-3';
            selectAllLabel.innerHTML = `<input type="checkbox" id="selectAllExts" checked onchange="onSelectAllExtsChange()"> <strong>Select All</strong>`;
            extDiv.appendChild(selectAllLabel);
            // Add extension checkboxes
            allExtensions.forEach(ext => {
                const id = 'ext_' + ext;
                const label = document.createElement('label');
                label.className = 'me-2';
                label.innerHTML = `<input type="checkbox" id="${id}" value="${ext}" checked onchange="onExtChange()"> .${ext}`;
                extDiv.appendChild(label);
            });
        }

        function onSelectAllExtsChange() {
            const checked = document.getElementById('selectAllExts').checked;
            document.querySelectorAll('#extFilters input[type=checkbox]').forEach(cb => {
                if (cb.id !== 'selectAllExts') cb.checked = checked;
            });
            onExtChange();
        }

        function onExtChange() {
            selectedExtensions = new Set(Array.from(document.querySelectorAll('#extFilters input[type=checkbox]:checked')).filter(cb => cb.id !== 'selectAllExts').map(cb => cb.value));
            // Update Select All checkbox state
            const allChecked = allExtensions.length > 0 && allExtensions.every(ext => document.getElementById('ext_' + ext).checked);
            document.getElementById('selectAllExts').checked = allChecked;
            filterByExtension();
        }

        function filterByExtension() {
            if (!selectedExtensions.size) {
                filteredFiles = [];
            } else {
                filteredFiles = allFiles.filter(f => {
                    const m = f.match(/\.([a-zA-Z0-9]{2,5})(\?.*)?$/);
                    return m && selectedExtensions.has(m[1].toLowerCase());
                });
            }
            renderFileList();
        }

        function renderFileList() {
            const ul = document.getElementById('fileList');
            ul.innerHTML = '';
            filteredFiles.forEach(file => {
                const li = document.createElement('li');
                li.innerHTML = `<label><input type="checkbox" value="${file}" class="file-checkbox"/> <span>${file}</span></label>`;
                ul.appendChild(li);
            });
        }

        function selectAllLinks(checked) {
            document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = checked);
        }

        async function downloadToServer() {
            const checkboxes = document.querySelectorAll('.file-checkbox:checked');
            if (!checkboxes.length) return;
            const urls = Array.from(checkboxes).map(cb => cb.value);
            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('serverDownloadModal'));
            document.getElementById('serverDownloadProgressList').innerHTML = '';
            document.getElementById('serverDownloadProgressBar').style.width = '0%';
            document.getElementById('serverDownloadProgressBar').innerText = '0%';
            document.getElementById('serverDownloadCloseBtn').disabled = true;
            modal.show();
            // Prepare progress UI
            const progressList = document.getElementById('serverDownloadProgressList');
            const fileNames = urls.map(url => url.split('/').pop().split(/[?#]/)[0]);
            fileNames.forEach(file => {
                const item = document.createElement('div');
                item.id = 'server-file-' + btoa(file);
                item.innerHTML = `<div class='d-flex align-items-center justify-content-between'><span>${file}</span> <span class='badge bg-secondary'>Waiting</span></div><div class='progress mb-2' style='height: 6px;'><div class='progress-bar' id='file-progress-${btoa(file)}' style='width:0%'></div></div>`;
                progressList.appendChild(item);
            });
            // Start download
            await fetch('/server-download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(urls)
            });
            // Poll for status
            let done = 0;
            serverDownloadPollInterval = setInterval(async () => {
                const resp = await fetch('/server-download-status');
                const statusMap = await resp.json();
                done = 0;
                fileNames.forEach(file => {
                    const item = document.getElementById('server-file-' + btoa(file));
                    if (item) {
                        const badge = item.querySelector('span.badge');
                        const progressBar = document.getElementById('file-progress-' + btoa(file));
                        const fileInfo = statusMap[file] || {status: 'Waiting', progress: 0};
                        const status = fileInfo.status;
                        const percent = fileInfo.progress || 0;
                        progressBar.style.width = percent + '%';
                        if (status === 'Success') {
                            badge.className = 'badge bg-success';
                            badge.innerText = 'Success';
                            done++;
                            progressBar.style.width = '100%';
                        } else if (status === 'Failed') {
                            badge.className = 'badge bg-danger';
                            badge.innerText = 'Failed';
                            done++;
                        } else if (status === 'Downloading') {
                            badge.className = 'badge bg-info';
                            badge.innerText = 'Downloading';
                        } else {
                            badge.className = 'badge bg-secondary';
                            badge.innerText = status;
                        }
                    }
                });
                const percent = Math.floor((done / fileNames.length) * 100);
                document.getElementById('serverDownloadProgressBar').style.width = percent + '%';
                document.getElementById('serverDownloadProgressBar').innerText = percent + '%';
                if (done === fileNames.length) {
                    clearInterval(serverDownloadPollInterval);
                    document.getElementById('serverDownloadCloseBtn').disabled = false;
                }
            }, 1000);
        }
    </script>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container py-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h5 class="mb-0 fw-semibold">Fetch and Download Files
                <i class="bi bi-info-circle ms-2" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="right" title="Download files from external sources or manage server downloads." onclick="showFeatureHelp('downloads')" style="cursor:pointer;"></i>
            </h5>
        </div>
        <div class="mb-3 input-group flex-nowrap">
            <input type="text" id="fetchUrl" class="form-control" placeholder="Enter URL to fetch links">
            <button class="btn btn-primary" onclick="fetchLinks()">Fetch Links</button>
        </div>
        <div class="mb-3 d-flex flex-wrap align-items-center gap-2" id="extFilters"></div>
        <div class="mb-3 d-flex justify-content-between align-items-center">
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary" onclick="selectAllLinks(true)">Select All</button>
                <button class="btn btn-outline-secondary" onclick="selectAllLinks(false)">Deselect All</button>
            </div>
            <button type="button" class="btn btn-info" onclick="downloadToServer()">Download Files</button>
        </div>
        <form>
            <ul id="fileList">
                <li th:each="file : ${files}">
                    <label>
                        <input type="checkbox" th:value="${file}" class="file-checkbox"/>
                        <span th:text="${file}"></span>
                    </label>
                </li>
            </ul>
        </form>
    </div>
    <div id="downloadProgressContainer" style="display:none"></div>
    <div style="position:fixed;top:0;left:0;width:100%;z-index:3000;display:none;background:#f8f9fa;" id="topDownloadBar">
        <div class="progress" style="height:6px;">
            <div class="progress-bar" id="topDownloadProgress" style="width:100%"></div>
        </div>
    </div>
    <!-- Server Download Modal -->
    <div class="modal fade" id="serverDownloadModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Server-side Download Progress</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="fw-bold mb-2">All files status</div>
                    <div class="progress mb-3">
                        <div class="progress-bar" id="serverDownloadProgressBar" style="width:0%">0%</div>
                    </div>
                    <div id="serverDownloadProgressList"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="serverDownloadCloseBtn" data-bs-dismiss="modal" disabled>Close</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Feature Help Modal -->
    <div class="modal fade" id="featureHelpModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="featureHelpModalTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="featureHelpModalBody"></div>
        </div>
      </div>
    </div>
    <div th:replace="fragments/footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Feature instructions
    const featureInstructions = {
      downloads: {
        title: "Downloads",
        body: `Paste a URL to fetch downloadable links.\n\nFilter by file type, select files, and download them to your device or the server.\n\nYou can also monitor server-side download progress in real time.`
      }
    };
    function showFeatureHelp(featureKey) {
      const instr = featureInstructions[featureKey];
      if (!instr) return;
      document.getElementById('featureHelpModalTitle').innerText = instr.title;
      document.getElementById('featureHelpModalBody').innerText = instr.body;
      const modal = new bootstrap.Modal(document.getElementById('featureHelpModal'));
      modal.show();
    }
    // Initialize Bootstrap tooltips
    document.addEventListener('DOMContentLoaded', function () {
      var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.forEach(function (tooltipTriggerEl) {
        new bootstrap.Tooltip(tooltipTriggerEl);
      });
    });
    </script>
</body>
</html>
