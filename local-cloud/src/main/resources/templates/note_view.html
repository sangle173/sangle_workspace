<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${note.title}">View Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/note.css}">
    <style>
        /* Note view specific styles */
        .note-content {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            max-width: 100%;
            overflow-wrap: break-word;
            padding: 1rem;
        }

        /* Preserve image and video styles from editor */
        .note-content figure {
            margin: 1em 0;
            text-align: center;
        }

        .note-content figure img,
        .note-content figure video {
            max-width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .note-content figure.media {
            clear: both;
            margin: 1em 0;
            text-align: center;
            background: #f8f9fa;
            padding: 1em;
            border-radius: 4px;
        }

        /* Image alignment styles */
        .note-content .image-style-align-left {
            float: left;
            margin-right: 1.5em;
            max-width: 50%;
        }

        .note-content .image-style-align-right {
            float: right;
            margin-left: 1.5em;
            max-width: 50%;
        }

        .note-content .image-style-align-center {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* Link styles */
        .note-content a {
            color: #0d6efd;
            text-decoration: none;
        }

        .note-content a:hover {
            text-decoration: underline;
        }

        /* Attachment link styles */
        .note-content a[href*="attachments"] {
            display: inline-flex;
            align-items: center;
            background: #f8f9fa;
            padding: 0.5em 1em;
            border-radius: 4px;
            margin: 0.25em 0;
            border: 1px solid #dee2e6;
        }

        .note-content a[href*="attachments"]:hover {
            background: #e9ecef;
            text-decoration: none;
        }

        .note-content a[href*="attachments"] i {
            margin-right: 0.5em;
        }

        /* Video responsive container */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            max-width: 100%;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Content styling */
        .note-content h1, 
        .note-content h2, 
        .note-content h3, 
        .note-content h4, 
        .note-content h5, 
        .note-content h6 {
            margin-top: 1.5em;
            margin-bottom: 0.75em;
            font-weight: 600;
            line-height: 1.2;
        }

        .note-content p {
            margin-bottom: 1em;
        }

        .note-content ul,
        .note-content ol {
            margin-bottom: 1em;
            padding-left: 2em;
        }

        .note-content blockquote {
            border-left: 4px solid #dee2e6;
            padding-left: 1em;
            margin-left: 0;
            color: #6c757d;
        }

        .note-content pre,
        .note-content code {
            background-color: #f8f9fa;
            border-radius: 4px;
            padding: 0.2em 0.4em;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        .note-content pre {
            padding: 1em;
            overflow-x: auto;
        }

        .note-content pre code {
            padding: 0;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="${note.title}">Note Title</h2>
            <div>
                <a th:href="@{/spaces/{space}/categories/{category}/notes(space=${note.space}, category=${note.category})}"
                   class="btn btn-secondary me-2">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
                <a th:href="@{/spaces/{space}/categories/{category}/notes/{id}/edit(space=${note.space}, category=${note.category}, id=${note.id})}"
                   class="btn btn-primary">
                    <i class="bi bi-pencil"></i> Edit
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <!-- Note metadata -->
                <div class="text-muted small mb-3">
                    <span th:if="${note.updatedAt != null}">
                        Last updated: <span th:text="${#temporals.format(note.updatedAt, 'MMM dd, yyyy HH:mm')}">Jan 1, 2025</span>
                    </span>
                </div>

                <!-- Note content -->
                <div class="note-content" th:utext="${note.contentHtml}">
                    Note content goes here...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Handle video elements to ensure proper sizing and responsiveness
        document.addEventListener('DOMContentLoaded', function() {
            const videos = document.querySelectorAll('.note-content video');
            videos.forEach(video => {
                // If video is not in a responsive container, wrap it
                if (!video.closest('.video-container')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'video-container';
                    video.parentNode.insertBefore(wrapper, video);
                    wrapper.appendChild(video);
                }

                // Add controls if not present
                if (!video.hasAttribute('controls')) {
                    video.setAttribute('controls', '');
                }

                // Ensure proper playback
                video.addEventListener('error', function(e) {
                    console.error('Video error:', e);
                    const source = this.querySelector('source');
                    if (source) {
                        console.log('Video source:', source.src, 'Type:', source.type);
                    }
                });
            });

            // Handle images to ensure proper loading and error handling
            const images = document.querySelectorAll('.note-content img');
            images.forEach(img => {
                img.addEventListener('error', function() {
                    this.style.display = 'none';
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'text-danger small';
                    errorMsg.textContent = '⚠️ Image failed to load';
                    this.parentNode.insertBefore(errorMsg, this);
                });
            });
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
