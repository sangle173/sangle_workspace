<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${note.title}">Note View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Left sidebar styles */
        .sidebar {
            height: calc(100vh - 56px);
            overflow-y: auto;
            padding-top: 15px;
            border-right: 1px solid #dee2e6;
        }
        .sidebar-nav {
            padding-left: 0;
            list-style: none;
        }
        .sidebar-nav-item {
            padding: 8px 15px;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .sidebar-nav-item:hover {
            background-color: #f8f9fa;
        }
        .sidebar-nav-item.active {
            background-color: #e9ecef;
        }
        .sidebar-heading {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            color: #6c757d;
            padding: 10px 15px;
            margin-bottom: 0;
        }
        
        /* Attachments panel styles */
        .attachments-panel {
            height: calc(100vh - 56px);
            overflow-y: auto;
            padding-top: 15px;
            border-left: 1px solid #dee2e6;
        }
        .attachment-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .attachment-item:last-child {
            border-bottom: none;
        }
        .attachment-icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }
        .attachment-name {
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        
        /* File Explorer Styles */
        .file-explorer {
            border: 1px solid #eee;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .file-header {
            background-color: #f8f9fa;
            padding: 8px 12px;
            font-weight: 500;
            border-bottom: 1px solid #eee;
            font-size: 0.85rem;
        }
        
        .file-list {
            max-height: calc(100vh - 250px);
            overflow-y: auto;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }
        
        .file-item:hover {
            background-color: #f8f9fa;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        .file-item-icon {
            width: 24px;
            text-align: center;
            margin-right: 8px;
            color: #6c757d;
        }
        
        .file-item-name {
            flex-grow: 1;
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        /* Main content styles */
        .note-content {
            padding: 20px;
        }
        .note-header {
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        /* CKEditor image styles */
        .image {
            margin: 1em 0;
            max-width: 100%;
        }
        .image img {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            min-width: 50px;
        }
        
        /* Default size for images */
        .image:not(.image-style-side):not(.image-style-align-left):not(.image-style-align-right) img {
            max-width: 50%;
        }
        
        /* Image alignment styles */
        .image.image-style-align-center {
            margin-left: auto;
            margin-right: auto;
        }
        
        .image.image-style-align-left {
            float: left;
            margin-right: 1.5em;
            max-width: 50%;
        }
        
        .image.image-style-align-right {
            float: right;
            margin-left: 1.5em;
            max-width: 50%;
        }
        
        /* Side image style */
        .image.image-style-side {
            float: right;
            margin-left: 1.5em;
            max-width: 33%;
        }
        
        /* Block image style - centered by default */
        .image.image-style-block {
            display: block;
            margin: 1em auto;
        }
        
        /* Inline image style */
        .image.image-style-inline {
            display: inline-block;
            max-width: 25%;
            vertical-align: middle;
        }
        
        /* Responsive adjustments */
        @media (max-width: 992px) {
            .sidebar, .attachments-panel {
                height: auto;
                max-height: 300px;
                border: 1px solid #dee2e6;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Left sidebar -->
        <div class="col-md-2 sidebar d-none d-md-block">
            <h6 class="sidebar-heading">Navigation</h6>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="#" th:href="@{'/spaces/' + ${note.space} + '/categories/' + ${note.category} + '/notes'}" class="text-decoration-none text-dark">
                        <i class="bi bi-arrow-left"></i> Back to Notes
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="#" th:href="@{'/spaces/' + ${note.space} + '/categories'}" class="text-decoration-none text-dark">
                        <i class="bi bi-folder"></i> Categories
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="#" th:href="@{'/spaces'}" class="text-decoration-none text-dark">
                        <i class="bi bi-hdd-stack"></i> Spaces
                    </a>
                </li>
            </ul>
            
            <h6 class="sidebar-heading mt-4">Actions</h6>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="#" th:href="@{'/spaces/' + ${note.space} + '/categories/' + ${note.category} + '/notes/' + ${note.id} + '/edit'}" class="text-decoration-none text-dark">
                        <i class="bi bi-pencil"></i> Edit Note
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="#" onclick="if(confirm('Are you sure you want to delete this note?')) { document.getElementById('deleteForm').submit(); } return false;" class="text-decoration-none text-danger">
                        <i class="bi bi-trash"></i> Delete Note
                    </a>
                </li>
            </ul>
            
            <form id="deleteForm" th:action="@{'/spaces/' + ${note.space} + '/categories/' + ${note.category} + '/notes/' + ${note.id} + '/delete'}" method="post" style="display: none;"></form>
        </div>
        
        <!-- Main content -->
        <div class="col-md-8 note-content">
            <div class="note-header">
                <h1 th:text="${note.title}">Note Title</h1>
                
                <!-- Mobile actions toolbar (visible on small screens) -->
                <div class="d-flex d-md-none gap-2 mb-3">
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{'/spaces/' + ${note.space} + '/categories/' + ${note.category} + '/notes'}">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                    <a class="btn btn-outline-primary btn-sm" th:href="@{'/spaces/' + ${note.space} + '/categories/' + ${note.category} + '/notes/' + ${note.id} + '/edit'}">
                        <i class="bi bi-pencil"></i> Edit
                    </a>
                    <a class="btn btn-outline-danger btn-sm" href="#" onclick="if(confirm('Are you sure you want to delete this note?')) { document.getElementById('deleteForm').submit(); } return false;">
                        <i class="bi bi-trash"></i> Delete
                    </a>
                </div>
                
                <div class="text-muted small">
                    <span th:text="${'Space: ' + note.space}">Space: default</span> • 
                    <span th:text="${'Category: ' + note.category}">Category: uncategorized</span>
                </div>
            </div>
            
            <div class="note-body" th:utext="${note.contentHtml}">
                Note content will be displayed here.
            </div>
        </div>
        
        <!-- Right attachments panel -->
        <div class="col-md-2 attachments-panel d-none d-md-block">
            <h6 class="sidebar-heading">Attachments</h6>
            <div id="attachmentsList">
                <!-- Attachments will be loaded here dynamically -->
                <div class="text-center text-muted py-4" id="noAttachmentsMessage">
                    <i class="bi bi-paperclip fs-4"></i>
                    <p>No attachments</p>
                </div>
                <div class="file-explorer" id="fileExplorer" style="display: none;">
                    <div class="file-header">
                        <i class="bi bi-folder"></i> Files
                    </div>
                    <div class="file-list" id="fileList">
                        <!-- Files will be loaded here dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap and custom scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Load attachments if note exists
        const noteId = window.location.pathname.split('/').pop();
        if (noteId) {
            loadAttachments();
        }
        
        function loadAttachments() {
            const pathParts = window.location.pathname.split('/');
            const noteId = pathParts.pop();
            const category = pathParts[pathParts.length - 2];
            const space = pathParts[pathParts.length - 4];
            
            fetch(`/spaces/${space}/categories/${category}/notes/${noteId}/attachments`)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.attachments && data.attachments.length > 0) {
                        renderAttachmentsAsFileManager(data.attachments);
                        document.getElementById('noAttachmentsMessage').style.display = 'none';
                        document.getElementById('fileExplorer').style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error loading attachments:', error);
                });
        }
        
        function renderAttachmentsAsFileManager(attachments) {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            
            // Group attachments by type
            const imageFiles = attachments.filter(att => att.isImage === 'true');
            const otherFiles = attachments.filter(att => att.isImage !== 'true');
            
            // Add images section if there are images
            if (imageFiles.length > 0) {
                // Create an images folder header
                const imageFolder = document.createElement('div');
                imageFolder.className = 'file-item';
                imageFolder.style.backgroundColor = '#f8f9fa';
                imageFolder.innerHTML = `
                    <div class="file-item-icon">
                        <i class="bi bi-images"></i>
                    </div>
                    <div class="file-item-name">
                        <strong>Images (${imageFiles.length})</strong>
                    </div>
                `;
                fileList.appendChild(imageFolder);
                
                // Add each image
                imageFiles.forEach(attachment => {
                    addFileItem(attachment, fileList);
                });
            }
            
            // Add other files section if there are other files
            if (otherFiles.length > 0) {
                // Create other files folder header
                const otherFolder = document.createElement('div');
                otherFolder.className = 'file-item';
                otherFolder.style.backgroundColor = '#f8f9fa';
                otherFolder.innerHTML = `
                    <div class="file-item-icon">
                        <i class="bi bi-files"></i>
                    </div>
                    <div class="file-item-name">
                        <strong>Other Files (${otherFiles.length})</strong>
                    </div>
                `;
                fileList.appendChild(otherFolder);
                
                // Add each file
                otherFiles.forEach(attachment => {
                    addFileItem(attachment, fileList);
                });
            }
        }
        
        function addFileItem(attachment, container) {
            // Determine icon based on file type
            let iconClass = 'bi-file-earmark';
            if (attachment.isImage === 'true') {
                iconClass = 'bi-file-earmark-image';
            } else if (attachment.type && attachment.type.startsWith('video/')) {
                iconClass = 'bi-file-earmark-play';
            } else if (attachment.type && attachment.type.includes('pdf')) {
                iconClass = 'bi-file-earmark-pdf';
            } else if (attachment.type && attachment.type.includes('word')) {
                iconClass = 'bi-file-earmark-word';
            } else if (attachment.type && attachment.type.includes('excel')) {
                iconClass = 'bi-file-earmark-excel';
            }
            
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
                <div class="file-item-icon">
                    <i class="bi ${iconClass}"></i>
                </div>
                <div class="file-item-name" title="${attachment.name}">
                    <a href="${attachment.url}" target="_blank" class="text-decoration-none text-dark">
                        ${attachment.name}
                    </a>
                </div>
            `;
            
            container.appendChild(fileItem);
        }
        
        function renderAttachments(attachments) {
            // This is the old function, keeping for reference
            const attachmentsList = document.getElementById('attachmentsList');
            
            attachments.forEach(attachment => {
                const attachmentEl = document.createElement('div');
                attachmentEl.className = 'attachment-item';
                
                // Determine icon based on file type
                let iconClass = 'bi-file-earmark';
                if (attachment.isImage === 'true') {
                    iconClass = 'bi-file-earmark-image';
                } else if (attachment.type.startsWith('video/')) {
                    iconClass = 'bi-file-earmark-play';
                }
                
                attachmentEl.innerHTML = `
                    <div class="attachment-icon"><i class="bi ${iconClass}"></i></div>
                    <div class="attachment-name" title="${attachment.name}">
                        <a href="${attachment.url}" target="_blank" class="text-decoration-none text-dark">
                            ${attachment.name}
                        </a>
                    </div>
                `;
                
                attachmentsList.appendChild(attachmentEl);
            });
        }
    });
</script>
</body>
</html>
