<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Server Folder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .copy-btn { cursor: pointer; }
        .folder-icon { color: #f7b731; }
        .file-icon { color: #6c757d; }
        .list-group-item { display: flex; align-items: center; justify-content: space-between; }
        .file-info { display: flex; align-items: center; gap: 1rem; min-width: 0; flex: 1; }
        .file-name { font-weight: 500; word-break: break-all; }
        .file-size { color: #888; font-size: 0.95em; margin-left: 1rem; }
        @media (max-width: 600px) {
            .list-group-item { flex-direction: column; align-items: flex-start; }
            .file-info { gap: 0.5rem; }
            .file-size, .file-name { margin-left: 0; }
        }
    </style>
</head>
<body class="bg-light">
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container py-4">
        <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <h5 class="mb-0 fw-semibold">LocalServerFolder
                    <i class="bi bi-info-circle ms-2" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="right" title="Browse, upload, and manage files on the server." onclick="showFeatureHelp('localServerFolder')" style="cursor:pointer;"></i>
                    <span th:if="${relPath != ''}" th:text="'/' + ${relPath}" class="ms-2"></span>
                </h5>
                <a th:if="${parent != null}" th:href="@{'/server-files'(path=${parent})}" class="btn btn-outline-secondary btn-sm ms-3">⬅️ Up to Parent</a>
            </div>
            <button class="btn btn-outline-secondary btn-sm" style="min-width:150px;" onclick="openLocalServerFolder()">
                <i class="bi bi-folder2-open"></i> Open LocalServerFolder
            </button>
        </div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="table-responsive">
        <ul class="list-group shadow-sm">
            <li class="list-group-item d-flex" style="font-weight:600;">
                <div class="file-info" style="flex:2;">Name</div>
                <div style="width:140px;" class="d-none d-md-block">Size</div>
                <div style="width:180px;" class="d-none d-md-block">Created</div>
                <div style="width:180px;" class="d-none d-md-block">Actions</div>
            </li>
            <li class="list-group-item" th:each="file : ${files}">
                <div class="file-info" style="flex:2;">
                    <i th:if="${file.isDir}" class="bi bi-folder-fill folder-icon fs-4"></i>
                    <i th:if="${!file.isDir and #strings.endsWith(file.name.toLowerCase(), '.apk')}" class="bi bi-android2 file-icon fs-4"></i>
                    <i th:if="${!file.isDir and #strings.endsWith(file.name.toLowerCase(), '.ipa')}" class="bi bi-apple file-icon fs-4"></i>
                    <i th:if="${!file.isDir and #strings.endsWith(file.name.toLowerCase(), '.pdf')}" class="bi bi-file-earmark-pdf file-icon fs-4" style="color:#e74c3c"></i>
                    <i th:if="${!file.isDir and (#strings.endsWith(file.name.toLowerCase(), '.doc') or #strings.endsWith(file.name.toLowerCase(), '.docx'))}" class="bi bi-file-earmark-word file-icon fs-4" style="color:#0072c6"></i>
                    <i th:if="${!file.isDir and (#strings.endsWith(file.name.toLowerCase(), '.xls') or #strings.endsWith(file.name.toLowerCase(), '.xlsx'))}" class="bi bi-file-earmark-excel file-icon fs-4" style="color:#21a366"></i>
                    <i th:if="${!file.isDir and (#strings.endsWith(file.name.toLowerCase(), '.ppt') or #strings.endsWith(file.name.toLowerCase(), '.pptx'))}" class="bi bi-file-earmark-ppt file-icon fs-4" style="color:#d24726"></i>
                    <i th:if="${!file.isDir and #strings.endsWith(file.name.toLowerCase(), '.txt')}" class="bi bi-file-earmark-text file-icon fs-4"></i>
                    <i th:if="${!file.isDir and (#strings.endsWith(file.name.toLowerCase(), '.zip') or #strings.endsWith(file.name.toLowerCase(), '.rar'))}" class="bi bi-file-earmark-zip file-icon fs-4"></i>
                    <i th:if="${!file.isDir and (#strings.endsWith(file.name.toLowerCase(), '.jpg') or #strings.endsWith(file.name.toLowerCase(), '.jpeg') or #strings.endsWith(file.name.toLowerCase(), '.png') or #strings.endsWith(file.name.toLowerCase(), '.gif'))}" class="bi bi-file-earmark-image file-icon fs-4"></i>
                    <i th:if="${!file.isDir and (#strings.endsWith(file.name.toLowerCase(), '.mp4') or #strings.endsWith(file.name.toLowerCase(), '.avi'))}" class="bi bi-file-earmark-play file-icon fs-4"></i>
                    <i th:if="${!file.isDir and (#strings.endsWith(file.name.toLowerCase(), '.mp3') or #strings.endsWith(file.name.toLowerCase(), '.wav'))}" class="bi bi-file-earmark-music file-icon fs-4"></i>
                    <i th:if="${!file.isDir and !(#strings.endsWith(file.name.toLowerCase(), '.apk') or #strings.endsWith(file.name.toLowerCase(), '.ipa') or #strings.endsWith(file.name.toLowerCase(), '.pdf') or #strings.endsWith(file.name.toLowerCase(), '.doc') or #strings.endsWith(file.name.toLowerCase(), '.docx') or #strings.endsWith(file.name.toLowerCase(), '.xls') or #strings.endsWith(file.name.toLowerCase(), '.xlsx') or #strings.endsWith(file.name.toLowerCase(), '.ppt') or #strings.endsWith(file.name.toLowerCase(), '.pptx') or #strings.endsWith(file.name.toLowerCase(), '.txt') or #strings.endsWith(file.name.toLowerCase(), '.zip') or #strings.endsWith(file.name.toLowerCase(), '.rar') or #strings.endsWith(file.name.toLowerCase(), '.jpg') or #strings.endsWith(file.name.toLowerCase(), '.jpeg') or #strings.endsWith(file.name.toLowerCase(), '.png') or #strings.endsWith(file.name.toLowerCase(), '.gif') or #strings.endsWith(file.name.toLowerCase(), '.mp4') or #strings.endsWith(file.name.toLowerCase(), '.avi') or #strings.endsWith(file.name.toLowerCase(), '.mp3') or #strings.endsWith(file.name.toLowerCase(), '.wav'))}" class="bi bi-file-earmark-fill file-icon fs-4"></i>
                    <a th:if="${file.isDir}" th:href="${file.browse}" th:text="${file.name}" class="file-name text-decoration-none"></a>
                    <span th:if="${!file.isDir}" th:text="${file.name}" class="file-name d-none d-md-inline"></span>
                    <a th:if="${!file.isDir}" href="#" class="file-name d-md-none text-decoration-none"
                       th:attr="data-filename=${file.name},data-size=${file.sizeDisplay},data-created=${file.created},data-link=${file.link},data-path=${relPath + (relPath != '' ? '/' : '') + file.name},data-isdir=${file.isDir}"
                       onclick="showFileActionModal(this)">
                       <span th:text="${file.name}"></span>
                    </a>
                </div>
                <div style="width:140px;" class="d-none d-md-block">
                    <span th:if="${!file.isDir}" th:text="${file.sizeDisplay}" class="file-size"></span>
                </div>
                <div style="width:180px;" class="d-none d-md-block">
                    <span th:text="${file.created}"></span>
                </div>
                <div style="width:180px;" class="d-none d-md-block">
                    <a th:if="${!file.isDir}" th:href="${file.link}" class="btn btn-sm btn-outline-primary me-2" download title="Download">
                        <i class="bi bi-download"></i>
                    </a>
                    <button th:if="${!file.isDir}" class="btn btn-sm btn-outline-secondary copy-btn me-2" th:attr="data-link=${file.link}" onclick="copyLink(this)" title="Copy Link">
                        <i class="bi bi-clipboard"></i>
                    </button>
                    <button th:if="${!file.isDir and file.name.toLowerCase().endsWith('.ipa')}" class="btn btn-sm btn-outline-success" th:attr="data-path=${relPath + (relPath != '' ? '/' : '') + file.name}" onclick="showInstallModal(this)" title="Install IPA">
                        <i class="bi bi-phone"></i>
                    </button>
                    <button th:if="${!file.isDir and file.name.toLowerCase().endsWith('.apk')}" class="btn btn-sm btn-outline-success" th:attr="data-path=${relPath + (relPath != '' ? '/' : '') + file.name}" onclick="showAndroidInstallModal(this)" title="Install APK">
                        <i class="bi bi-android2"></i>
                    </button>
                </div>
            </li>
            <li th:if="${files.size() == 0}" class="list-group-item text-center text-muted">No files or folders</li>
        </ul>
        </div>
    </div>

    <!-- IPA Install Modal -->
    <div class="modal fade" id="installModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Install IPA to iPhone</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="deviceInfo" class="mb-2"></div>
                    <div id="installLog" style="white-space:pre-line; font-family:monospace; background:#f8f9fa; padding:0.5em; border-radius:4px; min-height:60px;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success" id="installBtn" onclick="installIPA()" disabled>Install</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Android APK Install Modal -->
    <div class="modal fade" id="androidInstallModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Install APK to Android Device</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="androidDeviceInfo" class="mb-2"></div>
                    <div id="androidInstallLog" style="white-space:pre-line; font-family:monospace; background:#f8f9fa; padding:0.5em; border-radius:4px; min-height:60px;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success" id="androidInstallBtn" onclick="installAPK()" disabled>Install</button>
                </div>
            </div>
        </div>
    </div>

    <!-- File Action Modal (Mobile) -->
    <div class="modal fade" id="fileActionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="fileActionModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="fileActionModalDetails" class="mb-2"></div>
                    <div id="fileActionModalButtons" class="d-flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Feature Help Modal -->
    <div class="modal fade" id="featureHelpModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="featureHelpModalTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="featureHelpModalBody"></div>
        </div>
      </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function copyLink(btn) {
        const link = btn.getAttribute('data-link');
        navigator.clipboard.writeText(window.location.origin + link).then(() => {
            btn.innerText = 'Copied!';
            btn.classList.remove('btn-outline-secondary');
            btn.classList.add('btn-success');
            setTimeout(() => {
                btn.innerText = 'Copy Link';
                btn.classList.remove('btn-success');
                btn.classList.add('btn-outline-secondary');
            }, 1200);
        });
    }

    function openLocalServerFolder() {
        fetch('/server-files/open-localserverfolder', { method: 'POST' })
            .then(res => {
                if (!res.ok) {
                    alert('Failed to open the folder. (Are you running on Ubuntu/Linux with a desktop?)');
                }
            });
    }

    let currentIPAPath = null;
    function showInstallModal(btn) {
        currentIPAPath = btn.getAttribute('data-path');
        document.getElementById('installLog').innerText = '';
        document.getElementById('installBtn').disabled = true;
        document.getElementById('deviceInfo').innerText = 'Checking for connected iOS devices...';
        const modal = new bootstrap.Modal(document.getElementById('installModal'));
        modal.show();
        fetch('/server-files/ios-devices')
            .then(res => res.json())
            .then(devices => {
                if (devices.length > 0) {
                    const d = devices[0];
                    let html = "<span class='text-success'>Device found:</span><br><table class='table table-sm table-bordered mt-2'>";
                    for (const k of ['DeviceClass','DeviceName','ProductType','ProductVersion','ModelName','SerialNumber','UniqueDeviceID']) {
                        if (d[k]) html += `<tr><th>${k}</th><td>${d[k]}</td></tr>`;
                    }
                    html += "</table>";
                    document.getElementById('deviceInfo').innerHTML = html;
                    document.getElementById('installBtn').disabled = false;
                } else {
                    document.getElementById('deviceInfo').innerHTML = `<span class='text-danger'>No iOS device found. Please connect your device and trust this computer.</span>`;
                    document.getElementById('installBtn').disabled = true;
                }
            })
            .catch(() => {
                document.getElementById('deviceInfo').innerHTML = `<span class='text-danger'>Failed to check for devices.</span>`;
                document.getElementById('installBtn').disabled = true;
            });
    }

    function installIPA() {
        if (!currentIPAPath) return;
        document.getElementById('installLog').innerText = 'Installing...';
        document.getElementById('installBtn').disabled = true;
        fetch('/server-files/install-ipa', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: currentIPAPath })
        })
        .then(res => res.text())
        .then(log => {
            document.getElementById('installLog').innerText = log;
        })
        .catch(() => {
            document.getElementById('installLog').innerText = 'Failed to install IPA.';
        });
    }

    let currentAPKPath = null;
    let selectedAndroidDeviceId = null;
    function showAndroidInstallModal(btn) {
        currentAPKPath = btn.getAttribute('data-path');
        selectedAndroidDeviceId = null;
        document.getElementById('androidInstallLog').innerText = '';
        document.getElementById('androidInstallBtn').disabled = true;
        document.getElementById('androidDeviceInfo').innerText = 'Checking for connected Android devices...';
        const modal = new bootstrap.Modal(document.getElementById('androidInstallModal'));
        modal.show();
        fetch('/server-files/android-devices')
            .then(res => res.json())
            .then(devices => {
                if (devices.length > 0) {
                    let html = "<span class='text-success'>Device(s) found:</span><br>";
                    if (devices.length > 1) {
                        html += '<select id="androidDeviceSelect" class="form-select form-select-sm mb-2" onchange="onAndroidDeviceSelect()">';
                        devices.forEach((d, i) => {
                            html += `<option value="${d.DeviceId}">${d.Model || ''} (${d.Brand || ''}) [${d.DeviceId}]</option>`;
                        });
                        html += '</select>';
                    }
                    const d = devices[0];
                    html += "<table class='table table-sm table-bordered mt-2'>";
                    for (const k of ['Model','Brand','Manufacturer','AndroidVersion','DeviceId']) {
                        if (d[k]) html += `<tr><th>${k}</th><td>${d[k]}</td></tr>`;
                    }
                    html += "</table>";
                    document.getElementById('androidDeviceInfo').innerHTML = html;
                    selectedAndroidDeviceId = devices[0].DeviceId;
                    document.getElementById('androidInstallBtn').disabled = false;
                } else {
                    document.getElementById('androidDeviceInfo').innerHTML = `<span class='text-danger'>No Android device found. Please connect your device and enable USB debugging.</span>`;
                    document.getElementById('androidInstallBtn').disabled = true;
                }
            })
            .catch(() => {
                document.getElementById('androidDeviceInfo').innerHTML = `<span class='text-danger'>Failed to check for devices.</span>`;
                document.getElementById('androidInstallBtn').disabled = true;
            });
    }
    function onAndroidDeviceSelect() {
        const select = document.getElementById('androidDeviceSelect');
        selectedAndroidDeviceId = select.value;
    }
    function installAPK() {
        if (!currentAPKPath || !selectedAndroidDeviceId) return;
        document.getElementById('androidInstallLog').innerText = 'Installing...';
        document.getElementById('androidInstallBtn').disabled = true;
        fetch('/server-files/install-apk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: currentAPKPath, deviceId: selectedAndroidDeviceId })
        })
        .then(res => res.text())
        .then(log => {
            document.getElementById('androidInstallLog').innerText = log;
        })
        .catch(() => {
            document.getElementById('androidInstallLog').innerText = 'Failed to install APK.';
        });
    }

    function showFileActionModal(el) {
        const isDir = el.getAttribute('data-isdir');
        if (isDir === 'true' || isDir === true) return; // Only for files
        const name = el.getAttribute('data-filename');
        const size = el.getAttribute('data-size');
        const created = el.getAttribute('data-created');
        const link = el.getAttribute('data-link');
        const relPath = el.getAttribute('data-path').replace(name, '');
        document.getElementById('fileActionModalTitle').innerText = name;
        let html = '';
        if (size) html += `<div><b>Size:</b> ${size}</div>`;
        if (created) html += `<div><b>Created:</b> ${created}</div>`;
        document.getElementById('fileActionModalDetails').innerHTML = html;
        // Action buttons
        let btns = '';
        if (link) {
            btns += `<a href="${link}" class="btn btn-outline-primary btn-sm" download><i class="bi bi-download"></i> Download</a>`;
            btns += `<button class="btn btn-outline-secondary btn-sm" onclick="navigator.clipboard.writeText(window.location.origin + '${link}');this.innerText='Copied!';setTimeout(()=>{this.innerHTML='<i class=\'bi bi-clipboard\'></i> Copy Link';},1200)"><i class="bi bi-clipboard"></i> Copy Link</button>`;
        }
        if (name.toLowerCase().endsWith('.ipa')) {
            btns += `<button class="btn btn-outline-success btn-sm" onclick="showInstallModal({getAttribute:()=>('${relPath}${name}')});var m=bootstrap.Modal.getInstance(document.getElementById('fileActionModal'));if(m)m.hide();"><i class="bi bi-phone"></i> Install IPA</button>`;
        }
        if (name.toLowerCase().endsWith('.apk')) {
            btns += `<button class="btn btn-outline-success btn-sm" onclick="showAndroidInstallModal({getAttribute:()=>('${relPath}${name}')});var m=bootstrap.Modal.getInstance(document.getElementById('fileActionModal'));if(m)m.hide();"><i class="bi bi-android2"></i> Install APK</button>`;
        }
        document.getElementById('fileActionModalButtons').innerHTML = btns;
        const modal = new bootstrap.Modal(document.getElementById('fileActionModal'));
        modal.show();
    }

    // Feature instructions
    const featureInstructions = {
      localServerFolder: {
        title: "Local Server Folder",
        body: `Browse, upload, and manage files stored on the server.\n\n- Navigate folders and view file details.\n- Upload new files using the upload button.\n- Download, copy link, or install IPA/APK files directly.\n- Use the 'Open LocalServerFolder' button to open the folder on the server (if supported).\n- Use the parent button to go up a directory.\n\nYou can also install iOS (.ipa) or Android (.apk) files to connected devices if supported.`
      }
    };
    function showFeatureHelp(featureKey) {
      const instr = featureInstructions[featureKey];
      if (!instr) return;
      document.getElementById('featureHelpModalTitle').innerText = instr.title;
      document.getElementById('featureHelpModalBody').innerText = instr.body;
      const modal = new bootstrap.Modal(document.getElementById('featureHelpModal'));
      modal.show();
    }
    // Initialize Bootstrap tooltips
    document.addEventListener('DOMContentLoaded', function () {
      var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.forEach(function (tooltipTriggerEl) {
        new bootstrap.Tooltip(tooltipTriggerEl);
      });
    });
    </script>
</body>
</html>
