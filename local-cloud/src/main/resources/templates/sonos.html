<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Sonos Devices</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        /* Zebra stripe rows */
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f8f9fc;
        }

        .table-striped tbody tr:nth-of-type(even) {
            background-color: #ffffff;
        }

        /* Custom checkbox size and style */
        .form-check-sm {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .custom-checkbox {
            accent-color: #0d6efd;
            border-radius: 3px;
        }

        /* Header block (HHID) */
        .hhid-header,
        .bg-primary-subtle {
            background-color: #e9f2ff !important;
            border-bottom: 1px solid #b6d8fb;
        }

        .hhid-header .form-check-input,
        .bg-primary-subtle .form-check-input {
            margin-top: 0;
        }

        .text-dark-emphasis {
            color: #0d3c61;
        }

        .text-light-emphasis {
            color: #6c757d;
        }

        /* Image cell in device row */
        td img {
            background: #f8f9fa;
            padding: 4px;
            border-radius: 6px;
            display: block;
        }

        /* Small gray text inside cell */
        td .text-muted.small {
            font-size: 0.8rem;
            color: #6c757d;
        }

        /* Latency dot styles */
        .latency-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .latency-success {
            background-color: #28a745;
        }

        .latency-warning {
            background-color: #ffc107;
        }

        .latency-danger {
            background-color: #dc3545;
        }
    </style>

</head>

<body>

    <!-- Shared navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container my-4">
        <h2 class="mb-3">Sonos Device Discovery</h2>

        <!-- Scan controls -->
        <div class="scan-container mb-3">
            <button id="scanBtn" class="btn btn-primary" onclick="scanSonos()">
                🔍 Scan Devices
                <span id="loadingSpinner" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"
                    style="display: none;"></span>
            </button>
            <span id="statusMsg" class="text-muted small d-block d-sm-inline"></span>
        </div>

        <!-- Filter and search controls -->
        <div class="sticky-top bg-white py-2 d-flex align-items-center gap-3 flex-wrap border-bottom shadow-sm"
            style="z-index: 1020;">
            <label for="hhidFilter" class="fw-semibold mb-0">Filter:</label>
            <select id="hhidFilter" class="form-select w-auto" onchange="renderGroupedResults(currentGroups)">
                <option value="ALL">All HHIDs</option>
            </select>
            <input id="searchInput" type="text" class="form-control w-auto" placeholder="Search Model, MAC, UPD..."
                oninput="renderGroupedResults(currentGroups)" style="min-width: 220px;">
            <input id="nameSearchInput" type="text" class="form-control w-auto" placeholder="Search by Name..."
                oninput="renderGroupedResults(currentGroups)" style="min-width: 180px;">

            <div class="dropdown ms-auto">
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button"
                    data-bs-toggle="dropdown">
                    ⚙️ Bulk Action
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" onclick="performBulkAction('reboot')">🔁 Reboot</a></li>
                    <li><a class="dropdown-item" href="#" onclick="performBulkAction('submit-diagnostics')">🧪
                            Diagnostics</a></li>
                    <li><a class="dropdown-item" href="#" onclick="performBulkAction('update')">🔄 Update</a></li>
                    <li><a class="dropdown-item" href="#" onclick="performBulkAction('rename')">✏️ Rename</a></li>
                </ul>

            </div>
        </div>


        <div class="table-responsive" style="overflow-x: auto;">
            <div id="resultsTable">
                <!-- AJAX loaded table will go here -->
            </div>
        </div>
    </div>
    <!-- ✅ Common Modal -->
    <div class="modal fade" id="commonModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="commonModalTitle">Processing...</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="commonModalBody">
                    Please wait...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for bulk update base URL -->
    <div class="modal fade" id="bulkUpdateModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Bulk Update</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="bulkUpdateUrlInput" class="form-label">Enter the base URL for the update files:</label>
                    <input type="text" class="form-control" id="bulkUpdateUrlInput" placeholder="http://host/path/to/RELEASEALL/">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="confirmBulkUpdate()">Update Devices</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Set String modal HTML -->
    <div class="modal fade" id="setStringModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Set System String</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2"><b>HHID:</b> <span id="setStringHhid"></span></div>
                    <label for="setStringValueInput" class="form-label">New String Value:</label>
                    <input type="text" class="form-control" id="setStringValueInput" placeholder="Enter new value">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="confirmSetString()">Set String</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add a large modal for group info -->
    <div class="modal fade" id="groupInfoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Household Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs mb-3" id="groupInfoTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="table-tab" data-bs-toggle="tab" data-bs-target="#tableTabPane" type="button" role="tab" aria-controls="tableTabPane" aria-selected="true">Table</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="list-tab" data-bs-toggle="tab" data-bs-target="#listTabPane" type="button" role="tab" aria-controls="listTabPane" aria-selected="false">List</button>
                        </li>
                    </ul>
                    <div class="tab-content" id="groupInfoTabContent">
                        <div class="tab-pane fade show active" id="tableTabPane" role="tabpanel" aria-labelledby="table-tab">
                            <div id="groupInfoModalBodyTable">Loading...</div>
                        </div>
                        <div class="tab-pane fade" id="listTabPane" role="tabpanel" aria-labelledby="list-tab">
                            <div id="groupInfoModalBodyList">Loading...</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentGroups = {}; // HHID → list of devices
        let modalInstance = null;
        let pendingBulkAction = null;
        let pendingBulkDevices = null;
        let setStringIp = null;
        let setStringHhid = null;

        function showModal(title, body) {
            const modalTitle = document.getElementById("commonModalTitle");
            const modalBody = document.getElementById("commonModalBody");
            const modalEl = document.getElementById("commonModal");

            modalTitle.textContent = title;
            modalBody.innerHTML = body;

            if (!modalInstance) {
                modalInstance = new bootstrap.Modal(modalEl, {
                    backdrop: 'static',
                    keyboard: true
                });
            }

            modalInstance.show();
        }

        function scanSonos() {
            const btn = document.getElementById("scanBtn");
            const spinner = document.getElementById("loadingSpinner");
            const results = document.getElementById("resultsTable");
            const status = document.getElementById("statusMsg");
            const filter = document.getElementById("hhidFilter");

            btn.disabled = true;
            spinner.style.display = "inline-block";
            results.innerHTML = "";
            status.innerText = "🔍 Scanning...";
            filter.innerHTML = `<option value="ALL">All HHIDs</option>`;

            currentGroups = {};

            const eventSource = new EventSource("/sonos-action/stream-sonos");

            eventSource.addEventListener("device", function (event) {
                const d = JSON.parse(event.data);
                const hhid = d["HHID"]?.trim() || "NO_HHID";

                if (!currentGroups[hhid]) {
                    currentGroups[hhid] = [];
                    addHHIDToFilter(hhid);
                }

                currentGroups[hhid].push(d);
                renderGroupedResults(currentGroups);
            });

            eventSource.onerror = function () {
                spinner.style.display = "none";
                btn.disabled = false;

                const total = Object.values(currentGroups).flat().length;
                status.innerText = `✅ Scan finished. ${total} player${total === 1 ? '' : 's'} found.`;

                eventSource.close();
            };
        }

        function addHHIDToFilter(hhid) {
            const filter = document.getElementById("hhidFilter");
            const exists = Array.from(filter.options).some(opt => opt.value === hhid);
            if (!exists) {
                const option = document.createElement("option");
                option.value = hhid;
                option.textContent = (hhid === "NO_HHID") ? "No HHID" : hhid;
                filter.appendChild(option);
            }
        }

        function rebootDevice(ip) {
            if (!confirm(`Reboot device at ${ip}?`)) return;
            showModal("Rebooting Device", "🔁 Sending reboot command...");
            fetch("/sonos-action/reboot?ip=" + ip, { method: "POST" })
                .then(res => res.text())
                .then(msg => showModal("Reboot Result", msg))
                .catch(err => showModal("Error", "❌ Reboot failed.<br>" + err));
        }

        function renameDevice(ip, currentName) {
            const newName = prompt("Enter new room name:", currentName);
            if (!newName || newName === currentName) return;

            const params = new URLSearchParams({ ip, name: newName, current: currentName });
            showModal("Renaming Device", `✏️ Renaming room <b>${currentName}</b> to <b>${newName}</b>...`);

            fetch("/sonos-action/rename?" + params.toString(), { method: "POST" })
                .then(res => res.text())
                .then(msg => showModal("Rename Result", msg))
                .catch(err => showModal("Error", "❌ Rename failed.<br>" + err));
        }

        function updateDevice(ip) {
            const url = prompt("Enter the full URL to the .upd file:");
            if (!url) return;

            showModal("Sending Update", "🔄 Updating device firmware...");

            fetch("/sonos-action/update?ip=" + ip + "&url=" + encodeURIComponent(url), {
                method: "POST"
            })
                .then(res => res.text())
                .then(msg => showModal("Update Result", msg))
                .catch(err => showModal("Error", "❌ Update failed.<br>" + err));
        }

        function submitDiagnostics(ip) {
            if (!confirm(`🧪 Submit diagnostics for device at ${ip}?`)) return;

            showModal("Submitting Diagnostics", "⏳ Sending request...");

            fetch(`/sonos-action/submit-diagnostics?ip=${ip}&includeControllers=1&type=user`, {
                method: "POST"
            })
                .then(res => res.text())
                .then(msg => showModal("Diagnostics Result", msg))
                .catch(err => showModal("Error", "❌ Failed to submit diagnostics.<br>" + err));
        }


        function renderGroupedResults(groups) {
            const filter = document.getElementById("hhidFilter");
            const selectedHHID = filter.value;
            const searchInput = document.getElementById("searchInput").value.trim().toLowerCase();
            const nameSearchInput = document.getElementById("nameSearchInput").value.trim().toLowerCase();
            const results = document.getElementById("resultsTable");
            results.innerHTML = "";

            let html = "";

            Object.entries(groups).forEach(([hhid, devices]) => {
                if (selectedHHID !== "ALL" && selectedHHID !== hhid) return;

                let filteredDevices = devices;

                // Apply search filter (model, mac, upd)
                if (searchInput.length > 0) {
                    filteredDevices = filteredDevices.filter(d => {
                        const model = (d["Model"] || "").toLowerCase();
                        const mac = (d["MAC Address"] || "").toLowerCase();
                        const hwv = (d["Hardware Version"] || "").toLowerCase();
                        let upd = "";
                        const match = hwv.match(/^1\.(\d+)\./);
                        if (match) upd = match[1] + "s";
                        return (
                            model.includes(searchInput) ||
                            mac.includes(searchInput) ||
                            upd.includes(searchInput)
                        );
                    });
                }
                // Apply name search filter
                if (nameSearchInput.length > 0) {
                    filteredDevices = filteredDevices.filter(d => {
                        const name = (d["Room Name"] || "").toLowerCase();
                        return name.includes(nameSearchInput);
                    });
                }

                if (filteredDevices.length === 0) return; // Skip if no match

                const label = (hhid === "NO_HHID") ? "No HHID ⚠️" : hhid;
                const firstDeviceIp = filteredDevices.length > 0 ? filteredDevices[0]["IP"] : null;

                let tableRows = "";
                filteredDevices.forEach(d => {
                    const ipId = d["IP"].replaceAll('.', '-');
                    let upd = "";
                    if (d["Hardware Version"]) {
                        const match = d["Hardware Version"].match(/^1\.(\d+)\./);
                        if (match) upd = match[1] + "s";
                    }

                    tableRows += `
<tr>
  <td class="align-middle text-center" style="width: 50px;">
    <input class="form-check-input form-check-sm custom-checkbox device-checkbox" 
           type="checkbox" value="${d["IP"]}" data-group="${hhid}" onclick="event.stopPropagation();">
  </td>
  <td style="width: 80px;">
    <img src="${d["Image"]}" alt="Icon" style="max-height: 56px;">
  </td>
  <td>
    <div class="fw-semibold text-primary">${d["Model"] || "Unknown"}</div>
    <div>
  IP: 
  <a href="http://${d["IP"]}:1400/status/zp" target="_blank" style="text-decoration: none; color: inherit;">
    ${d["IP"]}
  </a> 
  | <span id="latency-${ipId}">ping...</span>
</div>
    <div class="text-muted small">
      RoomName: ${d["Room Name"] || "-"} |
      Version: ${d["Software Version"] || "-"} |
      MAC: ${d["MAC Address"] || "-"} |
      UPD: ${upd || "-"}
    </div>
  </td>
</tr>`;
                });

                let groupHeader = `
<div class="mb-3 border rounded shadow-sm">
  <div class="px-3 py-2 d-flex align-items-center justify-content-between bg-primary-subtle border-bottom">
    <div class="d-flex align-items-center gap-2">
      <input type="checkbox" class="form-check-input form-check-sm" onclick="toggleAllInGroup(this, '${hhid}')">
      <span class="text-light-emphasis small">HHID:</span>
      <span class="fw-semibold text-dark-emphasis">${label}</span>
      ${firstDeviceIp && hhid !== "NO_HHID" ? `<a href='#' class='ms-2' title='Get System String' onclick='getSystemStringModal("${firstDeviceIp}", "${hhid}"); return false;'><i class="bi bi-info-circle text-info"></i></a> <a href='#' class='ms-1' title='Set System String' onclick='showSetStringModal("${firstDeviceIp}", "${hhid}"); return false;'><i class="bi bi-pencil-square text-primary"></i></a>` : ''}
    </div>
  </div>
  <div class="accordion-body p-0">
    <div class="table-responsive">
      <table class="table table-bordered table-sm table-striped mb-0">
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    </div>
  </div>
</div>`;
                html += groupHeader;
            });

            results.innerHTML = html;
        }

        setInterval(() => {
            fetch("/sonos-action/ping-status")
                .then(res => res.json())
                .then(data => {
                    data.forEach(({ ip, latency }) => {
                        const el = document.getElementById("latency-" + ip.replaceAll('.', '-'));
                        if (el) {
                            let dotClass = '';
                            let raw = latency;

                            if (latency === 'lost') {
                                dotClass = 'latency-danger';
                            } else {
                                const num = parseInt(latency);
                                if (num < 100) {
                                    dotClass = 'latency-success';
                                } else if (num < 300) {
                                    dotClass = 'latency-warning';
                                } else {
                                    dotClass = 'latency-danger';
                                }
                            }

                            el.innerHTML = `<span class="latency-dot ${dotClass}"></span>${raw}`;
                        }
                    });
                });
        }, 5000);


        function getActionDropdown(ip, roomName) {
            const safeRoom = roomName?.replace(/'/g, "\\'") || "";

            return `
<div class="dropdown text-end">
  <button class="btn btn-sm btn-outline-dark dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
    ⚙️ Actions
  </button>
  <ul class="dropdown-menu dropdown-menu-end">
    <li><a class="dropdown-item text-danger" href="#" onclick="rebootDevice('${ip}')">🔁 Reboot</a></li>
    <li><a class="dropdown-item text-secondary" href="#" onclick="renameDevice('${ip}', '${safeRoom}')">✏️ Rename</a></li>
    <li><a class="dropdown-item text-success" href="#" onclick="updateDevice('${ip}')">🔄 Update</a></li>
    <li><a class="dropdown-item text-info" href="#" onclick="submitDiagnostics('${ip}')">🧪 Diagnostics</a></li>
  </ul>
</div>`;
        }


        function toggleAllInGroup(source, group) {
            document.querySelectorAll(`.device-checkbox[data-group="${group}"]`)
                .forEach(cb => cb.checked = source.checked);
        }


        function performBulkAction(action) {
            const selected = Array.from(document.querySelectorAll('.device-checkbox:checked'))
                .map(cb => cb.value);

            if (selected.length === 0) {
                alert("Please select at least one device.");
                return;
            }

            if (action === 'update') {
                pendingBulkAction = action;
                pendingBulkDevices = selected;
                document.getElementById('bulkUpdateUrlInput').value = '';
                const modalEl = document.getElementById('bulkUpdateModal');
                const modal = new bootstrap.Modal(modalEl, { backdrop: 'static', keyboard: true });
                modal.show();
                return;
            }

            showModal("Sending Action", `⏳ Sending <b>${action}</b> to ${selected.length} device(s)...`);

            const payload = { action, devices: selected };

            fetch("/sonos-action/bulk", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
                .then(res => res.text())
                .then(msg => showModal("Bulk Action Complete", msg))
                .catch(err => showModal("Error", "❌ Failed: " + err));
        }

        function confirmBulkUpdate() {
            const baseUrl = document.getElementById('bulkUpdateUrlInput').value.trim();
            if (!baseUrl) {
                alert('Please enter a base URL.');
                return;
            }
            const action = pendingBulkAction;
            const selected = pendingBulkDevices;
            const modalEl = document.getElementById('bulkUpdateModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            showModal("Sending Action", `⏳ Sending <b>${action}</b> to ${selected.length} device(s)...`);

            const payload = { action, devices: selected, baseUrl };

            fetch("/sonos-action/bulk", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
                .then(res => res.text())
                .then(msg => showModal("Bulk Action Complete", msg))
                .catch(err => showModal("Error", "❌ Failed: " + err));
        }

        function getSystemStringModal(ip, hhid) {
            window._modalHHID = hhid;
            window._modalSystemString = null;
            const devices = (currentGroups[hhid] || []);
            // Classify devices by UPD
            const cep20 = [], cep25 = [];
            devices.forEach(d => {
                let upd = '';
                if (d["Hardware Version"]) {
                    const match = d["Hardware Version"].match(/^1\.(\d+)\./);
                    if (match) upd = match[1];
                }
                const updNum = parseInt(upd, 10);
                if (!isNaN(updNum) && (updNum <= 20 || updNum === 22)) {
                    cep20.push({ ...d, upd: upd });
                } else {
                    cep25.push({ ...d, upd: upd });
                }
            });
            // Default sort by IP
            function sortDevices(arr, col, asc) {
                arr.sort((a, b) => {
                    let v1 = a[col] || '';
                    let v2 = b[col] || '';
                    if (col === 'upd') { v1 = parseInt(v1, 10) || 0; v2 = parseInt(v2, 10) || 0; }
                    if (asc) {
                        if (v1 < v2) return -1;
                        if (v1 > v2) return 1;
                        return 0;
                    } else {
                        if (v1 > v2) return -1;
                        if (v1 < v2) return 1;
                        return 0;
                    }
                });
            }
            let sortCol = 'IP', sortAsc = true, sortTable = 'cep20';
            // Table view
            function renderTable(devices, tableId, label) {
                let html = `<div class='mb-2'><b>${label}</b> <span class='text-muted'>(Count: ${devices.length})</span></div><table class='table table-bordered table-sm' id='${tableId}'><thead><tr>`;
                const headers = [
                    { key: 'index', label: '#' },
                    { key: 'IP', label: 'IP' },
                    { key: 'Software Version', label: 'Software Version' },
                    { key: 'Model', label: 'Model' },
                    { key: 'upd', label: 'UPD' }
                ];
                headers.forEach(h => {
                    if (h.key === 'index') {
                        html += `<th style='width:40px'>${h.label}</th>`;
                    } else {
                        html += `<th style='cursor:pointer' onclick='window.sortGroupInfoTable("${tableId}", "${h.key}")'>${h.label} <span id='${tableId}_sort_${h.key}'></span></th>`;
                    }
                });
                html += `</tr></thead><tbody>`;
                devices.forEach((d, i) => {
                    html += `<tr><td>${i + 1}</td><td><a href='http://${d["IP"]}:1400/status/zp' target='_blank'>${d["IP"]}</a></td><td>${d["Software Version"] || "-"}</td><td>${d["Model"] || "-"}</td><td>${d.upd || "-"}</td></tr>`;
                });
                html += `</tbody></table>`;
                return html;
            }
            // List view
            function renderList(devices, label) {
                // Deduplicate by Model + Software Version
                const seen = new Set();
                const unique = [];
                devices.forEach((d) => {
                    const key = (d["Model"] || "-") + '|' + (d["Software Version"] || "-");
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(d);
                    }
                });
                let html = `<div class='mb-2'><b>${label} (${unique.length})</b></div><ul class='mb-3'>`;
                unique.forEach((d) => {
                    html += `<li>${d["Model"] || "-"} (${d["Software Version"] || "-"})</li>`;
                });
                html += `</ul>`;
                return html;
            }
            // Initial sort
            sortDevices(cep20, sortCol, sortAsc);
            sortDevices(cep25, sortCol, sortAsc);
            const firstDevice = devices[0];
            let top = `<div class='mb-3'><b>HHID:</b> <span class='fw-semibold'>${hhid}</span></div>`;
            if (firstDevice) {
                top += `<div class='mb-3'><b>OnlineUpdateBaseURL:</b> <span id='groupInfoSystemString'>⏳ Loading...</span></div>`;
            }
            let tableHtml = '';
            if (cep20.length > 0) tableHtml += renderTable(cep20, 'cep20', 'CEP20 Devices');
            if (cep25.length > 0) tableHtml += renderTable(cep25, 'cep25', 'CEP25 Devices');
            let listHtml = '';
            if (cep20.length > 0) listHtml += renderList(cep20, 'CEP20 Devices');
            if (cep25.length > 0) listHtml += renderList(cep25, 'CEP25 Devices');
            document.getElementById('groupInfoModalBodyTable').innerHTML = top + tableHtml;
            document.getElementById('groupInfoModalBodyList').innerHTML = top + listHtml;
            const modalEl = document.getElementById('groupInfoModal');
            const modal = new bootstrap.Modal(modalEl, { backdrop: 'static', keyboard: true });
            modal.show();
            // Fetch the system string for the first device
            if (firstDevice) {
                fetch(`/sonos-action/get-system-string?ip=${firstDevice["IP"]}`)
                    .then(res => res.text())
                    .then(val => {
                        document.getElementById('groupInfoSystemString').innerHTML = `<code>${val}</code>`;
                        window._modalSystemString = `<code>${val}</code>`;
                    })
                    .catch(err => {
                        document.getElementById('groupInfoSystemString').innerHTML = `<span class='text-danger'>❌ Failed: ${err}</span>`;
                        window._modalSystemString = `<span class='text-danger'>❌ Failed: ${err}</span>`;
                    });
            }
            // Save for sorting
            window._cep20 = cep20;
            window._cep25 = cep25;
            window._sortCol = sortCol;
            window._sortAsc = sortAsc;
            window._sortTable = sortTable;
            window.renderTable = renderTable;
            window.renderList = renderList;
        }

        function showSetStringModal(ip, hhid) {
            setStringIp = ip;
            setStringHhid = hhid;
            document.getElementById('setStringHhid').textContent = hhid;
            document.getElementById('setStringValueInput').value = '';
            const modalEl = document.getElementById('setStringModal');
            const modal = new bootstrap.Modal(modalEl, { backdrop: 'static', keyboard: true });
            modal.show();
        }

        function confirmSetString() {
            const value = document.getElementById('setStringValueInput').value.trim();
            if (!value) {
                alert('Please enter a value.');
                return;
            }
            const modalEl = document.getElementById('setStringModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();
            showModal('Setting System String', '⏳ Sending request...');
            fetch(`/sonos-action/set-system-string?ip=${encodeURIComponent(setStringIp)}&stringValue=${encodeURIComponent(value)}`, {
                method: 'POST'
            })
                .then(res => res.text())
                .then(msg => showModal('Set System String Result', msg))
                .catch(err => showModal('Error', '❌ Failed: ' + err));
        }

        // Patch: Attach sorting functions to window for modal tables
        window.sortGroupInfoTable = function(tableId, col) {
            let arr = tableId === 'cep20' ? window._cep20 : window._cep25;
            if (window._sortTable === tableId && window._sortCol === col) {
                window._sortAsc = !window._sortAsc;
            } else {
                window._sortCol = col;
                window._sortAsc = true;
                window._sortTable = tableId;
            }
            // Resort
            const sortDevices = (arr, col, asc) => {
                arr.sort((a, b) => {
                    let v1 = a[col] || '';
                    let v2 = b[col] || '';
                    if (col === 'upd') { v1 = parseInt(v1, 10) || 0; v2 = parseInt(v2, 10) || 0; }
                    if (asc) {
                        if (v1 < v2) return -1;
                        if (v1 > v2) return 1;
                        return 0;
                    } else {
                        if (v1 > v2) return -1;
                        if (v1 < v2) return 1;
                        return 0;
                    }
                });
            };
            sortDevices(arr, col, window._sortAsc);
            // Re-render only the table tab
            let tableHtml = '';
            if (window._cep20.length > 0) tableHtml += window.renderTable(window._cep20, 'cep20', 'CEP20 Devices');
            if (window._cep25.length > 0) tableHtml += window.renderTable(window._cep25, 'cep25', 'CEP25 Devices');
            let top = `<div class='mb-3'><b>HHID:</b> <span class='fw-semibold'>${window._modalHHID || ''}</span></div>`;
            if (window._modalSystemString !== null) top += `<div class='mb-3'><b>OnlineUpdateBaseURL:</b> ${window._modalSystemString}</div>`;
            document.getElementById('groupInfoModalBodyTable').innerHTML = top + tableHtml;
            // Update sort indicators
            ['cep20','cep25'].forEach(tid => {
                ['IP','Software Version','Model','upd'].forEach(k => {
                    const el = document.getElementById(`${tid}_sort_${k}`);
                    if (el) el.innerHTML = (window._sortTable === tid && window._sortCol === k) ? (window._sortAsc ? '▲' : '▼') : '';
                });
            });
        };

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
