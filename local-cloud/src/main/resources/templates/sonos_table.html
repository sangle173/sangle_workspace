<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Sonos Discovery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>🎵 Sonos Devices Found</h2>
        <a href="/discover-sonos" class="btn btn-primary">
            🔁 Rescan Devices
        </a>
    </div>
    

    <table class="table table-bordered table-striped">
        <thead class="table-light">
            <tr>
                <th>IP</th>
                <th>Latency</th>
                <th>MAC Address</th>
                <th>Room Name</th>
                <th>Model</th>
                <th>Software Version</th>
                <th>Hardware Version</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="dev : ${devices}">
                <td>
                    <a th:href="'http://' + ${dev['IP']} + ':1400/status/zp'" target="_blank"
                        th:text="${dev['IP']}">IP</a>
                </td>
                <td th:text="${dev['Latency']}">Latency</td>
                <td th:text="${dev['MAC Address']}">MAC</td>
                <td th:text="${dev['Room Name']}">Room</td>
                <td th:text="${dev['Model']}">Model</td>
                <td th:text="${dev['Software Version']}">SW</td>
                <td th:text="${dev['Hardware Version']}">HW</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
