# Thymeleaf settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server configuration
server.port=8080
server.servlet.context-path=/
spring.application.name=Local Cloud

# Maximum file upload size (for regular uploads)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# File upload settings for large file uploads (CUT feature)
# 50GB limit for video uploads
large-file.max-file-size=53687091200
large-file.min-chunk-size=1048576
large-file.max-chunk-size=52428800
spring.servlet.multipart.file-size-threshold=2MB

# Static file serving
# Serves files from the Desktop/LocalCloudUploads folder under /uploads/**
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:${user.home}/Desktop/LocalCloudUploads/
spring.mvc.static-path-pattern=/uploads/**

# Logging settings to help debug request mapping
logging.level.org.springframework.web=INFO
logging.level.com.example.local_cloud.controller=DEBUG

# Jira API Configuration
jira.url=https://jira.sonos.com
jira.token=

# Add your existing application properties below

