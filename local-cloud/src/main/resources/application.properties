# Thymeleaf settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server configuration
server.port=8080

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB

# Static file serving
# Serves files from the Desktop/LocalCloudUploads folder under /uploads/**
spring.web.resources.static-locations=classpath:/static/,file:${user.home}/Desktop/LocalCloudUploads/
spring.mvc.static-path-pattern=/uploads/**

# Base path for storing notes (using Desktop note folder)
notes.base-path=${user.home}/Desktop/note

# Log level for note operations
logging.level.com.example.local_cloud.service=DEBUG
logging.level.com.example.local_cloud.controller=DEBUG
