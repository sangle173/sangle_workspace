# Thymeleaf settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Max upload size
spring.servlet.multipart.max-file-size=20000MB
spring.servlet.multipart.max-request-size=20000MB

# Static file serving
# Serves files from the Desktop/LocalCloudUploads folder under /uploads/**
spring.web.resources.static-locations=classpath:/static/,file:${user.home}/Desktop/LocalCloudUploads/
spring.mvc.static-path-pattern=/uploads/**


# Base path where notes and folders are stored
# notes.base-path=${user.home}/Desktop/note
notes.base-path=C:/Users/leduc/Desktop/note
